# Builds HAWK's data files and publishes the whole site to GitHub Pages.
#
# Runs every 3 hours, whenever you upload/commit to main, and on demand
# (Actions tab -> "HAWK data + site" -> Run workflow).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: HAWK data + site

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r engine/requirements.txt

      - name: Build data files (player stats, team ratings, fixture links)
        # If a source is down, the site still publishes with whatever was built.
        continue-on-error: true
        working-directory: engine
        run: python build_data.py ../data

      # HAWK grades itself: saves its chances for matches kicking off soon and
      # marks earlier ones right or wrong (engine/grade.mjs). The state it needs
      # between runs is kept in the Actions cache.
      - name: Restore grading state
        uses: actions/cache/restore@v4
        with:
          path: data/grading
          key: hawk-grading-${{ github.run_id }}
          restore-keys: hawk-grading-

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Grade HAWK's predictions
        continue-on-error: true
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          node engine/grade.mjs

      - name: Save grading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/grading
          key: hawk-grading-${{ github.run_id }}

      # Data health: a summary on the run's page, and which sources (if any)
      # haven't worked for 24 hours+ (the "alert" job below then fails, and
      # GitHub emails you). The site still publishes with the last good data.
      - name: Data health
        id: health
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          try:
              m = json.load(open("data/meta.json", encoding="utf-8"))
          except Exception as e:
              m = {"alerts": ["data build"], "problems": [f"no meta.json ({e})"], "sources": {}}
          lines = ["## HAWK data health", ""]
          for name, s in (m.get("sources") or {}).items():
              lines.append(f"- {'✅' if s.get('ok') else '⚠️'} **{name}** — last worked {s.get('last_ok')}")
          h = m.get("health") or {}
          if h:
              p, r = h.get("players", {}), h.get("ratings", {})
              lines.append(f"- Player stats: {p.get('fresh', 0)} fresh, {p.get('reused', 0)} from the last run, {p.get('missing', 0)} missing")
              lines.append(f"- Team ratings: {r.get('fresh', 0)} fresh, {r.get('reused', 0)} from the last run, {r.get('missing', 0)} missing")
          lines += ["", *[f"- {x}" for x in m.get("problems", [])[:30]]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"alerts={', '.join(m.get('alerts') or [])}\n")
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
    outputs:
      alerts: ${{ steps.health.outputs.alerts }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fails (so GitHub emails you) only when a source has been down 24h+.
  alert:
    needs: [build, deploy]
    if: needs.build.outputs.alerts != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::HAWK data source down for 24h+: ${{ needs.build.outputs.alerts }}. The site is running on the last good data — see the run summary."
          exit 1
