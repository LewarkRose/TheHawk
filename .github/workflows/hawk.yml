# Builds HAWK's data files and publishes the whole site to GitHub Pages.
#
# Runs every 3 hours, whenever you upload/commit to main, and on demand
# (Actions tab -> "HAWK data + site" -> Run workflow).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: HAWK data + site

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r engine/requirements.txt

      - name: Build data files (player stats, team ratings, fixture links)
        # If a source is down, the site still publishes with whatever was built.
        continue-on-error: true
        working-directory: engine
        run: python build_data.py ../data

      # HAWK grades itself: saves its chances for matches kicking off soon and
      # marks earlier ones right or wrong (engine/grade.mjs). The state it needs
      # between runs is kept in the Actions cache.
      - name: Restore grading state
        uses: actions/cache/restore@v4
        with:
          path: data/grading
          key: hawk-grading-${{ github.run_id }}
          restore-keys: hawk-grading-

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Grade HAWK's predictions
        continue-on-error: true
        run: |
          python -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          node engine/grade.mjs

      - name: Save grading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/grading
          key: hawk-grading-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
