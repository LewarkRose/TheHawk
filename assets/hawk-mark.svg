<!-- The crest, in the rebuilt site's own colours.

     Same geometry as favicon.svg — the shield fills the whole frame with no
     margin and no plate behind it, because a tab gives you sixteen pixels and
     any spent on a border is how a mark ends up looking tiny, and the hawk is
     cut out of the shield with its wings reaching both edges so the shape
     still reads as wings rather than a smudge.

     The only change is the colour. favicon.svg's own comment says the hawk is
     "cut out of the gold" while its gradient has always been navy; here it
     actually is. Navy is light in this language, not a surface — see the nav,
     where the same two paths are drawn inline so they can take the page's
     variables and lift on hover. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dba4"/>
      <stop offset="1" stop-color="#b8882f"/>
    </linearGradient>
  </defs>
  <path d="M32 1 L62 10 V36 C62 50 48 60 32 63 C16 60 2 50 2 36 V10 Z" fill="url(#g)"/>
  <path d="M32 15 L36 21 L32 25 L28 21 Z M30 27 L6 17 L13 26 L6 28 L16 34 L30 39 Z M34 27 L58 17 L51 26 L58 28 L48 34 L34 39 Z M28 42 L32 54 L36 42 L32 45 Z" fill="#080809"/>
</svg>
