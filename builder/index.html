<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAWK · Bet Builder</title>
<style>
:root{
  --bg:#0d1114; --panel:#151b1f; --panel2:#1b2328; --line:#25313a; --text:#e8eff3; --muted:#8797a3;
  --accent:#14e3a1; --accent-d:#0a9e70; --gold:#ffd166; --red:#ff5d73; --blue:#4aa8ff; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}
.top{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#121a1e,#0d1114);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:18px}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#062;font-weight:900;
  background:conic-gradient(from 200deg,var(--accent),#7cf7cf,var(--accent));box-shadow:0 0 18px rgba(20,227,161,.45)}
.brand em{font-style:normal;font-weight:500;letter-spacing:.02em;color:var(--muted);font-size:13px}
.vaultlink{color:#d9b571;text-decoration:none;font-weight:700;font-size:13px;padding:6px 12px;border:1px solid #6b5530;border-radius:999px;white-space:nowrap}
.vaultlink:hover{background:rgba(217,181,113,.1)}
.ghost.vault{color:#d9b571;border-color:#6b5530}
.ghost.vault:hover{background:rgba(217,181,113,.08)}
.leagues{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pill{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;
  transition:.15s}
.pill:hover{border-color:#3a4a55}
.pill.on{background:var(--accent);color:#04241a;border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 400px;gap:16px;padding:16px 22px;align-items:start}
@media (max-width:1250px){.grid{grid-template-columns:260px minmax(0,1fr)}.slipcol{grid-column:1/-1}}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.fixtures{padding:10px;max-height:calc(100vh - 100px);overflow:auto;position:sticky;top:78px}
.fx{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.15s}
.fx:hover{background:var(--panel2)}
.fx.on{background:var(--panel2);border-color:var(--accent)}
.fx .team{display:flex;align-items:center;gap:8px;font-weight:600}
.fx .team img{width:20px;height:20px}
.fx .when{grid-row:1/3;grid-column:2;align-self:center;text-align:right;color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge.live{background:rgba(255,93,115,.15);color:var(--red)}
.badge.ok{background:rgba(20,227,161,.14);color:var(--accent)}
.badge.warn{background:rgba(255,209,102,.14);color:var(--gold)}
.muted{color:var(--muted)}
.empty{padding:60px 30px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:10px 0 6px;font-size:22px}
.hero{padding:22px 24px;border-radius:16px 16px 0 0;
  background:radial-gradient(1200px 200px at 50% -60px,rgba(20,227,161,.18),transparent),linear-gradient(180deg,#18242a,#151b1f)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.side img{width:64px;height:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.side .nm{font-size:18px;font-weight:800}
.mid{text-align:center}
.mid .ko{font-size:13px;color:var(--muted)}
.mid .x{font-size:28px;font-weight:900;color:#3d4d58;letter-spacing:.1em}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.section{padding:16px 24px;border-top:1px solid var(--line)}
.section h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar3{display:flex;height:34px;border-radius:10px;overflow:hidden;font-weight:800;font-size:13px}
.bar3 div{display:flex;align-items:center;justify-content:center;min-width:34px;transition:flex .6s}
.bar3 .h{background:var(--accent);color:#04241a}.bar3 .d{background:#34424c}.bar3 .a{background:var(--blue);color:#061a2c}
.srcs{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1000px){.two{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
.cs{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;font-size:12px}
.cs .hd{color:var(--muted);text-align:center;align-self:center}
.cs .c{border-radius:7px;padding:7px 0;text-align:center;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--muted);border:1px solid transparent}
.tab.on{color:var(--text);border-color:var(--line);background:var(--panel2)}
.team-head{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.team-head img{width:22px;height:22px}
.pl{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);margin-bottom:8px}
.pl .ph{width:40px;height:40px;border-radius:50%;background:#26323b center/cover;overflow:hidden}
.pl .ph img{width:40px;height:40px;object-fit:cover}
.pl .top1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pl .nm{font-weight:700}
.pos{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:#2b3842;color:#b9c7d1;margin-left:6px}
.rates{font-size:12px;color:var(--muted)}
.spark{display:flex;gap:2px;align-items:flex-end;height:18px}
.spark i{display:block;width:5px;background:#35505e;border-radius:2px}
.spark i.hit{background:var(--accent)}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.qc{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#22303a;border:1px solid #2e3e49;cursor:pointer;transition:.12s}
.qc:hover{border-color:var(--accent);color:var(--accent)}
.qc.in{background:rgba(20,227,161,.16);border-color:var(--accent);color:var(--accent)}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:10px}
.lg{margin-bottom:14px}
.lg h4{margin:0 0 6px;font-size:12px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:1fr 64px 56px 64px 30px;gap:8px;align-items:center;padding:7px 10px;border-radius:9px}
.lhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 10px 4px}
.lrow:hover{background:var(--panel2)}
.pb{height:5px;border-radius:3px;background:#24313a;overflow:hidden}
.pb span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent))}
.add{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.add:hover{border-color:var(--accent);color:var(--accent)}
/* slip */
/* The slip sticks beside the match and scrolls on its own when the ticket is long. */
.slipcol{position:sticky;top:78px;max-height:calc(100vh - 94px);overflow-y:auto;border-radius:16px;
  scrollbar-width:thin;scrollbar-color:#2f3d47 transparent}
.slipcol::-webkit-scrollbar{width:8px}
.slipcol::-webkit-scrollbar-thumb{background:#2f3d47;border-radius:8px}
@media (max-width:1250px){.slipcol{position:static;max-height:none;overflow:visible}}
.bp{font-size:12px;color:var(--muted)}
.bp b{color:var(--text);font-weight:700}
.bp.val b{color:var(--accent)}
.slip{padding:16px}
.target{display:flex;align-items:baseline;justify-content:space-between}
.target .big{font-size:34px;font-weight:900;color:var(--gold);letter-spacing:.02em}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:10px 0}
.seg button{border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:#27353f;color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin:-4px 2px 10px}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.opts select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.build{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;cursor:pointer;font-weight:900;letter-spacing:.06em;
  color:#03261b;background:linear-gradient(90deg,#10c98e,#3ff5bd,#10c98e);background-size:200% 100%;animation:shine 3s linear infinite;
  box-shadow:0 8px 24px rgba(20,227,161,.3)}
.build:disabled{opacity:.5;cursor:default}
@keyframes shine{to{background-position:-200% 0}}
.ticket{margin-top:14px;border-radius:14px;border:1px solid var(--accent);background:linear-gradient(180deg,#1a2a2c,#172024);overflow:hidden}
.ticket .th{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.ticket .th b{color:var(--accent);font-style:italic;letter-spacing:.04em;font-size:15px}
.ticket .th .odds{font-size:20px;font-weight:900}
.legs{position:relative;padding:0 14px 6px 14px}
.leg{position:relative;padding:8px 0 10px 28px;animation:in .35s both}
.leg::before{content:"";position:absolute;left:8px;top:22px;bottom:-8px;width:2px;background:#2d4a44}
.leg:last-child::before{display:none}
.leg .ck{position:absolute;left:0;top:9px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#03261b;
  display:grid;place-items:center;font-size:11px;font-weight:900}
.leg .l1{display:flex;justify-content:space-between;gap:8px}
.leg .lb{font-weight:700}
.leg .mk{font-size:12px;color:var(--muted)}
.leg .rt{text-align:right;white-space:nowrap}
.leg .rt .pp{font-weight:800}
.leg .rt .fo{font-size:12px;color:var(--muted)}
.leg .acts{display:flex;gap:4px;margin-top:4px}
.leg .acts button{font-size:11px;border:1px solid var(--line);background:transparent;border-radius:7px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.leg .acts button.on{color:var(--gold);border-color:var(--gold)}
.leg .pb{margin-top:6px}
@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;border-top:1px solid #294640;background:rgba(20,227,161,.05)}
.sum .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sum .v{font-size:20px;font-weight:900}
.check{margin-top:12px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.check .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.check input{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#12181c;font-size:16px;font-weight:700}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:700}
.verdict.good{background:rgba(20,227,161,.14);color:var(--accent)}
.verdict.bad{background:rgba(255,93,115,.12);color:var(--red)}
.verdict small{display:block;font-weight:500;color:var(--text);opacity:.8;margin-top:2px}
.ghost{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--text);border-color:#3a4a55}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.warn{font-size:12.5px;color:var(--gold);background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.25);border-radius:10px;padding:8px 10px;margin-top:10px}
.vcard{margin-top:12px;padding:12px;border-radius:12px;border:1px dashed var(--line)}
.vcard h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.skel{padding:40px 24px}
.skel .ln{height:14px;border-radius:7px;background:linear-gradient(90deg,#1c252b,#243039,#1c252b);background-size:200% 100%;
  animation:shine 1.4s linear infinite;margin:12px 0}
.loading-msg{color:var(--accent);font-weight:700;margin-bottom:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#22303a;border:1px solid var(--line);
  padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{opacity:1}
/* header tools */
.tools{margin-left:auto;display:flex;gap:8px;position:relative;flex-shrink:0}
.tool{padding:7px 14px;border-radius:999px;border:1px solid var(--accent);background:rgba(20,227,161,.08);color:var(--accent);
  cursor:pointer;font-weight:700;white-space:nowrap}
.tool:hover{background:rgba(20,227,161,.16)}
.tool.bell{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.08)}
.pop{position:absolute;right:0;top:44px;width:300px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:10px;z-index:10}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;font-size:13px}
.pop .row button{border:0;background:transparent;color:var(--muted);cursor:pointer}
.fx .bellmark{color:var(--gold);font-size:12px;margin-left:4px}
/* best builders scan */
.prog{height:8px;border-radius:5px;background:#24313a;overflow:hidden;margin-top:12px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));transition:width .4s}
.scard{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel2);margin-bottom:10px;cursor:pointer;transition:.15s;animation:in .3s both}
.scard:hover{border-color:var(--accent)}
.scard .teams{display:flex;align-items:center;gap:7px;font-weight:800;flex-wrap:wrap}
.scard .teams img{width:20px;height:20px}
.lchip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:#22303a;border:1px solid #2e3e49;margin:4px 4px 0 0}
.lchip.pl{border-color:rgba(74,168,255,.45)}
.vline{font-size:12px;color:var(--accent);margin-top:6px}
.bigodds{font-size:24px;font-weight:900;color:var(--gold)}
/* player deep-dive */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,8,.7);display:grid;place-items:center;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(780px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:20px 22px}
.mhead{display:flex;align-items:center;gap:14px}
.mhead .ph{width:64px;height:64px;border-radius:50%;background:#26323b;overflow:hidden;flex-shrink:0}
.mhead .ph img{width:64px;height:64px;object-fit:cover}
.mhead .x{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:10px;width:34px;height:34px;cursor:pointer;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:210px;margin:18px 0 6px;padding:0 4px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .marks{font-size:12px;height:16px;white-space:nowrap}
.chart .num{font-size:12px;font-weight:800}
.chart .bw{height:140px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .bar{width:62%;max-width:34px;background:#3a4a55;border-radius:6px 6px 0 0;position:relative;min-height:2px}
.chart .sotb{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:6px 6px 0 0}
.xlabels{display:flex;gap:8px;padding:0 4px}
.xlabels div{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pl .nm,.pl .ph{cursor:pointer}
.pl .nm:hover{color:var(--accent)}
/* floating "jump to slip" button, shown when the slip isn't beside the match */
.jump{display:none;position:fixed;right:14px;bottom:18px;z-index:15;padding:11px 16px;border-radius:999px;border:0;cursor:pointer;
  font-weight:900;color:#03261b;background:linear-gradient(90deg,#10c98e,#3ff5bd);box-shadow:0 8px 24px rgba(0,0,0,.45)}
@media (max-width:1250px){.jump{display:block}}
/* phones */
@media (max-width:820px){
  .top{position:static;flex-wrap:wrap;gap:10px;padding:10px 12px}
  .brand em{display:none}
  .leagues{order:3;width:100%}
  .tools{margin-left:auto}
  .tool{padding:6px 10px;font-size:12px}
  .vaultlink{padding:5px 10px}
  .grid{padding:10px;gap:10px}
  .fixtures{position:static;max-height:38vh}
  .hero{padding:16px 12px}
  .section{padding:12px 14px}
  .side img{width:46px;height:46px}
  .side .nm{font-size:15px}
  .mid .x{font-size:20px}
  .cs{font-size:11px}
  .cs .c{padding:6px 0}
  .lrow{grid-template-columns:1fr 52px 44px 50px 28px;gap:6px;padding:7px 4px}
  .modal{padding:14px}
  .chart{gap:4px}
  .hits{grid-template-columns:repeat(2,1fr)}
  .scard{grid-template-columns:1fr}
  .scard > div:last-child{text-align:left;display:flex;align-items:center;gap:12px}
}
</style>
</head>
<body>
<header class="top">
  <a class="vaultlink" href="../" title="Back to the HAWK Vault">← Vault</a>
  <div class="brand"><div class="mark">H</div>HAWK <em>bet builder</em></div>
  <nav class="leagues" id="leagues"></nav>
  <div class="tools">
    <button class="tool" id="scanBtn">⚡ Best builders</button>
    <button class="tool bell" id="watchBtn" hidden></button>
    <div class="pop" id="watchPop" hidden></div>
  </div>
</header>
<main class="grid">
  <aside class="panel fixtures" id="fixtures"><div class="empty">Loading leagues…</div></aside>
  <section class="panel" id="match">
    <div class="empty"><div style="font-size:42px">🦅</div><h2>Pick a fixture</h2>
      HAWK simulates the match thousands of times — goals, shots, shots on target, corners and cards, player by player —
      then builds you a bet builder at the odds you want.</div>
  </section>
  <aside class="slipcol"><div class="panel slip" id="slip"></div></aside>
</main>
<button class="jump" id="jump" onclick="document.getElementById('slip').scrollIntoView({ behavior: 'smooth' })">🎟 Slip</button>
<div id="toast"></div>

<script src="engine.js"></script>
<script>
const S = { league: null, fixtures: [], match: null, legs: {}, slip: [], locked: new Set(), banned: new Set(),
            target: 3.25, style: "Balanced", focus: "Mix", maxLegs: 10, favourite: true, result: null, tab: "players", q: "",
            view: "match", allLeagues: [], scan: { leagues: null, hours: 24, sort: "legs", data: null, timer: null },
            watch: [] };
const FOCUS_LABELS = { Mix: "Mix", Players: "Player props", Match: "Match stats" };
// Display names for the builder styles (the keys are what the server expects).
const STYLES = {
  Banker: { label: "Safe legs", hint: "Lots of very likely legs (72–95% each) — takes more legs to reach your odds." },
  Balanced: { label: "Mixed", hint: "Legs between 55% and 90% — a bit of both." },
  Punchy: { label: "Bold legs", hint: "Fewer, bolder legs (35–78% each), like to score or 2+ on target. Fewer legs usually means a smaller bookmaker margin." },
};
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (p, d = 0) => p == null ? "–" : (100 * p).toFixed(d) + "%";
const odds = (o) => o == null ? "–" : o.toFixed(2);
const capitalise = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const sliderToOdds = (v) => 1.5 * Math.pow(25 / 1.5, v / 100);
const oddsToSlider = (o) => 100 * Math.log(o / 1.5) / Math.log(25 / 1.5);

// True when the slip sits below the match instead of beside it (phones, small windows).
const narrow = () => window.matchMedia("(max-width: 1250px)").matches;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
// On GitHub Pages there's no server: the same /api calls the local app makes
// are answered by the HAWK engine running in this page (engine.js).
async function api(path, body) {
  const [p, query] = path.split("?");
  const q = Object.fromEntries(new URLSearchParams(query || ""));
  switch (p) {
    case "/api/leagues": return { leagues: HAWK.LEAGUES };
    case "/api/fixtures": return { fixtures: await HAWK.fixtures(q.league) };
    case "/api/match": return HAWK.match(q.league, q.id, q.refresh === "1");
    case "/api/lineups": return HAWK.lineups(q.id);
    case "/api/build": return HAWK.build(body);
    case "/api/evaluate": return HAWK.evaluate(body);
    case "/api/scan": return body ? HAWK.startScan(body) : HAWK.scanStatus();
    case "/api/scan/stop": return HAWK.stopScan();
  }
  throw new Error("unknown request " + p);
}
function fmtKick(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + " · " +
         d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

/* ---------- leagues & fixtures ---------- */
async function init() {
  const { leagues } = await api("/api/leagues");
  S.allLeagues = leagues;
  S.scan.leagues = new Set(leagues);
  $("#leagues").innerHTML = leagues.map(l => `<button class="pill" data-l="${esc(l)}">${esc(l)}</button>`).join("");
  $("#leagues").onclick = (e) => { const b = e.target.closest(".pill"); if (b) selectLeague(b.dataset.l); };
  $("#scanBtn").onclick = showScan;
  $("#watchBtn").onclick = () => { const p = $("#watchPop"); p.hidden = !p.hidden; };
  S.watch = loadWatch();
  renderWatch();
  HAWK.meta().then(meta => {
    if (!meta || !meta.generated) return;
    const mins = Math.round((Date.now() - new Date(meta.generated).getTime()) / 60000);
    S.dataAge = mins < 90 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
    renderSlip();
  });
  renderSlip();
  await selectLeague(leagues[0]);
  checkLineups();
  setInterval(checkLineups, 120000);
}
async function selectLeague(league) {
  S.league = league;
  document.querySelectorAll(".pill[data-l]").forEach(p => p.classList.toggle("on", p.dataset.l === league));
  $("#fixtures").innerHTML = `<div class="skel"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>`;
  try {
    const { fixtures } = await api("/api/fixtures?league=" + encodeURIComponent(league));
    S.fixtures = fixtures;
    renderFixtures();
  } catch (err) { $("#fixtures").innerHTML = `<div class="empty">Couldn't load fixtures.<br>${esc(err.message)}</div>`; }
}
function renderFixtures() {
  const openId = S.view === "match" && S.match ? String(S.match.id) : null;
  $("#fixtures").innerHTML = S.fixtures.length ? S.fixtures.map(f => `
    <div class="fx ${String(f.id) === openId ? "on" : ""}" data-id="${f.id}">
      <div class="team"><img src="${esc(f.homeCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(f.home)}${isWatched(f.id) ? '<span class="bellmark" title="Lineup alert on">🔔</span>' : ""}</div>
      <div class="team"><img src="${esc(f.awayCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(f.away)}</div>
      <div class="when">${f.started ? '<span class="badge live">STARTED</span>' : esc(fmtKick(f.kickoff)).replace(" · ", "<br>")}</div>
    </div>`).join("") : `<div class="empty">No upcoming fixtures.</div>`;
  $("#fixtures").onclick = (e) => { const f = e.target.closest(".fx"); if (f) openMatch(f.dataset.id); };
}

/* ---------- match ---------- */
const LOADING = ["Reading lineups…", "Checking 12 bookmakers + Polymarket…", "Rating both teams…", "Simulating 12,000 matches…", "Sharing out shots player by player…"];
// Opens a match from anywhere (fixture list, scan results, lineup alerts),
// switching league first if needed.
async function goToMatch(league, id) {
  if (S.league !== league) await selectLeague(league);
  await openMatch(id);
}
async function openMatch(id, refresh = false) {
  S.view = "match";
  document.querySelectorAll(".fx").forEach(f => f.classList.toggle("on", f.dataset.id === String(id)));
  let i = 0;
  $("#match").innerHTML = `<div class="skel"><div class="loading-msg" id="lm">${LOADING[0]}</div>${'<div class="ln"></div>'.repeat(8)}</div>`;
  const timer = setInterval(() => { const el = $("#lm"); if (el) el.textContent = LOADING[++i % LOADING.length]; }, 1100);
  try {
    const m = await api(`/api/match?league=${encodeURIComponent(S.league)}&id=${id}${refresh ? "&refresh=1" : ""}`);
    S.match = m; S.legs = Object.fromEntries(m.legs.map(l => [l.id, l]));
    if (!refresh) { S.slip = []; S.locked = new Set(); S.banned = new Set(); S.result = null; }
    renderMatch(); renderSlip();
    if (!refresh && narrow()) $("#match").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    $("#match").innerHTML = `<div class="empty"><h2>Couldn't analyse this match</h2>${esc(err.message)}</div>`;
  } finally { clearInterval(timer); }
}

function renderMatch() {
  const m = S.match, p = m.probs, e = m.expected;
  const chip = (side) => { const lu = m.lineups[side]; const ok = lu.status === "Confirmed";
    return `<span class="badge ${ok ? "ok" : "warn"}">${ok ? "Lineup confirmed" : "Lineup predicted"}${lu.formation ? " · " + esc(lu.formation) : ""}</span>`; };
  const ord = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const tbl = (side) => m.table[side] ? `${ord(m.table[side].position)} · ${Math.round(m.table[side].points)} pts` : "";
  const maxCell = Math.max(...m.grid.flat());
  const cell = (v) => `<div class="c" style="background:rgba(20,227,161,${(0.08 + 0.75 * v / maxCell).toFixed(3)})">${(100 * v).toFixed(1)}%</div>`;
  const srcs = [];
  if (p.market) srcs.push(`Bookmakers (${p.market.sources}): ${pct(p.market.home)} · ${pct(p.market.draw)} · ${pct(p.market.away)}`);
  if (p.polymarket) srcs.push(`Polymarket: ${pct(p.polymarket.home)} · ${pct(p.polymarket.draw)} · ${pct(p.polymarket.away)}`);
  $("#match").innerHTML = `
    <div class="hero">
      <div class="vs">
        <div class="side"><img src="${esc(m.homeCrest)}" alt="" onerror="this.style.visibility='hidden'"><div class="nm">${esc(m.home)}</div>
          <div class="muted">${esc(tbl("home"))}${m.form.home ? " · " + esc(m.form.home) : ""}</div>${chip("home")}</div>
        <div class="mid"><div class="x">VS</div><div class="ko">${esc(fmtKick(m.kickoff))}</div>
          ${m.started ? '<div class="chips"><span class="badge live">STARTED — pre-match model</span></div>' : ""}
          ${m.referee && m.referee.name ? `<div class="ko" style="margin-top:6px">Ref: ${esc(m.referee.name)}${m.referee.avg ? ` · ${m.referee.avg.toFixed(2)} cards/g` : ""}</div>` : ""}
          <button class="ghost" style="width:auto;padding:5px 10px;margin-top:8px" onclick="openMatch('${m.id}', true)">↻ Refresh</button>
          ${!m.started && !(m.lineups.home.status === "Confirmed" && m.lineups.away.status === "Confirmed") ?
            `<br><button class="ghost" style="width:auto;padding:5px 10px;margin-top:6px;${isWatched(m.id) ? "color:var(--gold);border-color:var(--gold)" : ""}"
              onclick="toggleWatch()">${isWatched(m.id) ? "🔕 Stop lineup alert" : "🔔 Alert me when lineups are confirmed"}</button>` : ""}</div>
        <div class="side"><img src="${esc(m.awayCrest)}" alt="" onerror="this.style.visibility='hidden'"><div class="nm">${esc(m.away)}</div>
          <div class="muted">${esc(tbl("away"))}${m.form.away ? " · " + esc(m.form.away) : ""}</div>${chip("away")}</div>
      </div>
    </div>
    <div class="section">
      <h3>Win probability</h3>
      <div class="bar3"><div class="h" style="flex:${p.home}">${pct(p.home)}</div><div class="d" style="flex:${p.draw}">${pct(p.draw)}</div><div class="a" style="flex:${p.away}">${pct(p.away)}</div></div>
      <div class="srcs">${srcs.map(esc).map(s => `<span>${s}</span>`).join("")}</div>
    </div>
    <div class="section"><div class="tiles">
      <div class="tile"><div class="k">Expected goals</div><div class="v">${e.goals[0].toFixed(2)} – ${e.goals[1].toFixed(2)}</div></div>
      <div class="tile"><div class="k">Shots on target</div><div class="v">${e.sot[0].toFixed(1)} – ${e.sot[1].toFixed(1)}</div></div>
      <div class="tile"><div class="k">Corners</div><div class="v">${e.corners.toFixed(1)}</div></div>
      <div class="tile"><div class="k">Cards</div><div class="v">${(e.cards[0] + e.cards[1]).toFixed(1)}</div></div>
    </div></div>
    <div class="section two">
      <div><h3>Correct score</h3>
        <div class="cs"><div></div>${[0,1,2,3,"4+"].map(j => `<div class="hd">${j}</div>`).join("")}
          ${m.grid.map((row, i) => `<div class="hd">${i === 4 ? "4+" : i}</div>${row.map(cell).join("")}`).join("")}</div>
        <div class="note">Rows: ${esc(m.home)} goals · columns: ${esc(m.away)} goals</div></div>
      <div><h3>Market value check</h3>${valueCard(m.value)}</div>
    </div>
    <div class="section">
      <div class="tabs"><div class="tab ${S.tab === "players" ? "on" : ""}" data-t="players">Players</div>
        <div class="tab ${S.tab === "legs" ? "on" : ""}" data-t="legs">All legs (${m.legs.length})</div></div>
      <div id="tabbody"></div>
    </div>`;
  $("#match").querySelector(".tabs").onclick = (ev) => { const t = ev.target.closest(".tab"); if (t) { S.tab = t.dataset.t; renderMatch(); } };
  renderTab();
}

function valueCard(v) {
  if (!v) return "";
  if (!v.legs.length) return `<div class="note">No leg at ${esc(v.book)} beats the bookmaker consensus by 2%+ right now. Normal — genuine value is rare.</div>`;
  return v.legs.map(l => `<div class="lrow" style="grid-template-columns:1fr auto auto"><div>${esc(l.label)}</div>
      <div class="muted">@ ${l.price.toFixed(2)}</div><div style="color:var(--accent);font-weight:700">+${(100 * l.edge).toFixed(1)}%</div></div>`).join("") +
    `<div class="note">Single legs where ${esc(v.book)}'s price beats the true probability (bookmaker consensus + HAWK model).</div>`;
}

// Redraw the Players / All legs tab (only when the match view is on screen).
function refreshTab() {
  if (S.view !== "match" || !$("#tabbody")) return;
  if (S.tab === "players") renderTab(); else renderLegList();
}

function legsFor(side, name) { return Object.values(S.legs).filter(l => l.kind === "player" && l.side === side && l.player === name); }

function renderTab() {
  const body = $("#tabbody"), m = S.match;
  if (S.tab === "players") {
    const col = (side) => {
      const order = { F: 0, M: 1, D: 2, G: 3 };
      const list = m.players[side].filter(p => p.status === "Starting").sort((a, b) => (order[a.pos] ?? 4) - (order[b.pos] ?? 4));
      return `<div><div class="team-head"><img src="${esc(side === "home" ? m.homeCrest : m.awayCrest)}" alt="">${esc(side === "home" ? m.home : m.away)}</div>
        ${list.map(p => playerCard(side, p)).join("") || '<div class="note">No lineup or player data yet.</div>'}</div>`;
    };
    body.innerHTML = `<div class="two">${col("home")}${col("away")}</div>`;
  } else {
    body.innerHTML = `<input class="search" id="q" placeholder="Search legs — player, corners, goals…" value="${esc(S.q)}"><div id="lglist"></div>`;
    $("#q").oninput = (e) => { S.q = e.target.value; renderLegList(); };
    renderLegList();
  }
  body.onclick = (e) => {
    const b = e.target.closest("[data-add]"); if (b) return addLeg(b.dataset.add);
    const pl = e.target.closest("[data-pl]"); if (pl) openPlayer(pl.dataset.pl, pl.dataset.name);
  };
}

function playerCard(side, p) {
  const legs = legsFor(side, p.name);
  const pick = (suffix) => legs.find(l => l.id.endsWith(suffix));
  const sot = pick(":sot1");
  const spark = sot && sot.recent ? `<div class="spark" title="Shots on target, last ${sot.recent.length} ${sot.basis === "starts" ? "starts" : "games"} (newest first)">${
      sot.recent.map(v => `<i class="${v >= 1 ? "hit" : ""}" style="height:${4 + Math.min(v, 5) * 3}px"></i>`).join("")}</div>` : "";
  const quick = [[":sot1", "1+ SoT"], [":sot2", "2+ SoT"], [":shots2", "2+ shots"], [":score", "Score"], [":booked", "Booked"]]
    .map(([s, lab]) => { const l = pick(s); return l ? `<span class="qc ${S.slip.includes(l.id) ? "in" : ""}" data-add="${l.id}" title="Fair odds ${odds(l.fair)}">${lab} ${pct(l.p)}</span>` : ""; }).join("");
  const open = `data-pl="${side}" data-name="${esc(p.name)}" title="Open ${esc(p.name)}'s last 10 games"`;
  return `<div class="pl"><div class="ph" ${open}>${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.remove()">` : ""}</div>
    <div><div class="top1"><div><span class="nm" ${open}>${esc(p.name)}</span><span class="pos">${esc(p.pos)}</span></div>${spark}</div>
      <div class="rates">${p.has_data ? `${p.sh90.toFixed(1)} shots · ${p.sot90.toFixed(1)} SoT · ${p.g90.toFixed(2)} xG per 90 · ${Math.round(p.minutes)} min` : "no recent data — position average"}</div>
      <div class="qchips">${quick}</div></div></div>`;
}

function renderLegList() {
  const q = S.q.trim().toLowerCase();
  const groups = {};
  Object.values(S.legs).filter(l => !q || (l.label + " " + l.market).toLowerCase().includes(q))
    .sort((a, b) => b.p - a.p).forEach(l => (groups[l.kind === "player" ? l.market : l.market] ||= []).push(l));
  const book = (S.match && S.match.priceBook) || "Bet365";
  const head = `<div class="lrow lhead"><div></div><div style="text-align:right">Chance</div><div style="text-align:right">Fair</div>
    <div style="text-align:right">${esc(book)}</div><div></div></div>`;
  $("#lglist").innerHTML = Object.entries(groups).map(([g, ls]) => `<div class="lg"><h4>${esc(g)}</h4>${head}${ls.slice(0, 40).map(l => `
    <div class="lrow"><div>${esc(l.label)}${l.low_data ? ' <span class="badge warn">low data</span>' : ""}<div class="pb"><span style="width:${(100 * l.p).toFixed(1)}%"></span></div></div>
      <div style="text-align:right;font-weight:700">${pct(l.p, 1)}</div><div class="muted" style="text-align:right">${odds(l.fair)}</div>
      <div style="text-align:right;font-weight:700;color:${l.bookPrice ? (l.bookPrice > l.fair ? "var(--accent)" : "var(--text)") : "var(--muted)"}">${l.bookPrice ? odds(l.bookPrice) : "–"}</div>
      <button class="add" data-add="${l.id}" title="Add to slip">${S.slip.includes(l.id) ? "✓" : "+"}</button></div>`).join("")}</div>`).join("")
    || `<div class="note">No legs match.</div>`;
}

/* ---------- slip ---------- */
// "fair 1.23 · Bet365 1.22": the bookmaker's own single price for this leg,
// green when it beats HAWK's fair odds. Player props have no feed price.
function priceLine(l) {
  const book = (S.match && S.match.priceBook) || "Bet365";
  if (!l.bookPrice) return `<div class="bp">fair <b>${odds(l.fair)}</b></div>`;
  const val = l.bookPrice > l.fair;
  return `<div class="bp ${val ? "val" : ""}" title="${val ? book + "'s price beats HAWK's fair odds" : book + " pays less than HAWK's fair odds"}">fair ${odds(l.fair)} · ${esc(book)} <b>${odds(l.bookPrice)}</b></div>`;
}

function renderSlip() {
  const r = S.result, m = S.match;
  const legRows = S.slip.map((id, n) => {
    const l = S.legs[id]; if (!l) return "";
    const row = r && r.legs ? r.legs.find(x => x.id === id) : null;
    const hist = l.games ? `<span class="mk"> · hit ${l.hits}/${l.games} recent${l.basis === "starts" ? " starts" : ""}</span>` : "";
    return `<div class="leg" style="animation-delay:${n * 60}ms"><div class="ck">✓</div>
      <div class="l1"><div><div class="lb">${esc(l.label)}</div><div class="mk">${esc(l.market)}${hist}</div></div>
        <div class="rt"><div class="pp">${pct(l.p)}</div>${row && n > 0 ? `<div class="fo">${pct(row.cond)} given above</div>` : ""}
          ${priceLine(l)}</div></div>
      <div class="pb"><span style="width:${(100 * l.p).toFixed(1)}%"></span></div>
      <div class="acts"><button class="${S.locked.has(id) ? "on" : ""}" data-lock="${id}">${S.locked.has(id) ? "🔒 locked" : "lock"}</button>
        <button data-rm="${id}">remove</button></div></div>`;
  }).join("");
  const predicted = m && Object.values(m.lineups).some(lu => lu.status !== "Confirmed");
  $("#slip").innerHTML = `
    <div class="target"><div><div class="muted" style="font-size:12px;letter-spacing:.1em">TARGET ODDS</div><div class="big" id="tgt">${S.target.toFixed(2)}</div></div>
      <div class="muted" style="text-align:right;font-size:12px">chance to land<br><b style="font-size:16px;color:var(--text)">${pct(1 / S.target, 1)}</b></div></div>
    <input type="range" min="0" max="100" step="0.5" value="${oddsToSlider(S.target)}" id="rng">
    <div class="seg" id="seg" title="How likely each leg should be">${Object.entries(STYLES).map(([s, st]) => `<button class="${S.style === s ? "on" : ""}" data-s="${s}">${st.label}</button>`).join("")}</div>
    <div class="hint">${STYLES[S.style].hint}</div>
    <div class="seg" id="focus" style="margin-top:0" title="What the builder is made of">${[["Mix", "Mix"], ["Players", "Player props"], ["Match", "Match stats"]].map(([f, lab]) => `<button class="${S.focus === f ? "on" : ""}" data-f="${f}">${lab}</button>`).join("")}</div>
    <div class="opts"><label><input type="checkbox" id="fav" ${S.favourite ? "checked" : ""}> Start with the favourite to win</label>
      <label>Max legs <select id="mx">${[3,4,5,6,7,8,9,10,12].map(n => `<option ${n === S.maxLegs ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>
    <button class="build" id="go" ${m ? "" : "disabled"}>⚡ BUILD MY BET BUILDER</button>
    ${S.slip.length ? `
    <div class="ticket">
      <div class="th"><b>BET BUILDER</b><span class="odds">${r && r.fair ? odds(r.fair) : "…"}</span></div>
      <div class="legs">${legRows}</div>
      <div class="sum"><div><div class="k">Chance to land</div><div class="v">${r && r.p ? pct(r.p, 1) : "–"}</div></div>
        <div><div class="k">Fair odds</div><div class="v" style="color:var(--gold)">${r && r.fair ? odds(r.fair) : "–"}</div></div></div>
    </div>
    <div class="check"><div class="row">
      <div><label>Bookmaker's price</label><input id="price" inputmode="decimal" placeholder="e.g. 3.25"></div>
      <div><label>Stake (€)</label><input id="stake" inputmode="decimal" value="5"></div></div>
      <div id="verdict"></div></div>
    <button class="ghost" id="copy">📋 Copy slip</button>
    <button class="ghost vault" id="vault" title="Log this builder in your Vault's Bankroll & History">🦅 Send to Vault</button>
    ${predicted ? `<div class="warn">Lineups are predicted. HAWK assumes the named starters start — most bookmakers void a player's legs if he doesn't play (check yours). Rebuild once lineups are confirmed, about an hour before kickoff.</div>` : ""}
    ` : `<div class="note" style="margin-top:14px">${m ? "Set your target odds and hit build — or add legs yourself from the Players tab." : "Pick a fixture to start."}</div>`}
    ${m && m.warnings.length ? m.warnings.map(w => `<div class="warn">${esc(w)}</div>`).join("") : ""}
    <div class="note">Fair odds = 1 ÷ chance to land, from ${m ? m.sims.toLocaleString() : "12,000"} simulated matches.
      Match legs are calibrated to the bookmakers; player legs are HAWK's own estimates (no free feed has player-prop prices).
      ${S.dataAge ? `Player &amp; team data updated ${esc(S.dataAge)}.` : ""}</div>`;

  $("#rng").oninput = (e) => { S.target = sliderToOdds(+e.target.value); $("#tgt").textContent = S.target.toFixed(2); };
  $("#rng").onchange = () => renderSlip();
  $("#seg").onclick = (e) => { const b = e.target.closest("button"); if (b) { S.style = b.dataset.s; renderSlip(); } };
  $("#focus").onclick = (e) => { const b = e.target.closest("button"); if (b) { S.focus = b.dataset.f; renderSlip(); } };
  $("#fav").onchange = (e) => { S.favourite = e.target.checked; };
  $("#mx").onchange = (e) => { S.maxLegs = +e.target.value; };
  $("#go").onclick = build;
  $("#slip").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => removeLeg(b.dataset.rm));
  $("#slip").querySelectorAll("[data-lock]").forEach(b => b.onclick = () => { const id = b.dataset.lock;
    S.locked.has(id) ? S.locked.delete(id) : S.locked.add(id); renderSlip(); });
  $("#jump").textContent = S.slip.length && r && r.fair ? `🎟 Slip · ${odds(r.fair)}` : "🎟 Slip";
  const price = $("#price"), stake = $("#stake");
  if (price) { price.oninput = verdict; stake.oninput = verdict; $("#copy").onclick = copySlip; $("#vault").onclick = sendToVault; verdict(); }
}

// Logs the builder in the HAWK Vault (the main page of this site). Both pages
// share this browser's storage, so it uses the Vault's own format: one
// "builder" leg with the selections joined by " & ", status PENDING, and the
// stake taken off the bankroll — exactly like "Lock In Bet" in the Vault.
function sendToVault() {
  const m = S.match, r = S.result;
  const price = parseFloat(($("#price").value || "").replace(",", "."));
  const stake = parseFloat(($("#stake").value || "").replace(",", "."));
  if (!m || !S.slip.length || !r) return toast("Build a ticket first.");
  if (!(price > 1)) return toast("Enter the bookmaker's price for this builder first.");
  if (!(stake > 0)) return toast("Enter a valid stake.");
  let bankroll, bets;
  try {
    bankroll = parseFloat(localStorage.getItem("hawk_bankroll")) || 1000.0;
    bets = JSON.parse(localStorage.getItem("hawk_bets")) || [];
  } catch { return toast("Couldn't open the Vault's storage in this browser."); }
  if (bankroll < stake) return toast(`Not enough in your Vault bankroll (€${bankroll.toFixed(2)}).`);
  const legs = S.slip.map(id => S.legs[id]);
  const ev = r.p * price - 1;
  bets.unshift({
    id: "bet_" + Date.now(),
    date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }),
    legs: [{
      fixture: `${m.home} vs ${m.away}`,
      selection: legs.map(l => l.label).join(" & "),
      angle: `HAWK: ${pct(r.p, 1)} to land · fair ${odds(r.fair)} · ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}% at ${odds(price)}`,
      odds: price, type: "builder", league: m.league,
      subSelections: legs.map(l => ({ label: l.label, odds: +(l.bookPrice || l.fair).toFixed(2) })),
    }],
    stake, odds: price, potentialReturn: stake * price, status: "PENDING",
  });
  try {
    localStorage.setItem("hawk_bankroll", (bankroll - stake).toFixed(2));
    localStorage.setItem("hawk_bets", JSON.stringify(bets));
  } catch { return toast("Couldn't save to the Vault's storage."); }
  toast(`🦅 Logged in your Vault: €${stake.toFixed(2)} @ ${odds(price)}. If the Vault is open in another tab, refresh it.`);
}

function verdict() {
  const out = $("#verdict"), r = S.result;
  const price = parseFloat(($("#price").value || "").replace(",", ".")), stake = parseFloat(($("#stake").value || "").replace(",", ".")) || 0;
  if (!r || !r.p || !price || price <= 1) { out.innerHTML = r && r.fair ? `<div class="note">Enter the price your bookmaker offers for this exact builder. Break-even is <b>${odds(r.fair)}</b>; aim for ${odds(r.fair * 1.05)}+.</div>` : ""; return; }
  const ev = r.p * price - 1;
  const good = ev > 0;
  out.innerHTML = `<div class="verdict ${good ? "good" : "bad"}">${good ? "✅ VALUE" : "❌ OVERPRICED"} ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%
    <small>Their price implies a ${pct(1 / price, 1)} chance — HAWK says ${pct(r.p, 1)}.</small>
    <small>${good ? `Expected profit ≈ €${(ev * stake).toFixed(2)} on €${stake.toFixed(2)} (wins ${pct(r.p, 1)} of the time, pays €${(price * stake).toFixed(2)}).`
                  : `The bookmaker keeps ≈ €${(-ev * stake).toFixed(2)} of every €${stake.toFixed(2)} on average. It needs ${odds(r.fair)}+ to be fair — try swapping legs or another book.`}</small></div>`;
}

async function build() {
  if (!S.match) return;
  const btn = $("#go"); btn.disabled = true; btn.textContent = "SIMULATING…";
  try {
    const locked = S.slip.filter(id => S.locked.has(id));
    S.result = await api("/api/build", { id: String(S.match.id), target: S.target, style: S.style, focus: S.focus, maxLegs: S.maxLegs,
                                         favourite: S.favourite, locked, banned: [...S.banned] });
    S.slip = S.result.legs.map(l => l.id);
    if (!S.slip.length) toast("No legs fit this style — try another style or target.");
    else if (S.result.fair < S.target * 0.97) toast(`Best found: ${odds(S.result.fair)} — raise max legs or change style to go higher.`);
  } catch (err) { toast(err.message); }
  renderSlip(); refreshTab();
  if (narrow() && S.slip.length) $("#slip").scrollIntoView({ behavior: "smooth" });
}

async function evaluateSlip() {
  try { S.result = S.slip.length ? await api("/api/evaluate", { id: String(S.match.id), legs: S.slip }) : null; }
  catch (err) { toast(err.message); }
  renderSlip(); refreshTab();
}
function addLeg(id) {
  const leg = S.legs[id]; if (!leg) return;
  if (S.slip.includes(id)) { removeLeg(id); return; }
  const clash = S.slip.find(x => S.legs[x] && S.legs[x].group === leg.group);
  if (clash) { S.slip = S.slip.map(x => x === clash ? id : x); S.locked.delete(clash); toast(`Swapped for: ${leg.label}`); }
  else S.slip.push(id);
  S.locked.add(id); S.banned.delete(id);
  evaluateSlip();
}
function removeLeg(id) { S.slip = S.slip.filter(x => x !== id); S.locked.delete(id); S.banned.add(id); evaluateSlip(); }
function copySlip() {
  const m = S.match, r = S.result;
  const text = [`BET BUILDER — ${m.home} v ${m.away}`, ...S.slip.map(id => `✓ ${S.legs[id].label}  (${S.legs[id].market})`),
    `Chance ${pct(r && r.p, 1)} · fair odds ${odds(r && r.fair)}`].join("\n");
  navigator.clipboard.writeText(text).then(() => toast("Slip copied"), () => toast("Couldn't copy"));
}
/* ---------- best builders (scan) ---------- */
function showScan() {
  S.view = "scan";
  document.querySelectorAll(".fx").forEach(f => f.classList.remove("on"));
  renderScan();
  pollScan();
}
function renderScan() {
  const sc = S.scan;
  $("#match").innerHTML = `
    <div class="section" style="border-top:0">
      <h3>⚡ Best builders</h3>
      <div class="note" style="margin-top:0">HAWK builds a ticket for every fixture with your slip settings —
        target <b style="color:var(--gold)">${S.target.toFixed(2)}</b> · ${esc(STYLES[S.style].label)} · ${esc(FOCUS_LABELS[S.focus])} · max ${S.maxLegs} legs.
        At the same target every ticket has the same chance to land, so the best are the ones needing the <b>fewest legs</b>
        (each leg adds bookmaker margin). Green lines are match legs where Bet365's price beats HAWK's fair odds.</div>
      <div class="leagues" id="scanLeagues" style="flex-wrap:wrap;margin:12px 0">${S.allLeagues.map(l =>
        `<button class="pill ${sc.leagues.has(l) ? "on" : ""}" data-sl="${esc(l)}">${esc(l)}</button>`).join("")}</div>
      <div class="opts" style="justify-content:flex-start;gap:16px;flex-wrap:wrap">
        <label>Kick-off within <select id="hrs">${[[24, "24 hours"], [48, "48 hours"], [168, "7 days"]].map(([h, t]) =>
          `<option value="${h}" ${h === sc.hours ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label>Sort by <select id="srt">${[["legs", "Fewest legs"], ["kickoff", "Kick-off time"], ["value", "Bet365 value"]].map(([k, t]) =>
          `<option value="${k}" ${k === sc.sort ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <button class="build" id="scanGo" style="width:auto;margin:0 0 0 auto;padding:10px 20px"></button>
      </div>
      <div id="scanProg"></div>
    </div>
    <div class="section" id="scanRes"></div>`;
  $("#scanLeagues").onclick = (e) => {
    const b = e.target.closest("[data-sl]"); if (!b) return;
    const l = b.dataset.sl; sc.leagues.has(l) ? sc.leagues.delete(l) : sc.leagues.add(l);
    b.classList.toggle("on", sc.leagues.has(l));
  };
  $("#hrs").onchange = (e) => { sc.hours = +e.target.value; };
  $("#srt").onchange = (e) => { sc.sort = e.target.value; updateScan(); };
  $("#scanGo").onclick = toggleScan;
  $("#scanRes").onclick = (e) => { const c = e.target.closest("[data-open]"); if (c) openFromScan(c.dataset.open); };
  updateScan();
}
function updateScan() {
  if (S.view !== "scan" || !$("#scanRes")) return;
  const d = S.scan.data || { running: false, total: 0, done: 0, errors: 0, results: [] };
  $("#scanGo").textContent = d.running ? "■ STOP" : (d.results.length ? "⚡ SCAN AGAIN" : "⚡ SCAN");
  $("#scanProg").innerHTML = d.running || d.total ? `<div class="prog"><span style="width:${d.total ? 100 * d.done / d.total : 3}%"></span></div>
    <div class="note">${d.running ? `Scanning… ${d.done} of ${d.total || "?"} fixtures` : `Scanned ${d.done} fixture${d.done === 1 ? "" : "s"}`}${
      d.errors ? ` · ${d.errors} skipped (no odds or data yet)` : ""}</div>` : "";
  const sorters = {
    legs: (a, b) => a.legs.length - b.legs.length || (a.kickoff || "").localeCompare(b.kickoff || ""),
    kickoff: (a, b) => (a.kickoff || "").localeCompare(b.kickoff || ""),
    value: (a, b) => b.value.length - a.value.length || ((b.value[0] || {}).edge || 0) - ((a.value[0] || {}).edge || 0),
  };
  const res = [...d.results].sort(sorters[S.scan.sort]);
  $("#scanRes").innerHTML = res.length ? res.map(r => scanCard(r, d.params)).join("") : `<div class="note">${d.running
    ? "Results appear here as each match is analysed…"
    : d.total === 0 && d.params ? "No fixtures kick off in that window — try a longer one."
    : "Pick leagues and a time window, then hit Scan. It takes a few seconds per match."}</div>`;
}
function scanCard(r, params) {
  const short = params && r.fair && r.fair < params.target * 0.97;
  return `<div class="scard" data-open="${esc(r.id)}">
    <div><div class="teams"><img src="${esc(r.homeCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(r.home)}
        <span class="muted" style="font-weight:500">vs</span><img src="${esc(r.awayCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(r.away)}</div>
      <div class="muted" style="font-size:12px;margin-top:2px">${esc(r.league)} · ${esc(fmtKick(r.kickoff))} ·
        <span class="badge ${r.confirmed ? "ok" : "warn"}">${r.confirmed ? "Lineups confirmed" : "Lineups predicted"}</span></div>
      <div>${r.legs.map(l => `<span class="lchip ${l.kind === "player" ? "pl" : ""}">${esc(l.label)}</span>`).join("")}</div>
      ${r.value.length ? `<div class="vline">Bet365 value: ${r.value.map(v => `${esc(v.label)} @ ${odds(v.price)} (+${(100 * v.edge).toFixed(1)}%)`).join(" · ")}</div>` : ""}</div>
    <div style="text-align:right"><div class="bigodds">${odds(r.fair)}</div>
      <div class="muted" style="font-size:12px">${r.legs.length} legs · ${pct(r.p, 1)}${short ? "<br>short of target" : ""}</div>
      <button class="ghost" style="width:auto;padding:6px 12px">Open ›</button></div></div>`;
}
async function toggleScan() {
  try {
    if (S.scan.data && S.scan.data.running) S.scan.data = await api("/api/scan/stop", {});
    else {
      if (!S.scan.leagues.size) return toast("Pick at least one league.");
      S.scan.data = await api("/api/scan", { leagues: [...S.scan.leagues], hours: S.scan.hours, target: S.target,
                                             style: S.style, focus: S.focus, maxLegs: S.maxLegs });
    }
  } catch (err) { toast(err.message); }
  updateScan();
  pollScan();
}
async function pollScan() {
  clearTimeout(S.scan.timer);
  try { S.scan.data = await api("/api/scan"); } catch (err) { /* keep the last status */ }
  updateScan();
  if (S.scan.data && S.scan.data.running) S.scan.timer = setTimeout(pollScan, 1500);
}
async function openFromScan(id) {
  const r = (S.scan.data.results || []).find(x => String(x.id) === String(id)); if (!r) return;
  await goToMatch(r.league, r.id);
  S.slip = r.legs.map(l => l.id).filter(i => S.legs[i]);
  await evaluateSlip();
}

/* ---------- lineup alerts ---------- */
const WATCH_KEY = "hawk.lineupWatch";
function loadWatch() { try { return JSON.parse(localStorage.getItem(WATCH_KEY)) || []; } catch { return []; } }
function saveWatch() { try { localStorage.setItem(WATCH_KEY, JSON.stringify(S.watch)); } catch {} }
function isWatched(id) { return S.watch.some(w => String(w.id) === String(id)); }
function renderWatch() {
  const btn = $("#watchBtn"), pop = $("#watchPop");
  btn.hidden = !S.watch.length;
  if (!S.watch.length) pop.hidden = true;
  btn.textContent = `🔔 ${S.watch.length} watching`;
  pop.innerHTML = `<div class="muted" style="font-size:12px;padding:2px 4px 6px">Lineup alerts — checked every 2 minutes while this tab is open</div>` +
    S.watch.map(w => `<div class="row"><a href="#" data-go="${esc(w.id)}" style="color:var(--text)">${esc(w.home)} v ${esc(w.away)}</a>
      <button data-unwatch="${esc(w.id)}" title="Stop this alert">✕</button></div>`).join("");
  pop.onclick = (e) => {
    e.preventDefault();
    const u = e.target.closest("[data-unwatch]");
    if (u) {
      S.watch = S.watch.filter(w => String(w.id) !== u.dataset.unwatch);
      saveWatch(); renderWatch(); renderFixtures();
      if (S.view === "match" && S.match) renderMatch();
      return;
    }
    const g = e.target.closest("[data-go]");
    if (g) { const w = S.watch.find(x => String(x.id) === g.dataset.go); pop.hidden = true; if (w) goToMatch(w.league, w.id); }
  };
}
async function toggleWatch() {
  const m = S.match; if (!m) return;
  if (isWatched(m.id)) { S.watch = S.watch.filter(w => String(w.id) !== String(m.id)); toast("Lineup alert off."); }
  else {
    S.watch.push({ id: String(m.id), league: m.league, home: m.home, away: m.away });
    if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch {} }
    toast("🔔 You'll get an alert when both lineups are confirmed — keep this tab open.");
  }
  saveWatch(); renderWatch(); renderFixtures(); renderMatch();
}
let checkingLineups = false;
async function checkLineups() {
  if (checkingLineups || !S.watch.length) return;
  checkingLineups = true;
  try {
    for (const w of [...S.watch]) {
      let st;
      try { st = await api(`/api/lineups?id=${encodeURIComponent(w.id)}`); } catch { continue; }
      if (st.confirmed || st.started) {
        S.watch = S.watch.filter(x => String(x.id) !== String(w.id));
        if (st.confirmed) lineupsIn(w);
      }
    }
  } finally {
    checkingLineups = false;
    saveWatch(); renderWatch(); renderFixtures();
  }
}
async function lineupsIn(w) {
  const msg = `Lineups confirmed: ${w.home} v ${w.away}`;
  beep(); flashTitle("🔔 Lineups in!"); toast("🔔 " + msg);
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      const n = new Notification("HAWK", { body: msg + " — click to rebuild your builder." });
      n.onclick = () => { window.focus(); goToMatch(w.league, w.id).then(build); };
    } catch {}
  }
  if (S.view === "match" && S.match && String(S.match.id) === String(w.id)) {
    await openMatch(w.id, true);   // keeps your slip and locked legs
    await build();
    toast("Builder rebuilt with the confirmed lineups.");
  }
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [1175, 0.2], [1568, 0.4]].forEach(([freq, t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}
function flashTitle(text) {
  const base = "HAWK · Bet Builder";
  let n = 0;
  const t = setInterval(() => {
    document.title = n % 2 ? base : text;
    if (++n > 20 || (document.hasFocus() && n > 4)) { clearInterval(t); document.title = base; }
  }, 1000);
}

/* ---------- player deep-dive ---------- */
function openPlayer(side, name) {
  const m = S.match, p = (m.players[side] || []).find(x => x.name === name); if (!p) return;
  const games = [...(p.recent || [])].reverse();   // oldest -> newest, left to right
  const top = Math.max(4, ...games.map(g => g.shots));
  const team = side === "home" ? m.home : m.away;
  const date = (ts) => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
  const cols = games.map(g => `<div class="col" title="${esc(`${date(g.ts)} · ${g.comp}\n${g.home ? "vs" : "at"} ${g.opp} ${g.score}\n${g.minutes}' played${g.sub_in ? " (off the bench)" : ""} · ${g.shots} shots · ${g.sot} on target · ${g.goals} goal${g.goals === 1 ? "" : "s"} · xG ${(g.xg || 0).toFixed(2)}${g.yellow ? " · booked" : ""}`)}">
      <div class="marks">${"⚽".repeat(Math.min(g.goals, 3))}${g.yellow ? "🟨" : ""}${g.red ? "🟥" : ""}</div>
      <div class="num">${g.shots}</div>
      <div class="bw"><div class="bar" style="height:${100 * g.shots / top}%"><div class="sotb" style="height:${g.shots ? 100 * g.sot / g.shots : 0}%"></div></div></div>
    </div>`).join("");
  const labels = games.map(g => `<div title="${esc(g.opp)}">${g.home ? "" : "@"}${esc(g.opp)}<br>${g.minutes}'${g.sub_in ? " sub" : ""}</div>`).join("");
  const n = games.length, count = (f) => games.filter(f).length;
  const hit = (label, k) => `<div class="tile"><div class="k">${label}</div><div class="v">${k}/${n}</div></div>`;
  const legs = legsFor(side, name).sort((a, b) => b.p - a.p);
  modal(`<div class="mhead"><div class="ph">${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.remove()">` : ""}</div>
      <div><div style="font-size:20px;font-weight:800">${esc(p.name)} <span class="pos">${esc(p.pos)}</span></div>
        <div class="muted">${esc(team)} · ${p.status === "Starting" ? "starting" : "on the bench"} · ${p.has_data
          ? `${p.sh90.toFixed(1)} shots · ${p.sot90.toFixed(1)} on target · ${p.g90.toFixed(2)} xG per 90 · ${Math.round(p.minutes)} min in his last 20 games`
          : "no recent data"}</div></div>
      <button class="x" data-close title="Close">✕</button></div>
    ${n ? `<div class="chart">${cols}</div><div class="xlabels">${labels}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>on target</span><span><i style="background:#3a4a55"></i>off target / blocked</span>
        <span>⚽ goal · 🟨 booked · hover a bar for details</span><span style="margin-left:auto">oldest → newest</span></div>
      <div class="hits">${hit("1+ shots", count(g => g.shots >= 1))}${hit("2+ shots", count(g => g.shots >= 2))}${hit("1+ on target", count(g => g.sot >= 1))}${hit("Scored", count(g => g.goals >= 1))}</div>`
      : `<div class="note">No recent match data for this player.</div>`}
    <div style="margin-top:16px"><h3 style="margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">HAWK legs for ${esc(p.name)}</h3>
      ${legs.length ? legs.map(l => `<div class="lrow" style="grid-template-columns:1fr 64px 56px 30px">
          <div>${esc(capitalise(l.label.replace(p.name + ": ", "").replace(p.name + " ", "")))}${l.low_data ? ' <span class="badge warn">low data</span>' : ""}
            <div class="pb"><span style="width:${(100 * l.p).toFixed(1)}%"></span></div></div>
          <div style="text-align:right;font-weight:700">${pct(l.p, 1)}</div><div class="muted" style="text-align:right">${odds(l.fair)}</div>
          <button class="add" data-add="${l.id}" title="Add to slip">${S.slip.includes(l.id) ? "✓" : "+"}</button></div>`).join("")
        : `<div class="note">No legs for this player (goalkeeper, on the bench, or not enough data).</div>`}
    </div>`);
}
function modal(html) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.onclick = (e) => {
    if (e.target === bg || e.target.closest("[data-close]")) return closeModal();
    const b = e.target.closest("[data-add]");
    if (b) { addLeg(b.dataset.add); b.textContent = S.slip.includes(b.dataset.add) ? "✓" : "+"; }
  };
  document.body.appendChild(bg);
}
function closeModal() { document.querySelectorAll(".modal-bg").forEach(x => x.remove()); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); $("#watchPop").hidden = true; } });

init();
</script>
