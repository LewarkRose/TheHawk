<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAWK · Bet Builder</title>
<!-- Icons: new names / ?v= so browsers drop the old cached logo -->
<link rel="icon" href="hawk-tab.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png?v=4" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="manifest" href="../manifest.webmanifest?v=5">
<meta name="theme-color" content="#0d1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAWK">
<style>
:root{
  --bg:#0d1114; --panel:#151b1f; --panel2:#1b2328; --line:#25313a; --text:#e8eff3; --muted:#8797a3;
  --accent:#14e3a1; --accent-d:#0a9e70; --gold:#ffd166; --red:#ff5d73; --blue:#4aa8ff; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* background: floodlight glows drifting slowly + a big faint hawk + vignette */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-glow i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(40px);will-change:transform}
.bg-glow i:nth-child(1){background:radial-gradient(closest-side,rgba(20,227,161,.15),transparent);left:-22vmax;top:-32vmax;animation:bgDrift1 24s ease-in-out infinite alternate}
.bg-glow i:nth-child(2){background:radial-gradient(closest-side,rgba(74,168,255,.09),transparent);right:-26vmax;top:-12vmax;animation:bgDrift2 30s ease-in-out infinite alternate}
.bg-glow i:nth-child(3){background:radial-gradient(closest-side,rgba(20,227,161,.10),transparent);left:18vmax;bottom:-46vmax;animation:bgDrift3 34s ease-in-out infinite alternate}
@keyframes bgDrift1{to{transform:translate(18vmax,12vmax)}}
@keyframes bgDrift2{to{transform:translate(-16vmax,18vmax)}}
@keyframes bgDrift3{to{transform:translate(-14vmax,-10vmax)}}
.bg-hawk{position:absolute;left:50%;top:56%;width:min(92vh,960px);transform:translate(-30%,-50%) rotate(-8deg);fill:#7cf7cf;opacity:.05}
.bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
@media (prefers-reduced-motion:reduce){.bg-glow i{animation:none}}
main.grid{position:relative;z-index:1}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}
/* header: row 1 = logo · pages · alerts + Vault, row 2 = leagues */
:root{--head:66px}
.top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,26,30,.97),rgba(13,17,20,.95));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 22px 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex-shrink:0}
.brand .logo{width:40px;height:40px;filter:drop-shadow(0 0 12px rgba(20,227,161,.35));transition:transform .2s}
.brand:hover .logo{transform:rotate(-4deg) scale(1.05)}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-size:20px;font-weight:900;letter-spacing:.22em;
  background:linear-gradient(180deg,#f2fffa,#7cf7cf 70%,#14e3a1);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark small{font-size:9.5px;font-weight:700;letter-spacing:.32em;color:var(--muted);margin-top:4px}
.mainnav{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.nav{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap;
  display:flex;align-items:center;gap:6px;transition:.15s}
.nav:hover{color:var(--text);background:var(--panel2)}
.nav.on{color:#04241a;background:linear-gradient(180deg,#3ff5bd,var(--accent));box-shadow:0 4px 14px -4px rgba(20,227,161,.6)}
.nav .count,.tool .count{font-style:normal;font-size:11px;font-weight:900;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  display:inline-grid;place-items:center;background:var(--gold);color:#241a00}
.nav.on .count{background:#04241a;color:var(--accent)}
.topright{display:flex;align-items:center;gap:8px;position:relative;flex-shrink:0}
.empty .bigmark{width:72px;height:72px;filter:drop-shadow(0 0 18px rgba(20,227,161,.35))}
.ghost.vault{color:#d9b571;border-color:#6b5530}
.ghost.vault:hover{background:rgba(217,181,113,.08)}
.leagues{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 22px 10px}
.leagues::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;white-space:nowrap;transition:.15s;font-weight:600;font-size:13px}
.pill img{width:18px;height:18px;object-fit:contain;opacity:.85}
.pill:hover{border-color:#3a4a55}
.pill.on{background:var(--accent);color:#04241a;border-color:var(--accent);font-weight:800}
.pill.on img{filter:brightness(0) opacity(.75)}
/* left panel: league tree (groups open/close, ★ favourites) above the fixtures */
.ltree{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.lt-grp{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;font-weight:800;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);user-select:none;transition:.12s}
.lt-grp:hover{background:var(--panel2);color:var(--text)}
.lt-grp .ic{font-size:14px;letter-spacing:0}
.lt-grp .chev{margin-left:auto;font-size:10px;transition:transform .15s}
.lt-grp.open .chev{transform:rotate(90deg)}
.lt-grp.has{color:var(--text)}
.lt-grp .tot{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:0}
.lt-lg{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;
  border:1px solid transparent;transition:.12s}
.lt-lg:hover{background:var(--panel2)}
.lt-lg img{width:18px;height:18px;object-fit:contain;flex-shrink:0}
.lt-lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-lg .n{font-size:11px;font-weight:800;min-width:20px;padding:1px 6px;border-radius:8px;background:var(--panel2);color:var(--muted);text-align:center}
.lt-lg.none{color:var(--muted)}
.lt-lg.none .n{opacity:.6}
.lt-lg.on{background:rgba(20,227,161,.1);border-color:rgba(20,227,161,.5);color:var(--text)}
.lt-lg.on .n{background:var(--accent);color:#04241a}
.lt-star{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;opacity:0;transition:.12s}
.lt-lg:hover .lt-star,.lt-star.on{opacity:1}
.lt-star.on{color:var(--gold)}
.lt-hint{font-size:12px;color:var(--muted);padding:2px 8px 6px 14px}
.fxhead{display:flex;align-items:center;gap:8px;padding:4px 8px 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fxhead img{width:16px;height:16px}
@media (hover:none){.lt-star{opacity:1}}
/* league picker in Best builders / Value / Acca: one row per group */
.lpick{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.lprow{display:grid;grid-template-columns:128px minmax(0,1fr);gap:8px;align-items:start}
.lppills{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.lprow{grid-template-columns:1fr}}
.lpgroup{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer;
  font-weight:800;font-size:12px;white-space:nowrap;text-align:left}
.lpgroup:hover{color:var(--text);border-color:#3a4a55}
.lpgroup.on{color:var(--accent);border:1px solid rgba(20,227,161,.55)}
.lpgroup.part{color:var(--text);border-style:solid}
.pill.sm{padding:4px 10px;font-size:12px}
.lpsum{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 400px;gap:16px;padding:16px 22px;align-items:start}
@media (max-width:1250px){.grid{grid-template-columns:260px minmax(0,1fr)}.slipcol{grid-column:1/-1}}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.fixtures{padding:10px;max-height:calc(100vh - var(--head) - 24px);overflow:auto;position:sticky;top:calc(var(--head) + 10px)}
.fx{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.15s}
.fx:hover{background:var(--panel2)}
.fx.on{background:var(--panel2);border-color:var(--accent)}
.fx .team{display:flex;align-items:center;gap:8px;font-weight:600}
.fx .team img{width:20px;height:20px}
.fx .when{grid-row:1/3;grid-column:2;align-self:center;text-align:right;color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge.live{background:rgba(255,93,115,.15);color:var(--red)}
.badge.ok{background:rgba(20,227,161,.14);color:var(--accent)}
.badge.warn{background:rgba(255,209,102,.14);color:var(--gold)}
.muted{color:var(--muted)}
.empty{padding:60px 30px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:10px 0 6px;font-size:22px}
.hero{padding:22px 24px;border-radius:16px 16px 0 0;
  background:radial-gradient(1200px 200px at 50% -60px,rgba(20,227,161,.18),transparent),linear-gradient(180deg,#18242a,#151b1f)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.side img{width:64px;height:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.side .nm{font-size:18px;font-weight:800}
.mid{text-align:center}
.mid .ko{font-size:13px;color:var(--muted)}
.mid .x{font-size:28px;font-weight:900;color:#3d4d58;letter-spacing:.1em}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.section{padding:16px 24px;border-top:1px solid var(--line)}
.section h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar3{display:flex;height:34px;border-radius:10px;overflow:hidden;font-weight:800;font-size:13px}
.bar3 div{display:flex;align-items:center;justify-content:center;min-width:34px;transition:flex .6s}
.bar3 .h{background:var(--accent);color:#04241a}.bar3 .d{background:#34424c}.bar3 .a{background:var(--blue);color:#061a2c}
.bar3.sm{height:22px;font-size:11.5px;border-radius:7px;flex:1}.bar3.sm div{min-width:28px}
.ng-box{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.ng-head{font-weight:800;margin-bottom:8px}
.ng-row{display:flex;align-items:center;gap:10px;margin-bottom:5px}.ng-src{width:62px;font-size:12px;font-weight:700;color:var(--muted)}
.ng-box .bar3-legend{margin-left:72px}
.ng-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;margin-top:6px;color:var(--muted)}.ng-stats b{color:var(--text)}
.ng-scorers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;margin-top:8px}
.ng-p{padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}.ng-p b{color:var(--accent)}
.srcs{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1000px){.two{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
.cs{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;font-size:12px}
.cs .hd{color:var(--muted);text-align:center;align-self:center}
.cs .c{border-radius:7px;padding:7px 0;text-align:center;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--muted);border:1px solid transparent}
.tab.on{color:var(--text);border-color:var(--line);background:var(--panel2)}
.team-head{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.team-head img{width:22px;height:22px}
.pl{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);margin-bottom:8px}
.pl .ph{width:40px;height:40px;border-radius:50%;background:#26323b center/cover;overflow:hidden}
.pl .ph img{width:40px;height:40px;object-fit:cover}
.pl .top1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pl .nm{font-weight:700}
.pos{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:#2b3842;color:#b9c7d1;margin-left:6px}
.rates{font-size:12px;color:var(--muted)}
.spark{display:flex;gap:2px;align-items:flex-end;height:18px}
.spark i{display:block;width:5px;background:#35505e;border-radius:2px}
.spark i.hit{background:var(--accent)}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.qc{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#22303a;border:1px solid #2e3e49;cursor:pointer;transition:.12s}
.qc:hover{border-color:var(--accent);color:var(--accent)}
.qc.in{background:rgba(20,227,161,.16);border-color:var(--accent);color:var(--accent)}
.qc b{font-weight:800;opacity:.7;margin-left:2px}
.qc.zero{opacity:.45}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:10px}
.lg{margin-bottom:14px}
.lg h4{margin:0 0 6px;font-size:12px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:1fr 64px 56px 64px 30px;gap:8px;align-items:center;padding:7px 10px;border-radius:9px}
.lhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 10px 4px}
.lrow:hover{background:var(--panel2)}
.pb{height:5px;border-radius:3px;background:#24313a;overflow:hidden}
.pb span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent))}
.add{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.add:hover{border-color:var(--accent);color:var(--accent)}
/* slip */
/* The slip sticks beside the match and scrolls on its own when the ticket is long. */
.slipcol{position:sticky;top:calc(var(--head) + 10px);max-height:calc(100vh - var(--head) - 24px);overflow-y:auto;border-radius:16px;
  scrollbar-width:thin;scrollbar-color:#2f3d47 transparent}
.slipcol::-webkit-scrollbar{width:8px}
.slipcol::-webkit-scrollbar-thumb{background:#2f3d47;border-radius:8px}
@media (max-width:1250px){.slipcol{position:static;max-height:none;overflow:visible}}
.bp{font-size:12px;color:var(--muted)}
.bp b{color:var(--text);font-weight:700}
.bp.val b{color:var(--accent)}
.live-odds{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.live-odds .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.live-odds .dot.on{background:var(--accent);box-shadow:0 0 0 0 rgba(20,227,161,.6);animation:livepulse 2s infinite}
@keyframes livepulse{70%{box-shadow:0 0 0 6px rgba(20,227,161,0)}100%{box-shadow:0 0 0 0 rgba(20,227,161,0)}}
.linkbtn{background:none;border:0;padding:0 2px;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.sc-league{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:7px}
.sc-league img{width:16px;height:16px;object-fit:contain}
.sc-league:first-child{margin-top:0}
.sc-hawk{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;white-space:nowrap;margin-top:1px}
.sc-hawk b{color:var(--accent);font-weight:900}
.sc-hawk .ok{color:var(--accent)}.sc-hawk .bad{color:var(--red)}
.sc-row{display:grid;grid-template-columns:58px 1fr 92px 1fr 64px;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;transition:.12s}
.sc-row:hover{background:var(--panel2);border-color:var(--line)}
.sc-row.is-live{background:rgba(255,93,115,.05)}
.sc-state{font-size:12px;font-weight:700}
.sc-live{color:var(--red);font-weight:800}
.sc-soon{color:var(--gold);font-weight:800;white-space:nowrap}
.co-card{border:1px solid rgba(255,209,102,.35);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,209,102,.04)}
.co-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.co-leg{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.co-leg small{display:block;color:var(--muted);font-size:11px}
.co-tick{margin-right:10px;padding:2px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font:700 12px inherit;cursor:pointer;vertical-align:middle}
.co-tick:hover{color:var(--accent);border-color:var(--accent)}.co-tick.on{color:var(--gold);border-color:rgba(242,193,78,.5)}
.co-worth{margin-top:8px;font-size:13px}
.co-worth b{color:var(--gold)}
.co-offer{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.co-offer label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.co-offer input{width:120px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:#12181c;font-size:16px;font-weight:700}
.badge.soon{background:rgba(255,209,102,.14);color:var(--gold)}
.kick-cd{margin-top:6px;font-size:13px;color:var(--gold);font-weight:600}
.kick-cd b{font-weight:900}
.sc-team{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.sc-team.away{justify-content:flex-end;text-align:right}
.sc-team img{width:20px;height:20px;flex-shrink:0}
.sc-team.win{color:var(--accent)}
.sc-score{text-align:center;font-weight:900;font-size:16px;letter-spacing:.04em}
.sc-bet{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.sc-bell{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;
  filter:grayscale(1);opacity:.55;transition:.12s}
.sc-bell:hover{opacity:1;filter:none;border-color:var(--gold)}
.sc-bell.on{opacity:1;filter:none;border-color:var(--gold);background:rgba(255,209,102,.12);box-shadow:0 0 12px rgba(255,209,102,.25)}
.sc-xi{font-size:10.5px;font-weight:800;color:var(--accent);background:rgba(20,227,161,.12);padding:2px 6px;border-radius:6px;white-space:nowrap}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:livepulse 2s infinite}
.rp-evs{display:flex;flex-direction:column;gap:4px}
.rp-ev{display:flex;gap:8px;font-size:13px;padding:4px 0}
.rp-ev.away{flex-direction:row-reverse;text-align:right}
.rp-ev .min{color:var(--muted);font-weight:700;min-width:36px}
@media (max-width:560px){.sc-row{grid-template-columns:40px 1fr 74px 1fr 30px;gap:5px;font-size:13px}.sc-team img{display:none}.sc-hawk{font-size:9.5px}
  .sc-bell{width:28px;height:28px}}
.kelly{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}

<script>
function loadPref(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } }
function savePref(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private window */ } }
const S = { league: null, fixtures: [], match: null, legs: {}, slip: [], locked: new Set(), banned: new Set(),
            target: 3.25, style: "Balanced", focus: "Mix", maxLegs: 10, favourite: true, result: null, tab: "players", q: "",
            chk: { price: "", boost: "", stake: "5" }, extras: false, cat: "All", ep: loadPref("hawk.ep", true),
            live: { on: loadPref("hawk.liveOdds", true), timer: null, checked: null, busy: false },
            acca: loadPref("hawk.acca", []), accaChk: { price: "", boost: "", stake: "5" }, alerts: loadPref("hawk.priceAlerts", []),
            inplay: null, kellyFrac: loadPref("hawk.kellyFrac", 0.25), picks: loadPref("hawk.picks", "likely"),
            scores: { day: null, league: "All", data: null, timer: null, error: null },
            monster: { leagues: null, hours: 48, legs: 10, perMatch: 1, style: "Banker", data: null, timer: null, skip: new Set() },
            view: "match", allLeagues: [], scan: { leagues: null, hours: 24, sort: "legs", data: null, timer: null },
            radar: { leagues: null, hours: "today", min: 1, data: null, timer: null },
            value: { leagues: null, hours: 48, book: "All", market: "All", minP: 0.25, minEdge: 0.02, bestOnly: true, data: null, timer: null,
                     tab: "value", minMove: 0.1 },
            watch: [] };
const FOCUS_LABELS = { Mix: "Mix", Players: "Player props", Match: "Match stats" };
// Display names for the builder styles (the keys are what the server expects).
const STYLES = {
  Banker: { label: "Safe legs", hint: "Lots of very likely legs (72–95% each) — takes more legs to reach your odds." },
  Balanced: { label: "Mixed", hint: "Legs between 55% and 90% — a bit of both." },
  Punchy: { label: "Bold legs", hint: "Fewer, bolder legs (35–78% each), like to score or 2+ on target. Fewer legs usually means a smaller bookmaker margin." },
};
// Kick-off windows for the scans; "today" = until midnight, your time.
const KICKOFF_WINDOWS = [["today", "Today"], [24, "within 24 hours"], [48, "within 48 hours"], [72, "within 3 days"], [168, "within 7 days"]];
const windowValue = (v) => (v === "today" ? "today" : +v);
function hoursFor(w) {
  if (w !== "today") return w;
  const midnight = new Date(); midnight.setHours(24, 0, 0, 0);
  return (midnight.getTime() - Date.now()) / 3600e3;
}
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (p, d = 0) => p == null ? "–" : (100 * p).toFixed(d) + "%";
const odds = (o) => o == null ? "–" : o.toFixed(2);
const capitalise = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const sliderToOdds = (v) => 1.5 * Math.pow(25 / 1.5, v / 100);
const oddsToSlider = (o) => 100 * Math.log(o / 1.5) / Math.log(25 / 1.5);

// True when the slip sits below the match instead of beside it (phones, small windows).
const narrow = () => window.matchMedia("(max-width: 1250px)").matches;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
// On GitHub Pages there's no server: the same /api calls the local app makes
// are answered by the HAWK engine running in this page (engine.js).
async function api(path, body) {
  const [p, query] = path.split("?");
  const q = Object.fromEntries(new URLSearchParams(query || ""));
  switch (p) {
    case "/api/leagues": return { leagues: HAWK.LEAGUES };
    case "/api/fixtures": return { fixtures: await HAWK.fixtures(q.league) };
    case "/api/match": return HAWK.match(q.league, q.id, q.refresh === "1");
    case "/api/lineups": return HAWK.lineups(q.id);
    case "/api/prices": return HAWK.livePrices(q.id);
    case "/api/live": return HAWK.liveMatch(q.id);
    case "/api/scores": return HAWK.scores(q.day);
    case "/api/report": return HAWK.matchReport(q.id);
    case "/api/h2h": return HAWK.h2h(q.id);
    case "/api/ticketlive": return HAWK.ticketLive(q.id, body.legs);
    case "/api/legprices": return HAWK.legPrices(body.items);
    case "/api/monster": return body ? HAWK.startMonster(body) : HAWK.monsterStatus();
    case "/api/monster/stop": return HAWK.stopMonster();
    case "/api/build": return HAWK.build(body);
    case "/api/options": return HAWK.buildOptions(body);
    case "/api/evaluate": return HAWK.evaluate(body);
    case "/api/scan": return body ? HAWK.startScan(body) : HAWK.scanStatus();
    case "/api/scan/stop": return HAWK.stopScan();
    case "/api/radar": return body ? HAWK.startRadar(body) : HAWK.radarStatus();
    case "/api/radar/stop": return HAWK.stopRadar();
    case "/api/value": return body ? HAWK.startValue(body) : HAWK.valueStatus();
    case "/api/value/stop": return HAWK.stopValue();
  }
  throw new Error("unknown request " + p);
}
function fmtKick(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + " · " +
         d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

/* ---------- leagues & fixtures ---------- */
async function init() {
  const { leagues } = await api("/api/leagues");
  S.allLeagues = leagues;
  // The scans start with the Top 5 + European cups (each extra league adds
  // matches to check); your own picks are remembered.
  const pick = (key) => new Set(loadPref(key, [...groupOf("top5").leagues, ...groupOf("europe").leagues]).filter(l => leagues.includes(l)));
  S.scan.leagues = pick("hawk.scanLeagues");
  S.value.leagues = pick("hawk.valueLeagues");
  S.monster.leagues = pick("hawk.monsterLeagues");
  S.radar.leagues = pick("hawk.radarLeagues");
  applyLearning();
  // HAWK's graded predictions on every match (built on GitHub by engine/grade.mjs).
  fetch(new URL("../data/graded.json", location.href)).then(r => (r.ok ? r.json() : null)).then(g => {
    if (!g) return;
    S.graded = g; applyLearning(); renderSlip();
    if (S.view === "radar") renderRadarRecord();
  }).catch(() => { /* not built yet */ });
  $("#valueBtn").onclick = showValue;
  $("#accaBtn").onclick = showAcca;
  $("#scoresBtn").onclick = showScores;
  $("#radarBtn").onclick = showRadar;
  renderAccaBtn();
  setInterval(trackPrices, ALERT_MS);
  setTimeout(trackPrices, 5000);
  $("#ltree").onclick = onTreeClick;
  $("#navBuilder").onclick = showBuilder;
  watchView();
  $("#scanBtn").onclick = showScan;
  $("#watchBtn").onclick = () => { const p = $("#watchPop"); p.hidden = !p.hidden; };
  S.watch = loadWatch();
  renderWatch();
  HAWK.meta().then(meta => {
    if (!meta || !meta.generated) return;
    S.meta = meta;
    S.dataAge = ago(meta.generated);
    renderSlip();
  });
  renderSlip();
  const last = loadPref("hawk.league", leagues[0]);
  await selectLeague(leagues.includes(last) ? last : leagues[0]);
  checkLineups();
  setInterval(checkLineups, 120000);
  setInterval(checkGoals, GOALS_MS); setTimeout(checkGoals, 4000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkGoals(); });

}
// "Open in HAWK" from a Vault ticket: builder/?match=ID&league=L&legs=a,b
// Upcoming → the match with those legs on the slip; in play → live view;
// finished → match report.
async function openFromUrl() {
  const q = new URLSearchParams(location.search), id = q.get("match"), view = q.get("view");
  // App shortcuts (long-press the HAWK icon): builder/?view=radar | scores | value | acca | scan
  const views = { radar: showRadar, scores: showScores, value: showValue, acca: showAcca, scan: showScan };
  if (view && views[view]) { history.replaceState(null, "", location.pathname); return views[view](); }
  // From a goal notification: builder/?view=live&id=GAME&league=L
  if (view === "live" && q.get("id")) { history.replaceState(null, "", location.pathname); return goToLive(q.get("league"), q.get("id")); }
  // From a lineup notification: rebuild that match's builder with the confirmed XIs.
  if (view === "build" && q.get("id")) { history.replaceState(null, "", location.pathname); return goToMatch(q.get("league"), q.get("id")).then(build); }
  if (!id) return;
  history.replaceState(null, "", location.pathname);   // so a refresh doesn't reopen it
  const league = q.get("league"), legs = (q.get("legs") || "").split(",").filter(Boolean);
  if (league && S.allLeagues.includes(league) && S.league !== league) await selectLeague(league);
  const fx = S.fixtures.find(f => String(f.id) === String(id));
  if (!fx) return showReport(id);
  if (fx.started) return showInPlay(id);
  await openMatch(id);
  const keep = legs.filter(l => S.legs[l]);
  if (keep.length) {
    S.slip = keep; S.locked = new Set(keep);
    await evaluateSlip();
    toast(`Your Vault ticket is back on the slip (${keep.length} leg${keep.length === 1 ? "" : "s"}).`);
  }
}

// Games this week for every league in the open groups (365Scores, cached 5 min).
async function loadCounts() {
  const want = [...new Set(leagueGroups().filter(g => S.openGroups.has(g.key)).flatMap(g => g.leagues))]
    .filter(l => !S.counts[l] && !S.counting.has(l));
  if (!want.length) return;
  want.forEach(l => S.counting.add(l));
  const now = Date.now();
  await Promise.all(want.map(async (l) => {
    try {
      const list = await HAWK.fixtures(l);
      S.counts[l] = { n: list.filter(f => new Date(f.kickoff).getTime() - now < WEEK_MS).length, next: (list.find(f => !f.started) || {}).kickoff || null };
    } catch { /* leave it unknown */ } finally { S.counting.delete(l); }
  }));
  renderTree();
  const h = document.querySelector("#fixtures .fxhead");
  if (h) h.outerHTML = fxHead();
}

    S.match = m; S.legs = Object.fromEntries(m.legs.map(l => [l.id, l]));

/* ---------- kick-off countdown (last hour only) ---------- */
// Before that the kick-off time says enough; in the last hour it matters,
// because that's when lineups come out.
const minsToKick = (iso) => (iso ? (new Date(iso).getTime() - Date.now()) / 60000 : Infinity);
const soon = (iso) => { const m = minsToKick(iso); return m > 0 && m <= 60; };
const kickIn = (iso) => { const m = minsToKick(iso); return m > 59.5 ? "1 hr" : `${Math.max(1, Math.ceil(m))} min`; };
function renderCountdown() {
  const el = $("#kickCountdown");
  if (el && S.match) {
    const m = minsToKick(S.match.kickoff), lu = S.match.lineups || {};
    const confirmed = (lu.home || {}).status === "Confirmed" && (lu.away || {}).status === "Confirmed";
    el.innerHTML = soon(S.match.kickoff) ? `⏱ Kicks off in <b>${kickIn(S.match.kickoff)}</b><span class="muted"> · ${confirmed ? "lineups are in ✓" : "lineups due any minute"}</span>`
      : m <= 0 && m > -5 ? "⏱ Kicking off now" : "";
  }
}
setInterval(() => {
  if (S.view === "match") renderCountdown();
  // keep the "in 25 min" labels in the fixture list and Scores ticking
  if (S.fixtures.some(f => { const m = minsToKick(f.kickoff); return m > -2 && m <= 61; })) renderFixtures();
  if (S.view === "scores" && (S.scores.data || []).some(g => g.status === 2 && minsToKick(g.kickoff) <= 61)) renderScoreList();
}, 30 * 1000);

/* ---------- live Bet365 prices ---------- */
// While a match is open, HAWK re-reads Bet365's prices every 2 minutes
// (odds only; the fair odds update when you press Refresh). Moves show as
// ▲/▼ on the legs, and a leg in your slip that moves gets a message.
const LIVE_MS = 2 * 60 * 1000;
function startLive() {
  clearInterval(S.live.timer);
  S.live.timer = S.live.on && S.match && !S.match.started ? setInterval(checkLive, LIVE_MS) : null;
  renderLive();
}
function renderLive() {
  const el = $("#liveOdds"); if (!el || !S.match) return;
  if (S.match.started) { el.innerHTML = ""; return; }
  const at = S.live.checked ? S.live.checked.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "–";
  el.innerHTML = `<span class="dot ${S.live.on ? "on" : ""}"></span>${esc(S.match.priceBook || "Bet365")} odds checked ${at}
    <button class="linkbtn" onclick="toggleLive()">${S.live.on ? "auto: on" : "auto: off"}</button>`;
}
function toggleLive() { S.live.on = !S.live.on; savePref("hawk.liveOdds", S.live.on); startLive(); if (S.live.on) checkLive(); }
async function checkLive() {
  const m = S.match;
  if (!m || S.live.busy || document.hidden || S.view !== "match") return;
  S.live.busy = true;
  try {
    const res = await api(`/api/prices?id=${m.id}`);
    if (!res || S.match !== m) return;
    const moved = [];
    for (const [id, price] of Object.entries(res.prices)) {
      const l = S.legs[id]; if (!l) continue;
      const old = l.bookPrice;
      if (old && price !== old) { l.prevPrice = old; if (S.slip.includes(id)) moved.push(l); }

    renderLive(); refreshTab();
    // Don't redraw the slip under someone typing a price into it.
    if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest("#slip"))) renderSlip();
    if (moved.length) toast(`${res.book} moved: ${moved.slice(0, 2).map(l => `${l.label} ${odds(l.prevPrice)} → ${odds(l.bookPrice)}`).join(" · ")}${moved.length > 2 ? ` +${moved.length - 2} more` : ""}`);

function pct100(ps) {
  const total = ps.reduce((s, p) => s + p, 0) || 1, raw = ps.map(p => (100 * p) / total), out = raw.map(Math.floor);
  const order = raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]);
  const missing = 100 - out.reduce((s, v) => s + v, 0);   // counted once, before adding them back
  for (let k = 0; k < missing; k++) out[order[k % order.length][1]]++;
  return out;
}

// How the radar has done at this level on finished matches (graded on

function radarRecord(u) {

  const said = b.saidFail / b.n, got = b.failed / b.n;

// Bet365's player-prop prices, learnt from you. Type a prop's Bet365 price
// once (in the slip or the Build-it-on-Bet365 list) and HAWK learns how
// Bet365 prices that kind of leg — e.g. 1+ tackles for a regular defender at
// 1.01. It then shows Bet365's likely price on similar legs, leaves out the
// ones Bet365 pays next to nothing for, and "Value first" uses the estimates.
// Your first one came from Bastoni 1+ tackles: HAWK 89% (1.12), Bet365 1.01.
const PROP_KEEP = 400;
const PROP_SEED = [{ key: "tackles1", p: 0.89, price: 1.01, t: 0, label: "Alessandro Bastoni: 1+ Tackles" }];
const propNames = { tackles: "Tackles", fouls: "Fouls", fouled: "Fouls Won", offsides: "Offsides", shots: "Shots", sot: "Shots on Target", score: "to Score", soa: "Score or Assist", assist: "to Assist", booked: "to be Booked", saves: "Saves" };
const propKeyLabel = (k) => { const m = /^([a-z]+?)(\d*)$/.exec(k) || []; return `${m[2] ? m[2] + "+ " : ""}${propNames[m[1]] || m[1]}`; };
function propPrices() { return loadPref("hawk.propPrices", PROP_SEED); }
function applyPropBook() {
  const lg = (p) => { p = Math.min(Math.max(p, 1e-4), 1 - 1e-4); return Math.log(p / (1 - p)); };
  const book = {};
  for (const x of propPrices()) {
    if (!(x.price > 1 && x.p > 0 && x.p < 1)) continue;
    const d = lg(Math.min(0.995, 1 / x.price)) - lg(x.p);
    if (Math.abs(d) <= 4) (book[x.key] ||= []).push({ x: lg(x.p), d });   // (a typo like 14.0 for 1.40 is left out)
  }
  // …and from the builder prices you type in the price box (no typing per leg).
  const ratios = {};
  for (const x of loadPref("hawk.b365prices", [])) {
    const f = propShiftFromBuilder(x);
    if (f && f.props) for (const d of f.props) (book[d.k] ||= []).push({ x: lg(d.p), d: f.s, w: 1 / f.props.length });
    if (f && f.refProps) for (const d of f.refProps) (ratios[d.k] ||= []).push(f.ratio);
  }
  // Bet365 ÷ Unibet per kind of leg: your builders' average, pulled towards the measured 1.2% until there are a few.
  const refRatio = Object.fromEntries(Object.entries(ratios).map(([k, rs]) => [k, (rs.reduce((a, r) => a + r, 0) + HAWK.REF_TO_B365 * 2) / (rs.length + 2)]));
  S.propBook = { book, refRatio, n: Object.fromEntries(Object.entries(book).map(([k, pts]) => [k, pts.length])), nRef: Object.fromEntries(Object.entries(ratios).map(([k, rs]) => [k, rs.length])) };
  HAWK.setPropBook(book, refRatio);
}
function recordPropPrice(legId, price) {

  if (!key || !(price > 1)) return;
  const list = propPrices().filter(x => !(x.match === String(S.match && S.match.id) && x.leg === legId));
  list.push({ key, p: +l.p.toFixed(4), price, t: Date.now(), label: l.label, match: String(S.match && S.match.id), leg: legId });
  savePref("hawk.propPrices", list.slice(-PROP_KEEP));
  applyPropBook();
  const n = S.propBook.n[key] || 0;
  toast(price <= HAWK.DEAD_PRICE
    ? `🧠 Got it: Bet365 pays next to nothing for ${l.label} — HAWK leaves legs like it out now`
    : `🧠 Got it: Bet365 ${odds(price)} for ${l.label} — HAWK now estimates other ${propKeyLabel(key)} legs (${n} price${n === 1 ? "" : "s"} so far)`);
}

</div>
    ${healthLine()}${learningNote()}${trustNote()}`;

  $("#rng").oninput = (e) => { S.target = sliderToOdds(+e.target.value); $("#tgt").textContent = S.target.toFixed(2); };

  $("#go").onclick = build;
  $("#slip").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => removeLeg(b.dataset.rm));

  if ($("#price")) {

// What Bet365 will probably offer for this builder, learnt from the prices you
// type in: its builders pay a bit under HAWK's fair odds for every leg added
// (its margin, plus how it prices legs that go together). Per leg, in log
// terms: fair / price ≈ e^(k × legs). Starts from k = 0.05 (≈5% a leg — your
// first Torino v Roma slip: 3.27 fair, 2.70 at Bet365, 4 legs) and moves to
// your own prices as they come in.
const B365_K0 = 0.05, B365_K0_WEIGHT = 3, B365_KEEP = 60;
function recordB365Price() {
  const r = S.result, m = S.match, price = checkerInputs().price;
  if (!m || !r || !r.fair || !(price > 1) || !S.slip.length) return;
  const key = `${m.id}|${S.slip.slice().sort().join(",")}`;
  const list = loadPref("hawk.b365prices", []).filter(x => x.key !== key);
  // Each leg too: with Bet365's own prices for the match legs, the builder
  // price tells HAWK roughly what Bet365 paid for the player legs (applyPropBook).
  const detail = S.slip.map(id => { const l = S.legs[id]; return { k: HAWK.propKey(l), p: +l.p.toFixed(4), b: l.bookPrice || null, u: l.refPrice || null }; });
  list.push({ key, fair: +r.fair.toFixed(3), joint: +r.p.toFixed(5), price, legs: S.slip.length, detail, model: r.b365raw || null, t: Date.now() });
  savePref("hawk.b365prices", list.slice(-B365_KEEP));
  markOnBet365();   // you found this builder on Bet365, so all its markets are there
  applyPropBook();
  applyAim();
}
// How far HAWK's Bet365 estimate has been from the builder prices you typed
// (in logs, pulled towards 0 until there are a few): the engine builds to it.
function applyAim() {
  const cs = loadPref("hawk.b365prices", []).filter(x => x.model > 1 && x.price > 1).map(x => Math.log(x.price / x.model)).filter(c => Math.abs(c) < 0.6);
  const c = Math.max(-0.4, Math.min(0.4, cs.reduce((a, b) => a + b, 0) / (cs.length + 2)));
  S.aim = { c, n: cs.length };
  HAWK.setAim({ c });
}
// From one builder price: the Bet365 price of its player legs, as a shift in
// log-odds (the same for all of them). Bet365's builder price ≈ its single
// prices multiplied together, corrected for how the legs go together (HAWK's
// joint chance against its chances multiplied). Null when a match leg has no
// Bet365 price, or the answer is silly (a boosted or mistyped price).
function propShiftFromBuilder(x) {
  if (!x.detail || !(x.joint > 0) || !(x.price > 1)) return null;
  const all = x.detail.filter(d => d.k), match = x.detail.filter(d => !d.k);
  if (!all.length || match.some(d => !(d.b > 1))) return null;
  const lg = (p) => Math.log(p / (1 - p));
  const together = x.detail.reduce((a, d) => a * d.p, 1) / x.joint;   // < 1 when the legs go together
  let target = Math.log(x.price) - match.reduce((a, d) => a + Math.log(d.b), 0) - Math.log(together);   // what the props pay, in logs
  // Props Unibet prices: all of them → how Bet365's price compares with Unibet's
  // (the same ratio for each). Some of them → count those at Unibet's price (+ the
  // usual 1.2%) and work out the rest as below.
  const withRef = all.filter(d => d.u > 1), props = all.filter(d => !(d.u > 1));
  if (!props.length) {
    const r = (target - withRef.reduce((a, d) => a + Math.log(d.u), 0)) / withRef.length;
    return Math.abs(r) <= 0.5 ? { ratio: r, refProps: withRef } : null;
  }
  target -= withRef.reduce((a, d) => a + Math.log(d.u) + HAWK.REF_TO_B365, 0);
  const pays = (s) => props.reduce((a, d) => a - Math.log(Math.min(0.995, 1 / (1 + Math.exp(-(lg(d.p) + s))))), 0);
  if (target <= pays(4) || target >= pays(-2)) return null;
  let lo = -2, hi = 4;   // pays() falls as the shift grows: find where it hits the target
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (pays(mid) > target) lo = mid; else hi = mid; }
  return { s: (lo + hi) / 2, props };
}
function b365Guess(fair, legs) {
  if (!(fair > 1) || !legs) return null;
  // Per-leg cut from each price you've typed (ignoring daft ones: a typo or a boosted price).
  const ks = loadPref("hawk.b365prices", []).map(x => Math.log(x.fair / x.price) / x.legs).filter(k => k > -0.05 && k < 0.25);
  const n = ks.length, sum = ks.reduce((a, k) => a + k, 0);
  const k = (B365_K0 * B365_K0_WEIGHT + sum) / (B365_K0_WEIGHT + n);
  const sd = n >= 3 ? Math.sqrt(ks.reduce((a, x) => a + (x - k) ** 2, 0) / (n - 1)) : 0.015;
  const at = (kk) => Math.max(1.01, fair * Math.exp(-kk * legs));
  return { mid: at(k), lo: at(k + Math.max(sd, 0.008)), hi: at(Math.max(0, k - Math.max(sd, 0.008))), n, cut: 1 - Math.exp(-k) };
}
function guessLine(r) {
  if (r && r.b365 > 1) {
    // Bet365's own leg prices (and Unibet's for scorer / assist / shots on target) multiplied, as Bet365 builds it.
    const n = S.aim ? S.aim.n : 0, guessed = r.guessed || 0;
    return `<div class="guess" title="Each leg at Bet365's price (Unibet's for scorer, assist and shots on target, turned into Bet365's), corrected for legs that go together${
      n ? ` and by the ${n} Bet365 builder price${n > 1 ? "s" : ""} you've typed` : ""}.">
      Bet365 should show about <b>${odds(r.b365 * 0.96)}–${odds(r.b365 * 1.04)}</b>
      <span class="muted">· ${guessed ? `${guessed} leg${guessed > 1 ? "s" : ""} guessed` : "all legs priced ✓"} · worth it from ${odds(r.fair * 1.02)}</span></div>`;
  }
  const g = r && b365Guess(r.fair, S.slip.length);
  if (!g) return "";
  return `<div class="guess" title="${g.n ? `From the ${g.n} Bet365 price${g.n > 1 ? "s" : ""} you've typed in: its builders pay about ${(100 * g.cut).toFixed(1)}% less than HAWK's fair odds for each leg.` : "A first guess (about 5% less than HAWK's fair odds per leg) — it learns from the Bet365 prices you type in below."}">
    Bet365 will probably offer <b>${odds(g.lo)}–${odds(g.hi)}</b>
    <span class="muted">· worth it from ${odds(r.fair * 1.02)}${g.n ? "" : " · learns from your prices"}</span></div>`;
}
// The price the builder really pays: a winnings boost multiplies the profit
// part only (a 25% boost on 3.60 pays like 1 + 2.60 × 1.25 = 4.25).
function checkerInputs() {
  const num = (s) => parseFloat(String(s || "").replace(",", "."));
  const price = num(S.chk.price), boost = Math.max(0, num(S.chk.boost) || 0), stake = num(S.chk.stake) || 0;
  return { price, boost, stake, eff: price > 1 ? 1 + (price - 1) * (1 + boost / 100) : NaN };
}

// Logs the builder in the HAWK Vault (the main page of this site). Both pages
// share this browser's storage, so it uses the Vault's own format: one
// "builder" leg with the selections joined by " & ", status PENDING, and the
// stake taken off the bankroll — exactly like "Lock In Bet" in the Vault.
function sendToVault() {
  const m = S.match, r = S.result;
  // Saved at the boosted price, so the Vault's return and profit are right.
  const { price: quoted, boost, stake, eff } = checkerInputs();
  const price = Math.round(eff * 100) / 100;
  if (!m || !S.slip.length || !r) return toast("Build a ticket first.");
  if (!(price > 1)) return toast("Enter the bookmaker's price for this builder first.");
  if (!(stake > 0)) return toast("Enter a valid stake.");
  const legs = S.slip.map(id => S.legs[id]);
  const ev = r.p * price - 1;
  const leg = {
    fixture: `${m.home} vs ${m.away}`,
    selection: legs.map(l => l.label).join(" & "),
    angle: `HAWK: ${pct(r.p, 1)} to land · fair ${odds(r.fair)} · ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}% at ${odds(price)}` +
           (boost ? ` (${odds(quoted)} + ${boost}% boost)` : ""),
    odds: price, type: "builder", league: m.league,
    subSelections: legs.map(l => ({ label: l.label, odds: +(l.bookPrice || l.fair).toFixed(2) })),
    hawk: hawkPart(m, legs, r.p),
  };
  recordB365Price();
  if (saveToVault([leg], stake, price, { source: "hawk", hawkP: r.p }))
    toast(`🦅 Logged in your Vault: €${stake.toFixed(2)} @ ${odds(price)}${boost ? ` (boosted from ${odds(quoted)})` : ""}. It settles itself after the match.`);
}
// What the Vault needs to settle a match's legs by itself after the final
// whistle (and to check HAWK's track record): the 365Scores game, and each
// leg's id, player and HAWK's chance.
function hawkPart(info, legs, p) {
  return { game: String(info.id), league: info.league, home: info.home, away: info.away, kickoff: info.kickoff, p,
           legs: legs.map(l => ({ id: l.id, label: l.label, market: l.market, p: l.p, pRaw: l.pRaw != null ? l.pRaw : l.p,
                                  player: l.player || null, side: l.side || null,
                                  bookPrice: l.bookPrice || null })) };   // Bet365's single price when you bet (closing price check)
}
// Adds a PENDING bet to the Vault and takes the stake off its bankroll.
function saveToVault(legs, stake, price, extra = {}) {
  let bankroll, bets;
  try {
    bankroll = parseFloat(localStorage.getItem("hawk_bankroll")) || 1000.0;
    bets = JSON.parse(localStorage.getItem("hawk_bets")) || [];
  } catch { toast("Couldn't open the Vault's storage in this browser."); return false; }
  if (bankroll < stake) { toast(`Not enough in your Vault bankroll (€${bankroll.toFixed(2)}).`); return false; }
  bets.unshift({
    id: "bet_" + Date.now(),
    date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }),
    legs, stake, odds: price, potentialReturn: stake * price, status: "PENDING", ...extra,
  });
  try {
    localStorage.setItem("hawk_bankroll", (bankroll - stake).toFixed(2));
    localStorage.setItem("hawk_bets", JSON.stringify(bets));
  } catch { toast("Couldn't save to the Vault's storage."); return false; }
  return true;
}

function verdict() {
  const out = $("#verdict"), r = S.result;
  const { price, boost, stake, eff } = checkerInputs();
  // With a boost, the bookmaker's quoted price only has to reach this to be fair.
  const needed = r && r.fair ? 1 + (r.fair - 1) / (1 + boost / 100) : null;
  if (!r || !r.p || !(price > 1)) {
    out.innerHTML = r && r.fair ? `<div class="note">Enter the price your bookmaker offers for this exact builder. Break-even is
      <b>${odds(needed)}</b>${boost ? ` with your ${boost}% boost (${odds(r.fair)} without)` : ""}; aim for ${odds(needed * 1.05)}+.</div>` : "";
    return;
  }
  const ev = r.p * eff - 1;
  const good = ev > 0;
  out.innerHTML = `<div class="verdict ${good ? "good" : "bad"}">${good ? "✅ VALUE" : "❌ OVERPRICED"} ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%
    ${boost ? `<small>With your ${boost}% boost, ${odds(price)} pays like <b>${odds(eff)}</b>.</small>` : ""}
    <small>That price implies a ${pct(1 / eff, 1)} chance — HAWK says ${pct(r.p, 1)}.</small>
    <small>${good ? `Expected profit ≈ €${(ev * stake).toFixed(2)} on €${stake.toFixed(2)} (wins ${pct(r.p, 1)} of the time, pays €${(eff * stake).toFixed(2)}).`
                  : `The bookmaker keeps ≈ €${(-ev * stake).toFixed(2)} of every €${stake.toFixed(2)} on average. It needs ${odds(needed)}+${boost ? " with this boost" : ""} to be fair — try swapping legs or another book.`}</small></div>
    ${stakeAdvice(r.p, eff)}`;
  bindStakeAdvice(out, (v) => { if (v) { S.chk.stake = v; $("#stake").value = v; } verdict(); });
}

/* ---------- recommended stake (Kelly) ---------- */
// Kelly: the share of your bankroll that grows it fastest when HAWK's chance
// is right. HAWK uses a fraction of it (¼ by default) and never more than 5%
// of the bankroll, because the chance is an estimate. Bankroll = your Vault's.
const KELLY_CAP = 0.05, KELLY_FRACS = [[0.125, "⅛"], [0.25, "¼"], [0.5, "½"]];
function vaultBankroll() { try { return parseFloat(localStorage.getItem("hawk_bankroll")) || 1000; } catch { return 1000; } }
function kellyStake(p, price) {
  if (!(p > 0 && p < 1 && price > 1)) return null;
  const b = price - 1, full = (b * p - (1 - p)) / b, bankroll = vaultBankroll();
  if (full <= 0) return { stake: 0, pct: 0, bankroll };
  const pct = Math.min(full * S.kellyFrac, KELLY_CAP);
  return { stake: Math.floor(bankroll * pct * 100) / 100, pct, bankroll, capped: full * S.kellyFrac > KELLY_CAP };
}
function stakeAdvice(p, price) {
  const k = kellyStake(p, price);
  if (!k) return "";
  const frac = `<select class="kfrac" title="How much of the full Kelly stake to use">${KELLY_FRACS.map(([f, t]) =>
    `<option value="${f}" ${f === S.kellyFrac ? "selected" : ""}>${t} Kelly</option>`).join("")}</select>`;
  if (!k.stake) return `<div class="kelly">💡 Recommended stake: <b>none</b> — at this price it isn't value. ${frac}</div>`;
  return `<div class="kelly">💡 Recommended stake: <b>€${k.stake.toFixed(2)}</b> = ${(100 * k.pct).toFixed(1)}% of your €${k.bankroll.toFixed(0)} Vault bankroll
    ${k.capped ? "(capped at 5%)" : ""} ${frac} <button class="linkbtn" data-usestake="${k.stake.toFixed(2)}">use it</button></div>`;
}
function bindStakeAdvice(root, useStake) {
  const sel = root.querySelector(".kfrac"), use = root.querySelector("[data-usestake]");
  if (sel) sel.onchange = (e) => { S.kellyFrac = +e.target.value; savePref("hawk.kellyFrac", S.kellyFrac); useStake(null); };
  if (use) use.onclick = () => useStake(use.dataset.usestake);
}

// Build: HAWK finds up to 5 different tickets for your settings. Pressing
// Build again (same settings) moves to the next one; the numbered buttons on
// the ticket jump straight to one. Changing a setting, or locking/removing a
// leg, starts a fresh set.
function buildBody() {
  const locked = S.slip.filter(id => S.locked.has(id));
  return { id: String(S.match.id), target: +S.target.toFixed(2), style: S.style, focus: S.focus, maxLegs: S.maxLegs,
           favourite: S.favourite, extras: S.extras, picks: S.picks, locked, banned: [...new Set([...S.banned, ...unofferedLegIds()])],
           known: knownLegIds(),
           learnt: propPrices().length };   // (a new Bet365 prop price → fresh options)
}
const sameOptions = () => S.options && S.match && S.options.sig === JSON.stringify(buildBody())
  && S.slip.join("|") === S.options.list[S.options.at].legs.map(l => l.id).join("|");
function showOption(i) {
  const o = S.options; o.at = (i + o.list.length) % o.list.length;
  S.result = o.list[o.at]; S.slip = S.result.legs.map(l => l.id);
  renderSlip(); refreshTab();
}
async function build() {
  if (!S.match) return;
  if (sameOptions() && S.options.list.length > 1) {
    showOption(S.options.at + 1);
    toast(`Option ${S.options.at + 1} of ${S.options.list.length}`);
    return;
  }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "SIMULATING…";
  try {
    const body = buildBody(), { options } = await api("/api/options", body);
    S.options = { sig: JSON.stringify(body), list: options, at: 0 };
    S.result = options[0];
    S.slip = S.result.legs.map(l => l.id);
    // Keep the build's settings signature valid: the new slip's locks are the same ones.
    if (!S.slip.length) toast("No legs fit this style — try another style or target.");
    else if (S.result.fair < S.target * 0.97) toast(`Best found: ${odds(S.result.fair)} — raise max legs or change style to go higher.`);
    else if (options.length > 1) toast(`${options.length} options found — press Build again for the next.`);
  } catch (err) { toast(err.message); }
  renderSlip(); refreshTab();
  if (narrow() && S.slip.length) $("#slip").scrollIntoView({ behavior: "smooth" });
}

/* ---------- Bet365 checklist ---------- */
// HAWK can't place bets on Bet365 (no public API, and it would mean a bot on
// their site). This lays the ticket out in the order you'll find the legs in
// Bet365's Bet Builder, with tick boxes, and the price that makes it worth it.
const CHECK_SECTIONS = [["Result", /Result|Double Chance|Win to Nil|Winning Margin|Handicap|Correct Score|First Team/],
  ["Goals", /Goals|Both Teams|Clean Sheet/], ["Corners", /Corners/], ["Cards", /Cards/], ["Shots on target (match)", /Match Shots on Target/]];
function openChecklist() {
  const m = S.match, r = S.result;
  if (!m || !S.slip.length) return;
  const legs = S.slip.map(id => S.legs[id]).filter(Boolean);
  const groups = [];
  for (const [name, re] of CHECK_SECTIONS) { const g = legs.filter(l => l.kind !== "player" && re.test(l.market)); if (g.length) groups.push([name, g]); }
  const other = legs.filter(l => l.kind !== "player" && !groups.some(([, g]) => g.includes(l)));
  if (other.length) groups.push(["Other", other]);
  const players = {};
  for (const l of legs.filter(l => l.kind === "player")) (players[l.player] ||= []).push(l);
  for (const [name, g] of Object.entries(players)) groups.push([`Player: ${name}`, g]);
  const fair = r && r.fair, worth = fair ? fair * 1.02 : null;
  modal(`<div class="mhead"><div><div style="font-size:20px;font-weight:800">📋 Build it on Bet365</div>
      <div class="muted">${esc(m.home)} v ${esc(m.away)} · open the match on Bet365 → <b>Bet Builder</b> tab, then tick each leg as you add it.</div></div>
      <button class="x" data-close title="Close">✕</button></div>
    <div class="chk-list">${groups.map(([name, g]) => `<div class="chk-grp">${esc(name)}</div>${g.map(l => `
      <label class="chk-row"><input type="checkbox"><span>${l.b365 ? `<b>${esc(l.b365)}</b> <span class="muted">= ${esc(l.label.replace(/^.*?(Over|Under)/, "$1"))}</span>`
        : esc(l.player ? capitalise(l.label.replace(l.player + ": ", "").replace(l.player + " ", "")) : l.label)}</span>
        <span class="muted">${esc(l.market)} <button class="linkbtn muted" data-cno365="${esc(l.id)}" title="Can't find it on Bet365? HAWK stops using ${esc(l.market)} for this league and swaps in the next best leg">not there?</button></span></label>`).join("")}`).join("")}</div>
    <div class="chk-price">${fair ? `HAWK's fair odds <b>${odds(fair)}</b> — it's worth it if Bet365 pays <b style="color:var(--accent)">${odds(worth)}+</b>.
      Type Bet365's price into the slip's price box and HAWK checks it (and suggests a stake) — and learns from it how Bet365 prices player legs, so there's nothing else to type.` : ""}</div>
    <div class="note">Bet365 names some legs a little differently (e.g. "Anytime Goalscorer", "Player Shots on Target 1+"). If a leg isn't offered,
      tap <b>🔄 swap</b> on it in the slip — HAWK puts the next best leg in.</div>`);
  const bg = document.querySelector(".modal-bg");
  bg.querySelectorAll(".chk-row input[type=checkbox]").forEach(cb => cb.onchange = () => {
    cb.closest(".chk-row").classList.toggle("done", cb.checked);
    const all = [...bg.querySelectorAll(".chk-row input[type=checkbox]")];
    if (all.every(x => x.checked)) toast("✅ All legs added — now check Bet365's price against HAWK's.");
  });
  bg.querySelectorAll("[data-cno365]").forEach(b => b.onclick = async (e) => {
    e.preventDefault();   // (inside the row's label: don't tick it)
    await notOnBet365(b.dataset.cno365);
    openChecklist();      // the list again, with the replacement leg in
  });
  bg.querySelectorAll("[data-cprice]").forEach(inp => {
    inp.onclick = (e) => e.preventDefault() || inp.focus();   // typing a price doesn't tick the row
    inp.onchange = () => {
      const v = parseFloat(String(inp.value).replace(",", "."));
      if (!(v > 1)) return;
      recordPropPrice(inp.dataset.cprice, v);
      renderSlip();
      const est = HAWK.propEstimate(S.legs[inp.dataset.cprice]);
      if (v <= HAWK.DEAD_PRICE || (est && est <= HAWK.DEAD_PRICE)) inp.closest(".chk-row").classList.add("deadrow");
    };
  });
}

async function evaluateSlip() {
  try { S.result = S.slip.length ? await api("/api/evaluate", { id: String(S.match.id), legs: S.slip }) : null; }
  catch (err) { toast(err.message); }
  renderSlip(); refreshTab();
}
function addLeg(id) {
  const leg = S.legs[id]; if (!leg) return;
  if (S.slip.includes(id)) { removeLeg(id); return; }
  const clash = S.slip.find(x => S.legs[x] && S.legs[x].group === leg.group);
  if (clash) { S.slip = S.slip.map(x => x === clash ? id : x); S.locked.delete(clash); toast(`Swapped for: ${leg.label}`); }
  else S.slip.push(id);
  S.locked.add(id); S.banned.delete(id);
  evaluateSlip();
}
function removeLeg(id) { S.slip = S.slip.filter(x => x !== id); S.locked.delete(id); S.banned.add(id); evaluateSlip(); }
// Swap: take a leg out, keep every other leg as it is, and let HAWK add the
// best replacement(s) to get back up to the target odds (same style, focus
// and picks as a normal build). The swapped-out leg stays banned.
// "🚫 Not on Bet365": Bet365 doesn't offer that market for this league (e.g.
// goalkeeper saves in Liga Portugal). One tap and HAWK stops building with it
// there, swapping the next best leg in; the slip lists them to undo.
const notOn365 = () => new Set(loadPref("hawk.notOn365", []));
const no365Key = (l, league = S.match && S.match.league) => `${league}|${l.market}`;
// …and the other way round: every builder you check with Bet365's price (or
// log in the Vault) was on Bet365, so its markets exist there for that league.
// When HAWK has to guess a leg's price, it picks from those markets first.
const onBet365 = () => new Set(loadPref("hawk.onBet365", []));
function markOnBet365() {
  if (!S.match || !S.slip.length) return;
  const on = onBet365(), off = notOn365();
  for (const id of S.slip) { const l = S.legs[id]; if (l) { on.add(no365Key(l)); off.delete(no365Key(l)); } }
  savePref("hawk.onBet365", [...on].slice(-500)); savePref("hawk.notOn365", [...off]);
}
const knownLegIds = () => { const on = onBet365(); return S.match && on.size ? Object.values(S.legs).filter(l => on.has(no365Key(l))).map(l => l.id) : []; };
function unofferedLegIds() {
  const set = notOn365();
  return S.match && set.size ? Object.values(S.legs).filter(l => set.has(no365Key(l))).map(l => l.id) : [];
}
async function notOnBet365(id) {
  const l = S.legs[id];
  if (!l || !S.match) return;
  const set = notOn365(); set.add(no365Key(l)); savePref("hawk.notOn365", [...set]);
  toast(`🚫 Got it: no ${l.market} at Bet365 in ${S.match.league} — HAWK leaves it out there`);
  await swapLeg(id);
}
function no365Note() {
  const league = S.match && S.match.league, mine = [...notOn365()].filter(k => k.startsWith(league + "|"));
  if (!mine.length) return "";
  return `<div class="note">🚫 Not on Bet365 in ${esc(league)}: ${mine.map(k => { const mk = k.slice(league.length + 1);
    return `${esc(mk)} <button class="linkbtn muted" data-on365="${esc(k)}" title="It is on Bet365 after all — let HAWK use it again">✕</button>`; }).join(" · ")}</div>`;
}
async function swapLeg(id) {
  if (!S.match) return;
  const out = S.legs[id], keep = S.slip.filter(x => x !== id);
  S.locked.delete(id); S.banned.add(id);
  try {
    const r = await api("/api/build", { ...buildBody(), locked: keep });
    const added = r.legs.map(l => l.id).filter(x => !keep.includes(x));
    S.result = r; S.slip = r.legs.map(l => l.id);
    toast(added.length ? `🔄 ${out.label} → ${added.map(a => S.legs[a].label).join(" + ")}`
      : r.fair >= S.target * 0.97 ? `Removed ${out.label} — the rest still reaches your odds.` : `Removed ${out.label} — nothing else fits, try another style or more legs.`);
  } catch (err) { toast(err.message); S.slip = keep; return evaluateSlip(); }
  renderSlip(); refreshTab();
}
function copySlip() {
  const m = S.match, r = S.result;
  const text = [`BET BUILDER — ${m.home} v ${m.away}`, ...S.slip.map(id => `✓ ${S.legs[id].label}  (${S.legs[id].market})`),
    `Chance ${pct(r && r.p, 1)} · fair odds ${odds(r && r.fair)}`].join("\n");
  navigator.clipboard.writeText(text).then(() => toast("Slip copied"), () => toast("Couldn't copy"));

/* ---------- acca: several matches on one ticket ---------- */
// Each part is one match: a single leg or a same-match builder, with HAWK's
// chance for it. Matches are independent, so the acca's chance is the
// product of the parts'. Kept in this browser's storage.
const VALUE_EDGE = 1.02;   // "value" = Bet365 pays at least 2% more than fair
function saveAcca() { savePref("hawk.acca", S.acca); renderAccaBtn(); }
const accaLegCount = () => S.acca.reduce((s, pt) => s + pt.legs.length, 0);
function renderAccaBtn() {
  const n = accaLegCount(), b = $("#accaBtn");
  b.innerHTML = `🧩 <span>Acca</span>${n ? `<em class="count">${n}</em>` : ""}`;
  b.title = n ? `Your acca: ${n} leg${n === 1 ? "" : "s"} — and the Monster Acca` : "Several matches on one ticket, and the Monster Acca";
}
// A single leg's Bet365 price is known, and an acca of singles pays their
// product. A same-match builder is priced by the bookmaker, so it's unknown.
const partPrice = (pt) => (pt.legs.length === 1 ? pt.legs[0].bookPrice || null : null);
function accaTotals(parts = S.acca) {
  if (!parts.length) return { p: null, fair: null, known: null, legs: 0 };
  const p = parts.reduce((s, pt) => s * pt.p, 1), prices = parts.map(partPrice);
  return { p, fair: p > 0 ? 1 / p : null, known: prices.every(Boolean) ? prices.reduce((s, x) => s * x, 1) : null,
           legs: parts.reduce((s, pt) => s + pt.legs.length, 0) };
}
const makePart = (info, legs, p) => ({ id: String(info.id), league: info.league, home: info.home, away: info.away,
                                       kickoff: info.kickoff, legs, p, fair: p > 0 ? 1 / p : null });
function putPart(part) {   // one part per match: adding a match again replaces it
  const i = S.acca.findIndex(x => x.id === part.id);
  if (i >= 0) S.acca[i] = part; else S.acca.push(part);
  S.acca.sort((a, b) => (a.kickoff || "").localeCompare(b.kickoff || ""));
  saveAcca();
  return i >= 0;
}
function accaToast(replaced, home, away) {
  const t = accaTotals();
  toast(`${replaced ? "Updated" : "Added"} ${home} v ${away}. Acca: ${S.acca.length} match${S.acca.length === 1 ? "" : "es"}, ${t.legs} legs, fair ${odds(t.fair)}.`);
}
function addSlipToAcca() {
  const m = S.match, r = S.result;
  if (!m || !S.slip.length || !r || !r.p) return toast("Build a ticket first.");
  const legs = S.slip.map(id => { const l = S.legs[id]; return { id, label: l.label, market: l.market, kind: l.kind, p: l.p, pRaw: l.pRaw, fair: l.fair,
    bookPrice: l.bookPrice || null, player: l.player || null, side: l.side || null }; });
  accaToast(putPart(makePart(m, legs, r.p)), m.home, m.away);
  renderSlip();
}
function addScanToAcca(id) {

}

function accaVerdict() {
  const out = $("#accaVerdict"); if (!out) return;
  const a = accaInputs();
  if (!(a.price > 1) || !a.p) {
    out.innerHTML = `<div class="note">Type the price Bet365 shows for this acca. Break-even is <b>${odds(a.fair)}</b>.</div>`;
    return;
  }
  const ev = a.p * a.eff - 1, good = ev > 0;
  // The boost that would make this price fair (Bet365 runs acca boosts on 3+ legs).
  const boostNeeded = a.price > 1 && a.fair > a.price ? 100 * ((a.fair - 1) / (a.price - 1) - 1) : 0;
  out.innerHTML = `<div class="verdict ${good ? "good" : "bad"}">${good ? "✅ VALUE" : "❌ OVERPRICED"} ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%
    ${!a.typed ? `<small>Using Bet365's price: ${a.legs} singles multiplied = ${odds(a.price)}.</small>` : ""}
    ${a.boost ? `<small>With your ${a.boost}% boost, ${odds(a.price)} pays like <b>${odds(a.eff)}</b>.</small>` : ""}
    <small>HAWK: lands ${pct(a.p, a.p < 0.1 ? 2 : 1)} of the time — about 1 in ${Math.round(1 / a.p)}. Pays €${(a.eff * a.stake).toFixed(2)} on €${a.stake.toFixed(2)}.</small>
    <small>${good ? `Expected profit ≈ €${(ev * a.stake).toFixed(2)} per €${a.stake.toFixed(2)} over many accas like it — most will still lose.`
      : `Bet365's margin adds up over ${a.legs} legs: you'd lose ≈ €${(-ev * a.stake).toFixed(2)} per €${a.stake.toFixed(2)} on average.${boostNeeded && !a.boost ? ` An acca boost of ${Math.ceil(boostNeeded)}%+ would make it fair.` : ""}`}</small></div>
    ${stakeAdvice(a.p, a.eff)}`;
  bindStakeAdvice(out, (v) => { if (v) { S.accaChk.stake = v; $("#aStake").value = v; } accaVerdict(); });
}
function copyAcca() {

function sendAccaToVault() {

/* ---------- Monster Acca ---------- */
function monsterParams() { const mo = S.monster; return { leagues: [...mo.leagues], hours: hoursFor(mo.hours), perMatch: mo.perMatch, style: mo.style, focus: S.focus, extras: S.extras }; }
function monsterStale() {  // settings changed since the last build
  const p = S.monster.data && S.monster.data.params, want = monsterParams();
  return !!p && (p.perMatch !== want.perMatch || p.style !== want.style || S.monster.builtWindow !== S.monster.hours ||
                 [...p.leagues].sort().join() !== [...want.leagues].sort().join());
}
async function toggleMonster() {
  try {
    if (S.monster.data && S.monster.data.running) S.monster.data = await api("/api/monster/stop", {});
    else {
      if (!S.monster.leagues.size) return toast("Pick at least one league.");
      S.monster.skip = new Set(); S.monster.alt = {};
      S.monster.builtWindow = S.monster.hours;
      S.monster.data = await api("/api/monster", monsterParams());
    }
  } catch (err) { toast(err.message); }
  updateMonster();
  pollMonster();
}
async function pollMonster() {
  clearTimeout(S.monster.timer);
  try { S.monster.data = await api("/api/monster"); } catch { /* keep the last status */ }
  updateMonster();
  if (S.monster.data && S.monster.data.running) S.monster.timer = setTimeout(pollMonster, 1500);
}
// The best parts, one per match, until the ticket has the legs you asked for.
function monsterPick() {
  const d = S.monster.data, mo = S.monster;
  if (!d) return { picked: [], bench: [] };
  const now = Date.now(), single = d.params.perMatch === 1;
  // 1 leg per match: each match uses the leg you've cycled to with "other leg" (best first).
  const withAlt = (r) => { const i = (mo.alt || {})[String(r.id)] || 0; return r.alts && r.alts[i] ? { ...r, ...r.alts[i], altIdx: i } : r; };
  const pool = d.results.map(withAlt).filter(r => !mo.skip.has(String(r.id)) && (!r.kickoff || new Date(r.kickoff).getTime() > now))
    .sort(single ? (a, b) => b.ratio - a.ratio || b.p - a.p : (a, b) => b.p - a.p);
  const picked = [], bench = [];
  let n = 0;
  for (const r of pool) { if (n < mo.legs) { picked.push(r); n += r.legs.length; } else bench.push(r); }
  picked.sort((a, b) => (a.kickoff || "").localeCompare(b.kickoff || ""));
  return { picked, bench };
}
// force: redraw even if the picks look the same (after a swap). Otherwise the
// list is only redrawn when it changes, so a tap during a scan isn't lost to a
// redraw every 1.5 seconds.
function updateMonster(force = false) {

  $("#monProg").innerHTML = d.running || d.total ? `<div class="prog"><span style="width:${d.total ? 100 * d.done / d.total : 3}%"></span></div>
    <div class="note">${d.running ? `Checking fixtures… ${d.done} of ${d.total || "?"}` : `Checked ${d.done} fixture${d.done === 1 ? "" : "s"}`}${
      d.errors ? ` · ${d.errors} skipped (no odds or data yet)` : ""}</div>` : "";
  if (!d.params) { $("#monRes").innerHTML = ""; return; }
  const { picked, bench } = monsterPick(), t = accaTotals(picked), single = d.params.perMatch === 1;
  if (!picked.length) {

        ${ev != null ? `<br><span style="color:${ev >= 0 ? "var(--accent)" : "#ff8a8a"};font-weight:700">${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}% expected at Bet365's price</span>` : ""}</div>

    ${t.legs < S.monster.legs && !d.running ? `<div class="warn">Only ${t.legs} legs fit — try more leagues, a longer window or bolder legs.</div>` : ""}
    ${picked.map(r => partRow(r, r.alts && r.alts.length > 1

    <div class="note">${single ? `From each match: the Bet365-priced match leg within the ${esc(STYLES[d.params.style].label.toLowerCase())} range where Bet365 pays closest to — or more than — HAWK's fair odds.
      Bet365 multiplies the singles, so ${odds(t.known)} is what it should show. Every leg carries a little bookmaker margin and it adds up over ${t.legs} legs,
      so a negative figure is normal — an acca boost (Boost % in your acca) can flip it.`
      : `Each match is a ${d.params.perMatch}-leg builder, safest first. Bet365 prices each builder itself — add it to your acca and type the price it shows.`}

    S.acca = []; picked.forEach(r => putPart(makePart(r, r.legs, r.p))); S.accaChk.price = ""; renderAccaBody(); updateMonster(); toast(`🧩 Your acca: ${t.legs} legs.`); };
  $("#monAdd").onclick = () => { picked.forEach(r => putPart(makePart(r, r.legs, r.p))); renderAccaBody(); toast(`🧩 Added — your acca has ${accaLegCount()} legs.`); };
}
// "Other leg" (1 leg per match): the next-best Bet365 leg from the same match,
// round and round. If this ticket is already your acca, that part changes too.
function otherLeg(id) {
  const mo = S.monster, r = ((mo.data || {}).results || []).find(x => String(x.id) === String(id));
  if (!r || !r.alts || r.alts.length < 2) return;
  mo.alt ||= {};
  const from = r.alts[mo.alt[id] || 0], i = ((mo.alt[id] || 0) + 1) % r.alts.length, to = r.alts[i];
  mo.alt[id] = i;
  const inAcca = S.acca.some(pt => String(pt.id) === String(id));
  if (inAcca) { const part = { ...r, ...to }; putPart(makePart(part, part.legs, part.p)); renderAccaBody(); }
  toast(`🔄 ${r.home} v ${r.away}: ${from.legs[0].label} → ${to.legs[0].label} (${pct(to.p)} @ ${odds(to.bookPrice)})${inAcca ? " — your acca too" : ""}`);
  updateMonster(true);
}
// Swap out: drop that match and let the next best take its place. If the
// ticket is already your acca ("Use as my acca"), your acca is swapped too.
function monsterClick(e) {
  const a = e.target.closest("[data-malt]");
  if (a) return otherLeg(a.dataset.malt);
  const s = e.target.closest("[data-mskip]");
  if (!s) return;
  const id = s.dataset.mskip, before = monsterPick().picked;
  const out = before.find(r => String(r.id) === id);
  S.monster.skip.add(id);
  const after = monsterPick().picked, incoming = after.filter(r => !before.some(b => String(b.id) === String(r.id)));
  const inAcca = S.acca.findIndex(pt => String(pt.id) === id);
  if (inAcca >= 0) {
    S.acca.splice(inAcca, 1);
    incoming.forEach(r => { if (!S.acca.some(pt => String(pt.id) === String(r.id))) putPart(makePart(r, r.legs, r.p)); });
    saveAcca(); renderAccaBody();
  }
  const name = (r) => `${r.home} v ${r.away}`;
  toast(incoming.length ? `🔄 ${out ? name(out) : "Match"} → ${incoming.map(name).join(" + ")}${inAcca >= 0 ? " (your acca too)" : ""}`
    : `Removed ${out ? name(out) : "that match"} — no other match fits these settings (try more leagues or a longer window).`);
  updateMonster(true);
}

const SCORES_MS = 30 * 1000;
const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function myBetGames() {   // games you have a HAWK bet on (from the Vault)

    if (S.view !== "scores") { clearInterval(S.scores.timer); return; }

    const busy = (S.scores.data || []).some(g => g.status === 3 || due(g));

// HAWK's prediction in the Scores list: home · draw · away %, the likeliest in
// green, ⚡ when the upset radar says High+. Finished: ✓/✗ for whether the
// likeliest result happened. From data/predictions.json (GitHub saves them for
// every match in the 6 hours before kick-off); other matches: tap for the full page.
async function loadPredictions() {
  if (S.preds && Date.now() - S.preds.t < 10 * 60e3) return;

// Your pending HAWK tickets on the match in play: the live chance of each leg
// and of the whole ticket (other matches in an acca count at their result, or
// HAWK's pre-match chance if they haven't finished), what the ticket is worth
// on average right now, and whether Bet365's cash-out offer beats that.
async function myLiveTickets(gameId) {
  let bets = [];
  try { bets = JSON.parse(localStorage.getItem("hawk_bets")) || []; } catch { return []; }
  const out = [];
  for (const b of bets) {
    if (b.status !== "PENDING" || !(b.legs || []).some(l => l.hawk && String(l.hawk.game) === String(gameId))) continue;
    let p = 1, approx = false, unknown = 0;
    const parts = [];
    for (const l of b.legs) {
      if (!l.hawk) { unknown++; continue; }
      if (String(l.hawk.game) === String(gameId)) {
        const live = await api(`/api/ticketlive?id=${gameId}`, { legs: l.hawk.legs });
        if (!live) { unknown++; continue; }
        parts.push({ fixture: l.fixture, live });
        p *= live.p; unknown += live.unknown;
      } else {
        const rs = (l.hawk.legs || []).map(h => h.result);
        if (rs.includes("lost")) p = 0;
        else if (rs.length && rs.every(r => r === "won")) { /* already landed */ }
        else { p *= l.hawk.p || 1; approx = true; }
        parts.push({ fixture: l.fixture, other: rs.includes("lost") ? "lost" : rs.length && rs.every(r => r === "won") ? "won" : "pending", p: l.hawk.p });
      }
    }
    out.push({ id: b.id, stake: b.stake, odds: b.odds, ret: b.potentialReturn, p, approx, unknown, parts });
  }
  return out;
}

// HAWK's live win chances, with where they come from in plain words: the
// bookmakers' live prices, HAWK's own read (pre-match strength, score, time
// left, red cards, live xG) and what HAWK said before kick-off.
function liveHawk(d) {
  const p = d.probs || {}, hp = pct100([p.home, p.draw, p.away]);
  const three = (x) => pct100([x.home, x.draw, x.away]).map(v => v + "%").join(" · ");
  const pre = S.preds && S.preds.m[String(d.id)];
  const srcs = [];
  if (d.market) srcs.push(`<span>Bookmakers live (${d.market.books}): ${three(d.market)}</span>`);
  if (d.own) srcs.push(`<span title="HAWK's pre-match strength of both teams for the minutes left, adjusted for the score, red cards and who's creating chances (live xG)">🦅 HAWK's own read: <b>${three(d.own)}</b></span>`);
  if (pre && pre.probs) srcs.push(`<span>🦅 Before kick-off: ${three(pre.probs)}</span>`);
  // The plain-words line, told with the likeliest result.
  const fi = hp.indexOf(Math.max(...hp)), who = [`${d.home} to win`, "A draw", `${d.away} to win`][fi];
  const at = (x) => x ? pct100([x.home, x.draw, x.away])[fi] : null, bk = at(d.market);
  const t = d.tilt || [1, 1], word = (x) => x > 1.02 ? "more" : x < 0.98 ? "less" : null;
  const created = [[d.home, word(t[0])], [d.away, word(t[1])]].filter(([, w]) => w);
  const xgLine = !(d.minute >= 15) ? "Too early to judge who's creating more — HAWK starts adjusting for live xG after 15 minutes"
    : !created.length ? "Both teams are creating about what HAWK expected (live xG)"
    : created.length === 2 && created[0][1] === created[1][1] ? `Both teams are creating ${created[0][1]} than HAWK expected (live xG)`
    : created.map(([n, w]) => `${n} ${w === "more" ? "are creating more" : "are creating less"} than expected`).join(" and ") + " (live xG)";
  const how = d.basis !== "live prices" ? `No live bookmaker prices right now, so this is HAWK's own read: its pre-match strength of both teams for the ${Math.round(d.remaining || 0)} minutes left, the score and red cards.`
    : bk == null ? `From the bookmakers' live prices, adjusted a little for live xG.`
    : bk === hp[fi] ? `${who}: bookmakers ${bk}%, HAWK ${hp[fi]}% too. ${xgLine}${created.length && d.minute >= 15 ? ", but that moves it by less than 1%" : ""}.`
    : `${who}: bookmakers ${bk}% → HAWK ${hp[fi]}%. ${xgLine}, so HAWK ${hp[fi] > bk ? "rates it a bit higher" : "rates it a bit lower"} than the bookmakers.`;
  return `<div class="bar3"><div class="h" style="flex:${p.home}">${hp[0]}%</div><div class="d" style="flex:${p.draw}">${hp[1]}%</div><div class="a" style="flex:${p.away}">${hp[2]}%</div></div>
    <div class="bar3-legend"><span>${esc(d.home)}</span><span>Draw</span><span>${esc(d.away)}</span></div>
    ${srcs.length ? `<div class="srcs">${srcs.join("")}</div>` : ""}
    <div class="note" style="margin-top:6px">${esc(how)} About ${Math.round(d.remaining || 0)} minutes left incl. stoppage time.</div>
    ${nextGoalBox(d)}`;
}
// ⚽ Next goal: HAWK's chances (from the goals still expected) beside Unibet's
// live "Next Goal" prices, and who's likeliest to score it.
function nextGoalBox(d) {
  const n = d.next;
  if (!n) return "";
  const hawk = pct100([n.home, 1 - n.any, n.away]), bk = d.nextBook && d.nextBook.team ? pct100([d.nextBook.team.home, d.nextBook.team.none, d.nextBook.team.away]) : null;
  const seg = (v) => `<div class="h" style="flex:${v[0]}">${v[0]}%</div><div class="d" style="flex:${v[1]}">${v[1]}%</div><div class="a" style="flex:${v[2]}">${v[2]}%</div>`;
  // Likeliest scorers: Unibet's "Next Goal Scorer" prices, or else HAWK's own (each player's share of his team's goals).
  let scorers = (d.nextBook && d.nextBook.scorers || []).map(s => ({ name: s.player, p: s.p, src: d.nextBook.book }));
  if (!scorers.length && S.inplay && S.inplay.m) {
    const m = S.inplay.m, by = liveEventsBy(d, m), list = [];
    for (const side of ["home", "away"]) {
      const legs = (m.legs || []).filter(l => l.kind === "player" && l.side === side && /:score$/.test(l.id));
      const rate = (l) => -Math.log(1 - Math.min(0.95, l.p));
      const on = legs.filter(l => { const r = liveRec(by, side, l.player); return !(r && r.off); });
      const tot = on.reduce((a, l) => a + rate(l), 0);
      for (const l of on) list.push({ name: l.player, p: tot ? (rate(l) / tot) * n[side] : 0, src: "HAWK" });
    }
    scorers = list.sort((a, b) => b.p - a.p).slice(0, 5);
  }
  return `<div class="ng-box">
    <div class="ng-head">⚽ Next goal ${n.by ? `<span class="muted">· due by about ${n.by}'</span>` : `<span class="muted">· more likely no more goals</span>`}</div>
    <div class="ng-row"><span class="ng-src">🦅 HAWK</span><div class="bar3 sm">${seg(hawk)}</div></div>
    ${bk ? `<div class="ng-row"><span class="ng-src">${esc(d.nextBook.book)}</span><div class="bar3 sm">${seg(bk)}</div></div>` : ""}
    <div class="bar3-legend"><span>${esc(d.home)}</span><span>No more goals</span><span>${esc(d.away)}</span></div>
    <div class="ng-stats"><span>Another goal <b>${pct(n.any)}</b></span><span>2+ more <b>${pct(n.twoPlus)}</b></span>${
      bk ? `<span title="Unibet's live Next Goal prices, margin taken out">${esc(d.nextBook.book)}: another goal <b>${100 - bk[1]}%</b></span>` : ""}</div>
    ${scorers.length ? `<div class="ng-scorers"><span class="muted">Likeliest to score it${scorers[0].src === "HAWK" ? " (HAWK)" : ` (${esc(scorers[0].src)})`}:</span> ${
      scorers.map(s => `<span class="ng-p">${esc(s.name)} <b>${pct(s.p, s.p < 0.1 ? 1 : 0)}</b></span>`).join("")}</div>` : ""}
  </div>`;
}
