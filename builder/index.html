<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAWK · Bet Builder</title>
<!-- Icons: new names / ?v= so browsers drop the old cached logo -->
<link rel="icon" href="hawk-tab.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png?v=4" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=4">
<meta name="theme-color" content="#0d1114">
<style>
:root{
  --bg:#0d1114; --panel:#151b1f; --panel2:#1b2328; --line:#25313a; --text:#e8eff3; --muted:#8797a3;
  --accent:#14e3a1; --accent-d:#0a9e70; --gold:#ffd166; --red:#ff5d73; --blue:#4aa8ff; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* background: floodlight glows drifting slowly + a big faint hawk + vignette */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-glow i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(40px);will-change:transform}
.bg-glow i:nth-child(1){background:radial-gradient(closest-side,rgba(20,227,161,.15),transparent);left:-22vmax;top:-32vmax;animation:bgDrift1 24s ease-in-out infinite alternate}
.bg-glow i:nth-child(2){background:radial-gradient(closest-side,rgba(74,168,255,.09),transparent);right:-26vmax;top:-12vmax;animation:bgDrift2 30s ease-in-out infinite alternate}
.bg-glow i:nth-child(3){background:radial-gradient(closest-side,rgba(20,227,161,.10),transparent);left:18vmax;bottom:-46vmax;animation:bgDrift3 34s ease-in-out infinite alternate}
@keyframes bgDrift1{to{transform:translate(18vmax,12vmax)}}
@keyframes bgDrift2{to{transform:translate(-16vmax,18vmax)}}
@keyframes bgDrift3{to{transform:translate(-14vmax,-10vmax)}}
.bg-hawk{position:absolute;left:50%;top:56%;width:min(92vh,960px);transform:translate(-30%,-50%) rotate(-8deg);fill:#7cf7cf;opacity:.05}
.bg-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
@media (prefers-reduced-motion:reduce){.bg-glow i{animation:none}}
main.grid{position:relative;z-index:1}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}
/* header: row 1 = logo · pages · alerts + Vault, row 2 = leagues */
:root{--head:112px}
.top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,26,30,.97),rgba(13,17,20,.95));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 22px 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex-shrink:0}
.brand .logo{width:40px;height:40px;filter:drop-shadow(0 0 12px rgba(20,227,161,.35));transition:transform .2s}
.brand:hover .logo{transform:rotate(-4deg) scale(1.05)}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-size:20px;font-weight:900;letter-spacing:.22em;
  background:linear-gradient(180deg,#f2fffa,#7cf7cf 70%,#14e3a1);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark small{font-size:9.5px;font-weight:700;letter-spacing:.32em;color:var(--muted);margin-top:4px}
.mainnav{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.nav{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap;
  display:flex;align-items:center;gap:6px;transition:.15s}
.nav:hover{color:var(--text);background:var(--panel2)}
.nav.on{color:#04241a;background:linear-gradient(180deg,#3ff5bd,var(--accent));box-shadow:0 4px 14px -4px rgba(20,227,161,.6)}
.nav .count,.tool .count{font-style:normal;font-size:11px;font-weight:900;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  display:inline-grid;place-items:center;background:var(--gold);color:#241a00}
.nav.on .count{background:#04241a;color:var(--accent)}
.topright{display:flex;align-items:center;gap:8px;position:relative;flex-shrink:0}
.vaultlink{color:#d9b571;text-decoration:none;font-weight:700;font-size:13px;padding:7px 14px;border:1px solid #6b5530;border-radius:999px;white-space:nowrap}
.vaultlink:hover{background:rgba(217,181,113,.1)}
.vaultlink{display:flex;align-items:center;gap:7px}
.vaultlink img{width:20px;height:20px}
.empty .bigmark{width:72px;height:72px;filter:drop-shadow(0 0 18px rgba(20,227,161,.35))}
.ghost.vault{color:#d9b571;border-color:#6b5530}
.ghost.vault:hover{background:rgba(217,181,113,.08)}
.leagues{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 22px 10px}
.leagues::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;white-space:nowrap;transition:.15s;font-weight:600;font-size:13px}
.pill img{width:18px;height:18px;object-fit:contain;opacity:.85}
.pill:hover{border-color:#3a4a55}
.pill.on{background:var(--accent);color:#04241a;border-color:var(--accent);font-weight:800}
.pill.on img{filter:brightness(0) opacity(.75)}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 400px;gap:16px;padding:16px 22px;align-items:start}
@media (max-width:1250px){.grid{grid-template-columns:260px minmax(0,1fr)}.slipcol{grid-column:1/-1}}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.fixtures{padding:10px;max-height:calc(100vh - var(--head) - 24px);overflow:auto;position:sticky;top:calc(var(--head) + 10px)}
.fx{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.15s}
.fx:hover{background:var(--panel2)}
.fx.on{background:var(--panel2);border-color:var(--accent)}
.fx .team{display:flex;align-items:center;gap:8px;font-weight:600}
.fx .team img{width:20px;height:20px}
.fx .when{grid-row:1/3;grid-column:2;align-self:center;text-align:right;color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge.live{background:rgba(255,93,115,.15);color:var(--red)}
.badge.ok{background:rgba(20,227,161,.14);color:var(--accent)}
.badge.warn{background:rgba(255,209,102,.14);color:var(--gold)}
.muted{color:var(--muted)}
.empty{padding:60px 30px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:10px 0 6px;font-size:22px}
.hero{padding:22px 24px;border-radius:16px 16px 0 0;
  background:radial-gradient(1200px 200px at 50% -60px,rgba(20,227,161,.18),transparent),linear-gradient(180deg,#18242a,#151b1f)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.side img{width:64px;height:64px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.side .nm{font-size:18px;font-weight:800}
.mid{text-align:center}
.mid .ko{font-size:13px;color:var(--muted)}
.mid .x{font-size:28px;font-weight:900;color:#3d4d58;letter-spacing:.1em}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.section{padding:16px 24px;border-top:1px solid var(--line)}
.section h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar3{display:flex;height:34px;border-radius:10px;overflow:hidden;font-weight:800;font-size:13px}
.bar3 div{display:flex;align-items:center;justify-content:center;min-width:34px;transition:flex .6s}
.bar3 .h{background:var(--accent);color:#04241a}.bar3 .d{background:#34424c}.bar3 .a{background:var(--blue);color:#061a2c}
.srcs{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1000px){.two{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
.cs{display:grid;grid-template-columns:28px repeat(5,1fr);gap:4px;font-size:12px}
.cs .hd{color:var(--muted);text-align:center;align-self:center}
.cs .c{border-radius:7px;padding:7px 0;text-align:center;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--muted);border:1px solid transparent}
.tab.on{color:var(--text);border-color:var(--line);background:var(--panel2)}
.team-head{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.team-head img{width:22px;height:22px}
.pl{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);
  border:1px solid var(--line);margin-bottom:8px}
.pl .ph{width:40px;height:40px;border-radius:50%;background:#26323b center/cover;overflow:hidden}
.pl .ph img{width:40px;height:40px;object-fit:cover}
.pl .top1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pl .nm{font-weight:700}
.pos{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:#2b3842;color:#b9c7d1;margin-left:6px}
.rates{font-size:12px;color:var(--muted)}
.spark{display:flex;gap:2px;align-items:flex-end;height:18px}
.spark i{display:block;width:5px;background:#35505e;border-radius:2px}
.spark i.hit{background:var(--accent)}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.qc{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#22303a;border:1px solid #2e3e49;cursor:pointer;transition:.12s}
.qc:hover{border-color:var(--accent);color:var(--accent)}
.qc.in{background:rgba(20,227,161,.16);border-color:var(--accent);color:var(--accent)}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:10px}
.lg{margin-bottom:14px}
.lg h4{margin:0 0 6px;font-size:12px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:1fr 64px 56px 64px 30px;gap:8px;align-items:center;padding:7px 10px;border-radius:9px}
.lhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 10px 4px}
.lrow:hover{background:var(--panel2)}
.pb{height:5px;border-radius:3px;background:#24313a;overflow:hidden}
.pb span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent))}
.add{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.add:hover{border-color:var(--accent);color:var(--accent)}
/* slip */
/* The slip sticks beside the match and scrolls on its own when the ticket is long. */
.slipcol{position:sticky;top:calc(var(--head) + 10px);max-height:calc(100vh - var(--head) - 24px);overflow-y:auto;border-radius:16px;
  scrollbar-width:thin;scrollbar-color:#2f3d47 transparent}
.slipcol::-webkit-scrollbar{width:8px}
.slipcol::-webkit-scrollbar-thumb{background:#2f3d47;border-radius:8px}
@media (max-width:1250px){.slipcol{position:static;max-height:none;overflow:visible}}
.bp{font-size:12px;color:var(--muted)}
.bp b{color:var(--text);font-weight:700}
.bp.val b{color:var(--accent)}
.live-odds{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.live-odds .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.live-odds .dot.on{background:var(--accent);box-shadow:0 0 0 0 rgba(20,227,161,.6);animation:livepulse 2s infinite}
@keyframes livepulse{70%{box-shadow:0 0 0 6px rgba(20,227,161,0)}100%{box-shadow:0 0 0 0 rgba(20,227,161,0)}}
.linkbtn{background:none;border:0;padding:0 2px;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.sc-league{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sc-league:first-child{margin-top:0}
.sc-row{display:grid;grid-template-columns:58px 1fr 64px 1fr 64px;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;transition:.12s}
.sc-row:hover{background:var(--panel2);border-color:var(--line)}
.sc-row.is-live{background:rgba(255,93,115,.05)}
.sc-state{font-size:12px;font-weight:700}
.sc-live{color:var(--red);font-weight:800}
.sc-soon{color:var(--gold);font-weight:800;white-space:nowrap}
.co-card{border:1px solid rgba(255,209,102,.35);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,209,102,.04)}
.co-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.co-leg{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.co-leg small{display:block;color:var(--muted);font-size:11px}
.co-worth{margin-top:8px;font-size:13px}
.co-worth b{color:var(--gold)}
.co-offer{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.co-offer label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.co-offer input{width:120px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:#12181c;font-size:16px;font-weight:700}
.badge.soon{background:rgba(255,209,102,.14);color:var(--gold)}
.kick-cd{margin-top:6px;font-size:13px;color:var(--gold);font-weight:600}
.kick-cd b{font-weight:900}
.sc-team{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.sc-team.away{justify-content:flex-end;text-align:right}
.sc-team img{width:20px;height:20px;flex-shrink:0}
.sc-team.win{color:var(--accent)}
.sc-score{text-align:center;font-weight:900;font-size:16px;letter-spacing:.04em}
.sc-bet{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.sc-bell{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;
  filter:grayscale(1);opacity:.55;transition:.12s}
.sc-bell:hover{opacity:1;filter:none;border-color:var(--gold)}
.sc-bell.on{opacity:1;filter:none;border-color:var(--gold);background:rgba(255,209,102,.12);box-shadow:0 0 12px rgba(255,209,102,.25)}
.sc-xi{font-size:10.5px;font-weight:800;color:var(--accent);background:rgba(20,227,161,.12);padding:2px 6px;border-radius:6px;white-space:nowrap}
.dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;animation:livepulse 2s infinite}
.rp-evs{display:flex;flex-direction:column;gap:4px}
.rp-ev{display:flex;gap:8px;font-size:13px;padding:4px 0}
.rp-ev.away{flex-direction:row-reverse;text-align:right}
.rp-ev .min{color:var(--muted);font-weight:700;min-width:36px}
@media (max-width:560px){.sc-row{grid-template-columns:44px 1fr 48px 1fr 34px;gap:6px;font-size:13px}.sc-team img{display:none}
  .sc-bell{width:28px;height:28px}}
.kelly{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.kelly b{color:var(--gold)}
.kfrac{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 4px;font-size:12px;margin-left:4px}
.ip-score{font-size:44px;font-weight:900;letter-spacing:.04em;text-align:center;line-height:1}
.ip-clock{color:#ff6b6b;font-weight:800;text-align:center;margin-top:4px}
.ip-stat{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}
.ip-stat .bar{display:flex;height:7px;border-radius:5px;overflow:hidden;background:#22303a}
.ip-stat .bar i{display:block;height:100%}
.ip-stat .nm{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px;margin-bottom:-3px}
.ip-row{display:grid;grid-template-columns:1fr 64px 60px 60px 64px 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ip-row.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ip-row.val{background:rgba(20,227,161,.06)}
@media (max-width:640px){.ip-row{grid-template-columns:1fr 56px 56px 70px}.ip-row .hide-sm{display:none}}
.tn{font-size:13px;padding:4px 0;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px}
.tn .tag{font-size:10px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:5px;margin-right:6px}
.tn.out .tag{background:rgba(255,107,107,.15);color:#ff8a8a}
.tn.doubt .tag{background:rgba(255,196,0,.14);color:var(--gold)}
.learn{margin-top:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.learn b{color:var(--text)}
.star{cursor:pointer;color:#3a4a55;margin-left:6px;font-size:13px}
.star:hover{color:var(--gold)}
.star.on{color:var(--gold)}
.apart{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.apart.gone{opacity:.55}
.apart .teams{font-weight:700}
.abtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.abtns .ghost{width:auto;flex:1 1 140px}
.monhead{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.monhead{grid-template-columns:1fr}.apart{grid-template-columns:1fr}.apart>div:last-child{text-align:left!important}}
.mv{font-size:10px;margin-left:3px}
.mv.up{color:var(--accent)}
.mv.down{color:#ff6b6b}
.slip{padding:16px}
.target{display:flex;align-items:baseline;justify-content:space-between}
.target .big{font-size:34px;font-weight:900;color:var(--gold);letter-spacing:.02em}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin:10px 0}
.seg button{border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:#27353f;color:var(--text)}
.hint{font-size:12px;color:var(--muted);margin:-4px 2px 10px}
.opts{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.opts select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.build{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;cursor:pointer;font-weight:900;letter-spacing:.06em;
  color:#03261b;background:linear-gradient(90deg,#10c98e,#3ff5bd,#10c98e);background-size:200% 100%;animation:shine 3s linear infinite;
  box-shadow:0 8px 24px rgba(20,227,161,.3)}
.build:disabled{opacity:.5;cursor:default}
@keyframes shine{to{background-position:-200% 0}}
.ticket{margin-top:14px;border-radius:14px;border:1px solid var(--accent);background:linear-gradient(180deg,#1a2a2c,#172024);overflow:hidden}
.ticket .th{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.ticket .th b{color:var(--accent);font-style:italic;letter-spacing:.04em;font-size:15px}
.ticket .th .odds{font-size:20px;font-weight:900}
.legs{position:relative;padding:0 14px 6px 14px}
.leg{position:relative;padding:8px 0 10px 28px;animation:in .35s both}
.leg::before{content:"";position:absolute;left:8px;top:22px;bottom:-8px;width:2px;background:#2d4a44}
.leg:last-child::before{display:none}
.leg .ck{position:absolute;left:0;top:9px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#03261b;
  display:grid;place-items:center;font-size:11px;font-weight:900}
.leg .l1{display:flex;justify-content:space-between;gap:8px}

<body>
<!-- Background: slow floodlight glows + a big faint hawk, behind everything -->
<div class="bgfx" aria-hidden="true">

    <div class="empty"><img class="bigmark" src="hawk-logo.svg" alt=""><h2>Pick a fixture</h2>
      HAWK simulates the match thousands of times — goals, shots, shots on target, corners and cards, player by player —
      then builds you a bet builder at the odds you want.</div>

<button class="jump" id="jump" onclick="document.getElementById('slip').scrollIntoView({ behavior: 'smooth' })">🎟 Slip</button>
<div id="toast"></div>

<script src="engine.js"></script>
<script>
function loadPref(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } }
function savePref(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private window */ } }
const S = { league: null, fixtures: [], match: null, legs: {}, slip: [], locked: new Set(), banned: new Set(),
            target: 3.25, style: "Balanced", focus: "Mix", maxLegs: 10, favourite: true, result: null, tab: "players", q: "",
            chk: { price: "", boost: "", stake: "5" }, extras: false, cat: "All",
            live: { on: loadPref("hawk.liveOdds", true), timer: null, checked: null, busy: false },
            acca: loadPref("hawk.acca", []), accaChk: { price: "", boost: "", stake: "5" }, alerts: loadPref("hawk.priceAlerts", []),
            inplay: null, kellyFrac: loadPref("hawk.kellyFrac", 0.25),
            scores: { day: null, league: "All", data: null, timer: null, error: null },
            monster: { leagues: null, hours: 48, legs: 10, perMatch: 1, style: "Banker", data: null, timer: null, skip: new Set() },
            view: "match", allLeagues: [], scan: { leagues: null, hours: 24, sort: "legs", data: null, timer: null },
            value: { leagues: null, hours: 48, book: "All", market: "All", minP: 0.25, minEdge: 0.02, bestOnly: true, data: null, timer: null },
            watch: [] };
const FOCUS_LABELS = { Mix: "Mix", Players: "Player props", Match: "Match stats" };
// Display names for the builder styles (the keys are what the server expects).
const STYLES = {
  Banker: { label: "Safe legs", hint: "Lots of very likely legs (72–95% each) — takes more legs to reach your odds." },
  Balanced: { label: "Mixed", hint: "Legs between 55% and 90% — a bit of both." },
  Punchy: { label: "Bold legs", hint: "Fewer, bolder legs (35–78% each), like to score or 2+ on target. Fewer legs usually means a smaller bookmaker margin." },
};
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (p, d = 0) => p == null ? "–" : (100 * p).toFixed(d) + "%";
const odds = (o) => o == null ? "–" : o.toFixed(2);
const capitalise = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const sliderToOdds = (v) => 1.5 * Math.pow(25 / 1.5, v / 100);
const oddsToSlider = (o) => 100 * Math.log(o / 1.5) / Math.log(25 / 1.5);

// True when the slip sits below the match instead of beside it (phones, small windows).
const narrow = () => window.matchMedia("(max-width: 1250px)").matches;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
// On GitHub Pages there's no server: the same /api calls the local app makes
// are answered by the HAWK engine running in this page (engine.js).
async function api(path, body) {
  const [p, query] = path.split("?");
  const q = Object.fromEntries(new URLSearchParams(query || ""));
  switch (p) {
    case "/api/leagues": return { leagues: HAWK.LEAGUES };
    case "/api/fixtures": return { fixtures: await HAWK.fixtures(q.league) };
    case "/api/match": return HAWK.match(q.league, q.id, q.refresh === "1");
    case "/api/lineups": return HAWK.lineups(q.id);
    case "/api/prices": return HAWK.livePrices(q.id);
    case "/api/live": return HAWK.liveMatch(q.id);
    case "/api/scores": return HAWK.scores(q.day);
    case "/api/report": return HAWK.matchReport(q.id);
    case "/api/ticketlive": return HAWK.ticketLive(q.id, body.legs);
    case "/api/legprices": return HAWK.legPrices(body.items);
    case "/api/monster": return body ? HAWK.startMonster(body) : HAWK.monsterStatus();
    case "/api/monster/stop": return HAWK.stopMonster();
    case "/api/build": return HAWK.build(body);
    case "/api/evaluate": return HAWK.evaluate(body);
    case "/api/scan": return body ? HAWK.startScan(body) : HAWK.scanStatus();
    case "/api/scan/stop": return HAWK.stopScan();
    case "/api/value": return body ? HAWK.startValue(body) : HAWK.valueStatus();
    case "/api/value/stop": return HAWK.stopValue();
  }
  throw new Error("unknown request " + p);
}
function fmtKick(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + " · " +
         d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

/* ---------- leagues & fixtures ---------- */
async function init() {
  const { leagues } = await api("/api/leagues");
  S.allLeagues = leagues;
  S.scan.leagues = new Set(leagues);
  S.value.leagues = new Set(leagues);
  S.monster.leagues = new Set(leagues);
  applyLearning();
  $("#valueBtn").onclick = showValue;
  $("#accaBtn").onclick = showAcca;
  $("#scoresBtn").onclick = showScores;
  renderAccaBtn();
  setInterval(trackPrices, ALERT_MS);
  setTimeout(trackPrices, 5000);
  const logo = (l) => HAWK.COMPETITIONS && HAWK.COMPETITIONS[l]
    ? `<img src="https://imagecache.365scores.com/image/upload/f_png,w_36,h_36,c_limit,q_auto:eco,dpr_2,d_Countries:round:15.png/v1/Competitions/${HAWK.COMPETITIONS[l]}" alt="" onerror="this.remove()">` : "";
  $("#leagues").innerHTML = leagues.map(l => `<button class="pill" data-l="${esc(l)}">${logo(l)}${esc(l)}</button>`).join("");
  $("#navBuilder").onclick = showBuilder;
  watchView();
  $("#leagues").onclick = (e) => { const b = e.target.closest(".pill"); if (b) selectLeague(b.dataset.l); };
  $("#scanBtn").onclick = showScan;
  $("#watchBtn").onclick = () => { const p = $("#watchPop"); p.hidden = !p.hidden; };
  S.watch = loadWatch();
  renderWatch();
  HAWK.meta().then(meta => {
    if (!meta || !meta.generated) return;
    const mins = Math.round((Date.now() - new Date(meta.generated).getTime()) / 60000);
    S.dataAge = mins < 90 ? `${mins} min ago` : `${Math.round(mins / 60)} h ago`;
    renderSlip();
  });
  renderSlip();
  await selectLeague(leagues[0]);
  checkLineups();
  setInterval(checkLineups, 120000);
  openFromUrl();
}
// "Open in HAWK" from a Vault ticket: builder/?match=ID&league=L&legs=a,b
// Upcoming → the match with those legs on the slip; in play → live view;
// finished → match report.
async function openFromUrl() {
  const q = new URLSearchParams(location.search), id = q.get("match");
  if (!id) return;
  history.replaceState(null, "", location.pathname);   // so a refresh doesn't reopen it
  const league = q.get("league"), legs = (q.get("legs") || "").split(",").filter(Boolean);
  if (league && S.allLeagues.includes(league) && S.league !== league) await selectLeague(league);
  const fx = S.fixtures.find(f => String(f.id) === String(id));
  if (!fx) return showReport(id);
  if (fx.started) return showInPlay(id);
  await openMatch(id);
  const keep = legs.filter(l => S.legs[l]);
  if (keep.length) {
    S.slip = keep; S.locked = new Set(keep);
    await evaluateSlip();
    toast(`Your Vault ticket is back on the slip (${keep.length} leg${keep.length === 1 ? "" : "s"}).`);
  }
}
async function selectLeague(league) {
  S.league = league;
  document.querySelectorAll(".pill[data-l]").forEach(p => p.classList.toggle("on", p.dataset.l === league));
  $("#fixtures").innerHTML = `<div class="skel"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>`;
  try {
    const { fixtures } = await api("/api/fixtures?league=" + encodeURIComponent(league));
    S.fixtures = fixtures;
    renderFixtures();
  } catch (err) { $("#fixtures").innerHTML = `<div class="empty">Couldn't load fixtures.<br>${esc(err.message)}</div>`; }
}
function renderFixtures() {
  const openId = S.view === "match" && S.match ? String(S.match.id) : null;
  $("#fixtures").innerHTML = S.fixtures.length ? S.fixtures.map(f => `
    <div class="fx ${String(f.id) === openId ? "on" : ""}" data-id="${f.id}">
      <div class="team"><img src="${esc(f.homeCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(f.home)}${isWatched(f.id) ? '<span class="bellmark" title="Lineup alert on">🔔</span>' : ""}</div>
      <div class="team"><img src="${esc(f.awayCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(f.away)}</div>
      <div class="when">${f.started ? '<span class="badge live" title="In play — opens the live view">🔴 LIVE</span>'
        : soon(f.kickoff) ? `<span class="badge soon" title="Kicks off ${esc(fmtKick(f.kickoff))}">in ${kickIn(f.kickoff)}</span>` : esc(fmtKick(f.kickoff)).replace(" · ", "<br>")}</div>
    </div>`).join("") : `<div class="empty">No upcoming fixtures.</div>`;
  $("#fixtures").onclick = (e) => { const f = e.target.closest(".fx"); if (f) openMatch(f.dataset.id); };
}

/* ---------- match ---------- */
const LOADING = ["Reading lineups…", "Checking 12 bookmakers + Polymarket…", "Rating both teams…", "Simulating 12,000 matches…", "Sharing out shots player by player…"];
// Opens a match from anywhere (fixture list, scan results, lineup alerts),
// switching league first if needed.
async function goToMatch(league, id) {
  if (S.league !== league) await selectLeague(league);
  await openMatch(id);
}
async function openMatch(id, refresh = false, prematch = false) {
  // A match in play opens the live view (the pre-match builder is one click away there).
  const fx = S.fixtures.find(f => String(f.id) === String(id));
  if (!refresh && !prematch && fx && fx.started) return showInPlay(id);
  S.view = "match";
  document.querySelectorAll(".fx").forEach(f => f.classList.toggle("on", f.dataset.id === String(id)));
  let i = 0;
  $("#match").innerHTML = `<div class="skel"><div class="loading-msg" id="lm">${LOADING[0]}</div>${'<div class="ln"></div>'.repeat(8)}</div>`;
  const timer = setInterval(() => { const el = $("#lm"); if (el) el.textContent = LOADING[++i % LOADING.length]; }, 1100);
  try {
    const m = await api(`/api/match?league=${encodeURIComponent(S.league)}&id=${id}${refresh ? "&refresh=1" : ""}`);
    S.match = m; S.legs = Object.fromEntries(m.legs.map(l => [l.id, l]));
    if (!refresh) { S.slip = []; S.locked = new Set(); S.banned = new Set(); S.result = null; S.cat = "All"; }
    S.slip = S.slip.filter(id => S.legs[id]);
    S.live.checked = new Date();
    renderMatch(); renderSlip();
    if (refresh && S.slip.length) evaluateSlip();   // fair odds may have moved with the new prices
    startLive();
    if (!refresh && narrow()) $("#match").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    $("#match").innerHTML = `<div class="empty"><h2>Couldn't analyse this match</h2>${esc(err.message)}</div>`;
  } finally { clearInterval(timer); }
}

function renderMatch() {
  const m = S.match, p = m.probs, e = m.expected;
  const chip = (side) => { const lu = m.lineups[side]; const ok = lu.status === "Confirmed";
    return `<span class="badge ${ok ? "ok" : "warn"}">${ok ? "Lineup confirmed" : "Lineup predicted"}${lu.formation ? " · " + esc(lu.formation) : ""}</span>`; };
  const ord = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const tbl = (side) => m.table[side] ? `${ord(m.table[side].position)} · ${Math.round(m.table[side].points)} pts` : "";
  const maxCell = Math.max(...m.grid.flat());
  const cell = (v) => `<div class="c" style="background:rgba(20,227,161,${(0.08 + 0.75 * v / maxCell).toFixed(3)})">${(100 * v).toFixed(1)}%</div>`;
  const srcs = [];
  if (p.market) srcs.push(`Bookmakers (${p.market.sources}): ${pct(p.market.home)} · ${pct(p.market.draw)} · ${pct(p.market.away)}`);
  if (p.polymarket) srcs.push(`Polymarket: ${pct(p.polymarket.home)} · ${pct(p.polymarket.draw)} · ${pct(p.polymarket.away)}`);
  $("#match").innerHTML = `
    <div class="hero">
      <div class="vs">
        <div class="side"><img src="${esc(m.homeCrest)}" alt="" onerror="this.style.visibility='hidden'"><div class="nm">${esc(m.home)}</div>
          <div class="muted">${esc(tbl("home"))}${m.form.home ? " · " + esc(m.form.home) : ""}</div>${chip("home")}</div>
        <div class="mid"><div class="x">VS</div><div class="ko">${esc(fmtKick(m.kickoff))}</div><div class="kick-cd" id="kickCountdown"></div>
          ${m.started ? '<div class="chips"><span class="badge live">STARTED — pre-match model</span></div>' : ""}
          ${m.referee && m.referee.name ? `<div class="ko" style="margin-top:6px">Ref: ${esc(m.referee.name)}${m.referee.avg ? ` · ${m.referee.avg.toFixed(2)} cards/g` : ""}</div>` : ""}
          <button class="ghost" style="width:auto;padding:5px 10px;margin-top:8px" onclick="openMatch('${m.id}', true)" title="Re-run everything: odds, lineups and the simulation">↻ Refresh</button>
          <div class="ko live-odds" id="liveOdds"></div>
          ${!m.started && !(m.lineups.home.status === "Confirmed" && m.lineups.away.status === "Confirmed") ?
            `<br><button class="ghost" style="width:auto;padding:5px 10px;margin-top:6px;${isWatched(m.id) ? "color:var(--gold);border-color:var(--gold)" : ""}"
              onclick="toggleWatch()">${isWatched(m.id) ? "🔕 Stop lineup alert" : "🔔 Alert me when lineups are confirmed"}</button>` : ""}</div>
        <div class="side"><img src="${esc(m.awayCrest)}" alt="" onerror="this.style.visibility='hidden'"><div class="nm">${esc(m.away)}</div>
          <div class="muted">${esc(tbl("away"))}${m.form.away ? " · " + esc(m.form.away) : ""}</div>${chip("away")}</div>
      </div>
    </div>
    <div class="section">
      <h3>Win probability</h3>
      <div class="bar3"><div class="h" style="flex:${p.home}">${pct(p.home)}</div><div class="d" style="flex:${p.draw}">${pct(p.draw)}</div><div class="a" style="flex:${p.away}">${pct(p.away)}</div></div>
      <div class="srcs">${srcs.map(esc).map(s => `<span>${s}</span>`).join("")}</div>
    </div>
    ${teamNews(m)}
    <div class="section"><div class="tiles">
      <div class="tile"><div class="k">Expected goals</div><div class="v">${e.goals[0].toFixed(2)} – ${e.goals[1].toFixed(2)}</div></div>
      <div class="tile"><div class="k">Shots on target</div><div class="v">${e.sot[0].toFixed(1)} – ${e.sot[1].toFixed(1)}</div></div>
      <div class="tile"><div class="k">Corners</div><div class="v">${e.corners.toFixed(1)}</div></div>
      <div class="tile"><div class="k">Cards</div><div class="v">${(e.cards[0] + e.cards[1]).toFixed(1)}</div></div>
    </div></div>
    <div class="section two">
      <div><h3>Correct score</h3>
        <div class="cs"><div></div>${[0,1,2,3,"4+"].map(j => `<div class="hd">${j}</div>`).join("")}
          ${m.grid.map((row, i) => `<div class="hd">${i === 4 ? "4+" : i}</div>${row.map(cell).join("")}`).join("")}</div>
        <div class="note">Rows: ${esc(m.home)} goals · columns: ${esc(m.away)} goals</div></div>
      <div><h3>Market value check</h3>${valueCard(m.value)}</div>
    </div>
    <div class="section">
      <div class="tabs"><div class="tab ${S.tab === "players" ? "on" : ""}" data-t="players">Players</div>
        <div class="tab ${S.tab === "legs" ? "on" : ""}" data-t="legs">All legs (${m.legs.length})</div></div>
      <div id="tabbody"></div>
    </div>`;
  $("#match").querySelector(".tabs").onclick = (ev) => { const t = ev.target.closest(".tab"); if (t) { S.tab = t.dataset.t; renderMatch(); } };
  renderTab();
  renderLive();
  renderCountdown();
}

/* ---------- kick-off countdown (last hour only) ---------- */
// Before that the kick-off time says enough; in the last hour it matters,
// because that's when lineups come out.
const minsToKick = (iso) => (iso ? (new Date(iso).getTime() - Date.now()) / 60000 : Infinity);
const soon = (iso) => { const m = minsToKick(iso); return m > 0 && m <= 60; };
const kickIn = (iso) => { const m = minsToKick(iso); return m > 59.5 ? "1 hr" : `${Math.max(1, Math.ceil(m))} min`; };
function renderCountdown() {
  const el = $("#kickCountdown");
  if (el && S.match) {
    const m = minsToKick(S.match.kickoff), lu = S.match.lineups || {};
    const confirmed = (lu.home || {}).status === "Confirmed" && (lu.away || {}).status === "Confirmed";
    el.innerHTML = soon(S.match.kickoff) ? `⏱ Kicks off in <b>${kickIn(S.match.kickoff)}</b><span class="muted"> · ${confirmed ? "lineups are in ✓" : "lineups due any minute"}</span>`
      : m <= 0 && m > -5 ? "⏱ Kicking off now" : "";
  }
}
setInterval(() => {
  if (S.view === "match") renderCountdown();
  // keep the "in 25 min" labels in the fixture list and Scores ticking
  if (S.fixtures.some(f => { const m = minsToKick(f.kickoff); return m > -2 && m <= 61; })) renderFixtures();
  if (S.view === "scores" && (S.scores.data || []).some(g => g.status === 2 && minsToKick(g.kickoff) <= 61)) renderScoreList();
}, 30 * 1000);

/* ---------- live Bet365 prices ---------- */
// While a match is open, HAWK re-reads Bet365's prices every 2 minutes
// (odds only; the fair odds update when you press Refresh). Moves show as
// ▲/▼ on the legs, and a leg in your slip that moves gets a message.
const LIVE_MS = 2 * 60 * 1000;
function startLive() {
  clearInterval(S.live.timer);
  S.live.timer = S.live.on && S.match && !S.match.started ? setInterval(checkLive, LIVE_MS) : null;
  renderLive();
}
function renderLive() {
  const el = $("#liveOdds"); if (!el || !S.match) return;
  if (S.match.started) { el.innerHTML = ""; return; }
  const at = S.live.checked ? S.live.checked.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "–";
  el.innerHTML = `<span class="dot ${S.live.on ? "on" : ""}"></span>${esc(S.match.priceBook || "Bet365")} odds checked ${at}
    <button class="linkbtn" onclick="toggleLive()">${S.live.on ? "auto: on" : "auto: off"}</button>`;
}
function toggleLive() { S.live.on = !S.live.on; savePref("hawk.liveOdds", S.live.on); startLive(); if (S.live.on) checkLive(); }
async function checkLive() {
  const m = S.match;
  if (!m || S.live.busy || document.hidden || S.view !== "match") return;
  S.live.busy = true;
  try {
    const res = await api(`/api/prices?id=${m.id}`);
    if (!res || S.match !== m) return;
    const moved = [];
    for (const [id, price] of Object.entries(res.prices)) {
      const l = S.legs[id]; if (!l) continue;
      const old = l.bookPrice;
      if (old && price !== old) { l.prevPrice = old; if (S.slip.includes(id)) moved.push(l); }
      l.bookPrice = price;
      // Value alert when a slip leg's price moves above fair (starred legs are checked by trackPrices).
      if (old && S.slip.includes(id) && price >= l.fair * VALUE_EDGE && old < l.fair * VALUE_EDGE)
        valueAlert(`${l.label} (in your slip)`, price, l.fair);
    }
    S.live.checked = new Date(res.checked);
    renderLive(); refreshTab();
    // Don't redraw the slip under someone typing a price into it.
    if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest("#slip"))) renderSlip();
    if (moved.length) toast(`${res.book} moved: ${moved.slice(0, 2).map(l => `${l.label} ${odds(l.prevPrice)} → ${odds(l.bookPrice)}`).join(" · ")}${moved.length > 2 ? ` +${moved.length - 2} more` : ""}`);
  } catch (err) { console.warn("[hawk] live odds:", err.message); }
  finally { S.live.busy = false; }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.live.on && S.live.checked && Date.now() - S.live.checked.getTime() > LIVE_MS) checkLive();
});

// Injured/suspended ("out") and doubtful players, from 365Scores. HAWK leaves
// the out players out of its predicted lineups and gives doubtful ones no legs.
function teamNews(m) {
  const miss = m.missing || {};
  if (!(miss.home || []).length && !(miss.away || []).length) return "";
  const col = (side) => {
    const list = miss[side] || [];
    const row = (p) => `<div class="tn ${p.status === "Missing" ? "out" : "doubt"}" title="${esc([p.reason, p.back && "back: " + p.back].filter(Boolean).join(" · "))}">
      <span class="tag">${p.status === "Missing" ? "OUT" : "DOUBT"}</span>${esc(p.name)}${p.pos ? `<span class="pos">${esc(p.pos)}</span>` : ""}
      ${p.reason ? `<span class="muted"> · ${esc(p.reason)}${p.back ? `, ${esc(p.back)}` : ""}</span>` : ""}</div>`;
    return `<div><div class="team-head" style="margin-bottom:6px">${esc(side === "home" ? m.home : m.away)}</div>
      ${list.length ? list.map(row).join("") : '<div class="note" style="margin:0">No absences listed.</div>'}</div>`;
  };
  return `<div class="section"><h3>🚑 Team news</h3><div class="two">${col("home")}${col("away")}</div>
    <div class="note">Out players are left out of HAWK's predicted lineups; doubtful ones get no player legs until lineups are confirmed.</div></div>`;
}

function valueCard(v) {
  if (!v) return "";
  if (!v.legs.length) return `<div class="note">No leg at ${esc(v.book)} beats the bookmaker consensus by 2%+ right now. Normal — genuine value is rare.</div>`;
  return v.legs.map(l => `<div class="lrow" style="grid-template-columns:1fr auto auto"><div>${esc(l.label)}</div>
      <div class="muted">@ ${l.price.toFixed(2)}</div><div style="color:var(--accent);font-weight:700">+${(100 * l.edge).toFixed(1)}%</div></div>`).join("") +
    `<div class="note">Single legs where ${esc(v.book)}'s price beats the true probability (bookmaker consensus + HAWK model).</div>`;
}

// Redraw the Players / All legs tab (only when the match view is on screen).
function refreshTab() {
  if (S.view !== "match" || !$("#tabbody")) return;
  if (S.tab === "players") renderTab(); else renderLegList();
}

function legsFor(side, name) { return Object.values(S.legs).filter(l => l.kind === "player" && l.side === side && l.player === name); }

function renderTab() {
  const body = $("#tabbody"), m = S.match;
  if (S.tab === "players") {
    const col = (side) => {
      const order = { F: 0, M: 1, D: 2, G: 3 };
      const list = m.players[side].filter(p => p.status === "Starting").sort((a, b) => (order[a.pos] ?? 4) - (order[b.pos] ?? 4));
      return `<div><div class="team-head"><img src="${esc(side === "home" ? m.homeCrest : m.awayCrest)}" alt="">${esc(side === "home" ? m.home : m.away)}</div>
        ${list.map(p => playerCard(side, p)).join("") || '<div class="note">No lineup or player data yet.</div>'}</div>`;
    };
    body.innerHTML = `<div class="two">${col("home")}${col("away")}</div>`;
  } else {
    body.innerHTML = `<input class="search" id="q" placeholder="Search legs — player, corners, goals…" value="${esc(S.q)}">
      <div class="qchips" id="lgcats" style="margin:0 0 12px"></div><div id="lglist"></div>`;
    $("#q").oninput = (e) => { S.q = e.target.value; renderLegList(); };
    $("#lgcats").onclick = (e) => { const c = e.target.closest("[data-cat]"); if (c) { S.cat = c.dataset.cat; renderLegList(); } };
    renderLegList();
  }
  body.onclick = (e) => {
    const st = e.target.closest("[data-star]"); if (st) return toggleStar(st.dataset.star);
    const b = e.target.closest("[data-add]"); if (b) return addLeg(b.dataset.add);
    const pl = e.target.closest("[data-pl]"); if (pl) openPlayer(pl.dataset.pl, pl.dataset.name);
  };
}

function playerCard(side, p) {
  const legs = legsFor(side, p.name);
  const pick = (suffix) => legs.find(l => l.id.endsWith(suffix));
  const sot = pick(":sot1");
  const spark = sot && sot.recent ? `<div class="spark" title="Shots on target, last ${sot.recent.length} ${sot.basis === "starts" ? "starts" : "games"} (newest first)">${
      sot.recent.map(v => `<i class="${v >= 1 ? "hit" : ""}" style="height:${4 + Math.min(v, 5) * 3}px"></i>`).join("")}</div>` : "";
  const keeper = p.pos === "G";
  const chips = keeper ? [[":saves2", "2+ saves"], [":saves3", "3+ saves"], [":saves4", "4+ saves"]]
    : [[":sot1", "1+ SoT"], [":sot2", "2+ SoT"], [":shots2", "2+ shots"], [":score", "Score"], [":assist", "Assist"], [":booked", "Booked"]];
  const quick = chips
    .map(([s, lab]) => { const l = pick(s); return l ? `<span class="qc ${S.slip.includes(l.id) ? "in" : ""}" data-add="${l.id}" title="Fair odds ${odds(l.fair)}">${lab} ${pct(l.p)}</span>` : ""; }).join("");
  const open = `data-pl="${side}" data-name="${esc(p.name)}" title="Open ${esc(p.name)}'s last 10 games and every leg"`;
  const rates = keeper ? (p.sv90 != null ? `${p.sv90.toFixed(1)} saves per 90 · ${Math.round(p.minutes)} min` : "saves come from the shots HAWK expects against")
    : p.has_data ? `${p.sh90.toFixed(1)} shots · ${p.sot90.toFixed(1)} SoT · ${p.g90.toFixed(2)} xG per 90 · ${Math.round(p.minutes)} min` : "no recent data — position average";
  const more = legs.length > chips.length ? `<span class="qc" ${open}>+${legs.length - chips.length} more</span>` : "";
  return `<div class="pl"><div class="ph" ${open}>${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.remove()">` : ""}</div>
    <div><div class="top1"><div><span class="nm" ${open}>${esc(p.name)}</span><span class="pos">${esc(p.pos)}</span>${
      p.doubtful ? '<span class="badge warn" style="margin-left:6px" title="Listed as doubtful — no legs until lineups are confirmed">doubtful</span>' : ""}</div>${spark}</div>
      <div class="rates">${rates}</div>
      <div class="qchips">${quick}${more}</div></div></div>`;
}

// Leg categories for the "All legs" tab, each market listed in display order.
const CATEGORIES = {
  "Result": ["Full Time Result", "Double Chance", "Win to Nil", "Winning Margin", "Handicap", "Correct Score", "First Team to Score"],
  "Goals": ["Total Goals", "Both Teams to Score", "Team Goals", "Clean Sheet"],
  "Halves": ["1st Half Result", "1st Half Goals", "2nd Half Result", "2nd Half Goals"],
  "Corners, cards & SoT": ["Corners", "Team Corners", "Most Corners", "Total Cards", "Team Cards", "Match Shots on Target"],
  "Players": ["Player Shots", "Player Shots on Target", "To Score at Any Time", "Player to Assist", "Score or Assist", "Player to be Booked", "Goalkeeper Saves"],
  "Fouls & tackles": ["Player Fouls Committed", "Player Fouls Won", "Player Tackles", "Player Offsides"],
};
const MARKET_ORDER = Object.values(CATEGORIES).flat();
const categoryOf = (market) => Object.keys(CATEGORIES).find(c => CATEGORIES[c].includes(market)) || "Result";

// ▲/▼ when Bet365 has moved this leg's price since the match was opened.
const moveMark = (l) => l.prevPrice && l.bookPrice && l.prevPrice !== l.bookPrice
  ? `<span class="mv ${l.bookPrice > l.prevPrice ? "up" : "down"}" title="Bet365 was ${odds(l.prevPrice)}">${l.bookPrice > l.prevPrice ? "▲" : "▼"}</span>` : "";

function renderLegList() {
  const q = S.q.trim().toLowerCase();
  const all = Object.values(S.legs);
  const counts = {};
  for (const l of all) counts[categoryOf(l.market)] = (counts[categoryOf(l.market)] || 0) + 1;
  const groups = {};
  all.filter(l => (S.cat === "All" || categoryOf(l.market) === S.cat) && (!q || (l.label + " " + l.market).toLowerCase().includes(q)))
    .sort((a, b) => b.p - a.p).forEach(l => (groups[l.market] ||= []).push(l));
  const rank = (g) => { const i = MARKET_ORDER.indexOf(g); return i < 0 ? 999 : i; };
  const book = (S.match && S.match.priceBook) || "Bet365";
  const head = `<div class="lrow lhead"><div></div><div style="text-align:right">Chance</div><div style="text-align:right">Fair</div>
    <div style="text-align:right">${esc(book)}</div><div></div></div>`;
  const cats = ["All", ...Object.keys(CATEGORIES).filter(c => counts[c])];
  $("#lgcats").innerHTML = cats.map(c => `<span class="qc ${S.cat === c ? "in" : ""}" data-cat="${esc(c)}">${esc(c)} ${c === "All" ? all.length : counts[c]}</span>`).join("");
  $("#lglist").innerHTML = Object.entries(groups).sort((a, b) => rank(a[0]) - rank(b[0])).map(([g, ls]) => `<div class="lg"><h4>${esc(g)}</h4>${head}${ls.slice(0, 40).map(l => `
    <div class="lrow"><div>${esc(l.label)}${l.low_data ? ' <span class="badge warn">low data</span>' : ""}<div class="pb"><span style="width:${(100 * l.p).toFixed(1)}%"></span></div></div>
      <div style="text-align:right;font-weight:700">${pct(l.p, 1)}</div><div class="muted" style="text-align:right">${odds(l.fair)}</div>
      <div style="text-align:right;font-weight:700;color:${l.bookPrice ? (l.bookPrice > l.fair ? "var(--accent)" : "var(--text)") : "var(--muted)"}">${l.bookPrice ? odds(l.bookPrice) : "–"}${moveMark(l)}${
        l.bookPrice ? `<span class="star ${isStarred(S.match.id, l.id) ? "on" : ""}" data-star="${l.id}" title="${isStarred(S.match.id, l.id) ? "Price alert on — click to stop" : `Alert me when Bet365 pays ${odds(l.fair * VALUE_EDGE)}+`}">★</span>` : ""}</div>
      <button class="add" data-add="${l.id}" title="Add to slip">${S.slip.includes(l.id) ? "✓" : "+"}</button></div>`).join("")}
      ${ls.length > 40 ? `<div class="note" style="margin:4px 0 0">+ ${ls.length - 40} more — search a player or team to find them.</div>` : ""}</div>`).join("")
    || `<div class="note">No legs match.</div>`;
}

/* ---------- slip ---------- */
// "fair 1.23 · Bet365 1.22": the bookmaker's own single price for this leg,
// green when it beats HAWK's fair odds. Player props have no feed price.
function priceLine(l) {
  const book = (S.match && S.match.priceBook) || "Bet365";
  if (!l.bookPrice) return `<div class="bp">fair <b>${odds(l.fair)}</b></div>`;
  const val = l.bookPrice > l.fair;
  return `<div class="bp ${val ? "val" : ""}" title="${val ? book + "'s price beats HAWK's fair odds" : book + " pays less than HAWK's fair odds"}">fair ${odds(l.fair)} · ${esc(book)} <b>${odds(l.bookPrice)}</b>${moveMark(l)}</div>`;
}

function renderSlip() {

// The price the builder really pays: a winnings boost multiplies the profit
// part only (a 25% boost on 3.60 pays like 1 + 2.60 × 1.25 = 4.25).
function checkerInputs() {
  const num = (s) => parseFloat(String(s || "").replace(",", "."));
  const price = num(S.chk.price), boost = Math.max(0, num(S.chk.boost) || 0), stake = num(S.chk.stake) || 0;
  return { price, boost, stake, eff: price > 1 ? 1 + (price - 1) * (1 + boost / 100) : NaN };
}

// Logs the builder in the HAWK Vault (the main page of this site). Both pages
// share this browser's storage, so it uses the Vault's own format: one
// "builder" leg with the selections joined by " & ", status PENDING, and the
// stake taken off the bankroll — exactly like "Lock In Bet" in the Vault.
function sendToVault() {
  const m = S.match, r = S.result;
  // Saved at the boosted price, so the Vault's return and profit are right.
  const { price: quoted, boost, stake, eff } = checkerInputs();
  const price = Math.round(eff * 100) / 100;
  if (!m || !S.slip.length || !r) return toast("Build a ticket first.");
  if (!(price > 1)) return toast("Enter the bookmaker's price for this builder first.");
  if (!(stake > 0)) return toast("Enter a valid stake.");
  const legs = S.slip.map(id => S.legs[id]);
  const ev = r.p * price - 1;
  const leg = {
    fixture: `${m.home} vs ${m.away}`,
    selection: legs.map(l => l.label).join(" & "),
    angle: `HAWK: ${pct(r.p, 1)} to land · fair ${odds(r.fair)} · ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}% at ${odds(price)}` +
           (boost ? ` (${odds(quoted)} + ${boost}% boost)` : ""),
    odds: price, type: "builder", league: m.league,
    subSelections: legs.map(l => ({ label: l.label, odds: +(l.bookPrice || l.fair).toFixed(2) })),
    hawk: hawkPart(m, legs, r.p),
  };
  if (saveToVault([leg], stake, price, { source: "hawk", hawkP: r.p }))
    toast(`🦅 Logged in your Vault: €${stake.toFixed(2)} @ ${odds(price)}${boost ? ` (boosted from ${odds(quoted)})` : ""}. It settles itself after the match.`);
}
// What the Vault needs to settle a match's legs by itself after the final
// whistle (and to check HAWK's track record): the 365Scores game, and each
// leg's id, player and HAWK's chance.
function hawkPart(info, legs, p) {
  return { game: String(info.id), league: info.league, home: info.home, away: info.away, kickoff: info.kickoff, p,
           legs: legs.map(l => ({ id: l.id, label: l.label, market: l.market, p: l.p, pRaw: l.pRaw != null ? l.pRaw : l.p,
                                  player: l.player || null, side: l.side || null,
                                  bookPrice: l.bookPrice || null })) };   // Bet365's single price when you bet (closing price check)
}
// Adds a PENDING bet to the Vault and takes the stake off its bankroll.
function saveToVault(legs, stake, price, extra = {}) {
  let bankroll, bets;
  try {
    bankroll = parseFloat(localStorage.getItem("hawk_bankroll")) || 1000.0;
    bets = JSON.parse(localStorage.getItem("hawk_bets")) || [];
  } catch { toast("Couldn't open the Vault's storage in this browser."); return false; }
  if (bankroll < stake) { toast(`Not enough in your Vault bankroll (€${bankroll.toFixed(2)}).`); return false; }
  bets.unshift({
    id: "bet_" + Date.now(),
    date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }),
    legs, stake, odds: price, potentialReturn: stake * price, status: "PENDING", ...extra,
  });
  try {
    localStorage.setItem("hawk_bankroll", (bankroll - stake).toFixed(2));
    localStorage.setItem("hawk_bets", JSON.stringify(bets));
  } catch { toast("Couldn't save to the Vault's storage."); return false; }
  return true;
}

function verdict() {
  const out = $("#verdict"), r = S.result;
  const { price, boost, stake, eff } = checkerInputs();
  // With a boost, the bookmaker's quoted price only has to reach this to be fair.
  const needed = r && r.fair ? 1 + (r.fair - 1) / (1 + boost / 100) : null;
  if (!r || !r.p || !(price > 1)) {
    out.innerHTML = r && r.fair ? `<div class="note">Enter the price your bookmaker offers for this exact builder. Break-even is
      <b>${odds(needed)}</b>${boost ? ` with your ${boost}% boost (${odds(r.fair)} without)` : ""}; aim for ${odds(needed * 1.05)}+.</div>` : "";
    return;
  }
  const ev = r.p * eff - 1;
  const good = ev > 0;
  out.innerHTML = `<div class="verdict ${good ? "good" : "bad"}">${good ? "✅ VALUE" : "❌ OVERPRICED"} ${ev >= 0 ? "+" : ""}${(100 * ev).toFixed(1)}%
    ${boost ? `<small>With your ${boost}% boost, ${odds(price)} pays like <b>${odds(eff)}</b>.</small>` : ""}
    <small>That price implies a ${pct(1 / eff, 1)} chance — HAWK says ${pct(r.p, 1)}.</small>
    <small>${good ? `Expected profit ≈ €${(ev * stake).toFixed(2)} on €${stake.toFixed(2)} (wins ${pct(r.p, 1)} of the time, pays €${(eff * stake).toFixed(2)}).`
                  : `The bookmaker keeps ≈ €${(-ev * stake).toFixed(2)} of every €${stake.toFixed(2)} on average. It needs ${odds(needed)}+${boost ? " with this boost" : ""} to be fair — try swapping legs or another book.`}</small></div>
    ${stakeAdvice(r.p, eff)}`;
  bindStakeAdvice(out, (v) => { if (v) { S.chk.stake = v; $("#stake").value = v; } verdict(); });
}

/* ---------- recommended stake (Kelly) ---------- */
// Kelly: the share of your bankroll that grows it fastest when HAWK's chance
// is right. HAWK uses a fraction of it (¼ by default) and never more than 5%
// of the bankroll, because the chance is an estimate. Bankroll = your Vault's.
const KELLY_CAP = 0.05, KELLY_FRACS = [[0.125, "⅛"], [0.25, "¼"], [0.5, "½"]];
function vaultBankroll() { try { return parseFloat(localStorage.getItem("hawk_bankroll")) || 1000; } catch { return 1000; } }
function kellyStake(p, price) {
  if (!(p > 0 && p < 1 && price > 1)) return null;
  const b = price - 1, full = (b * p - (1 - p)) / b, bankroll = vaultBankroll();
  if (full <= 0) return { stake: 0, pct: 0, bankroll };
  const pct = Math.min(full * S.kellyFrac, KELLY_CAP);
  return { stake: Math.floor(bankroll * pct * 100) / 100, pct, bankroll, capped: full * S.kellyFrac > KELLY_CAP };
}
function stakeAdvice(p, price) {
  const k = kellyStake(p, price);
  if (!k) return "";
  const frac = `<select class="kfrac" title="How much of the full Kelly stake to use">${KELLY_FRACS.map(([f, t]) =>
    `<option value="${f}" ${f === S.kellyFrac ? "selected" : ""}>${t} Kelly</option>`).join("")}</select>`;
  if (!k.stake) return `<div class="kelly">💡 Recommended stake: <b>none</b> — at this price it isn't value. ${frac}</div>`;
  return `<div class="kelly">💡 Recommended stake: <b>€${k.stake.toFixed(2)}</b> = ${(100 * k.pct).toFixed(1)}% of your €${k.bankroll.toFixed(0)} Vault bankroll
    ${k.capped ? "(capped at 5%)" : ""} ${frac} <button class="linkbtn" data-usestake="${k.stake.toFixed(2)}">use it</button></div>`;
}
function bindStakeAdvice(root, useStake) {
  const sel = root.querySelector(".kfrac"), use = root.querySelector("[data-usestake]");
  if (sel) sel.onchange = (e) => { S.kellyFrac = +e.target.value; savePref("hawk.kellyFrac", S.kellyFrac); useStake(null); };
  if (use) use.onclick = () => useStake(use.dataset.usestake);
}

async function build() {
  if (!S.match) return;
  const btn = $("#go"); btn.disabled = true; btn.textContent = "SIMULATING…";
  try {
    const locked = S.slip.filter(id => S.locked.has(id));
    S.result = await api("/api/build", { id: String(S.match.id), target: S.target, style: S.style, focus: S.focus, maxLegs: S.maxLegs,
                                         favourite: S.favourite, extras: S.extras, locked, banned: [...S.banned] });
    S.slip = S.result.legs.map(l => l.id);
    if (!S.slip.length) toast("No legs fit this style — try another style or target.");
    else if (S.result.fair < S.target * 0.97) toast(`Best found: ${odds(S.result.fair)} — raise max legs or change style to go higher.`);
  } catch (err) { toast(err.message); }
  renderSlip(); refreshTab();
  if (narrow() && S.slip.length) $("#slip").scrollIntoView({ behavior: "smooth" });
}

async function evaluateSlip() {
  try { S.result = S.slip.length ? await api("/api/evaluate", { id: String(S.match.id), legs: S.slip }) : null; }
  catch (err) { toast(err.message); }
  renderSlip(); refreshTab();
}
function addLeg(id) {
  const leg = S.legs[id]; if (!leg) return;
  if (S.slip.includes(id)) { removeLeg(id); return; }
  const clash = S.slip.find(x => S.legs[x] && S.legs[x].group === leg.group);
  if (clash) { S.slip = S.slip.map(x => x === clash ? id : x); S.locked.delete(clash); toast(`Swapped for: ${leg.label}`); }
  else S.slip.push(id);
  S.locked.add(id); S.banned.delete(id);
  evaluateSlip();
}
function removeLeg(id) { S.slip = S.slip.filter(x => x !== id); S.locked.delete(id); S.banned.add(id); evaluateSlip(); }
function copySlip() {
  const m = S.match, r = S.result;
  const text = [`BET BUILDER — ${m.home} v ${m.away}`, ...S.slip.map(id => `✓ ${S.legs[id].label}  (${S.legs[id].market})`),
    `Chance ${pct(r && r.p, 1)} · fair odds ${odds(r && r.fair)}`].join("\n");
  navigator.clipboard.writeText(text).then(() => toast("Slip copied"), () => toast("Couldn't copy"));
}
/* ---------- best builders (scan) ---------- */
function showScan() {
  S.view = "scan";
  document.querySelectorAll(".fx").forEach(f => f.classList.remove("on"));
  renderScan();
  pollScan();
}
function renderScan() {
  const sc = S.scan;
  $("#match").innerHTML = `
    <div class="section" style="border-top:0">
      <h3>⚡ Best builders</h3>
      <div class="note" style="margin-top:0">HAWK builds a ticket for every fixture with your slip settings —
        target <b style="color:var(--gold)">${S.target.toFixed(2)}</b> · ${esc(STYLES[S.style].label)} · ${esc(FOCUS_LABELS[S.focus])} · max ${S.maxLegs} legs.
        At the same target every ticket has the same chance to land, so the best are the ones needing the <b>fewest legs</b>

      <div class="leagues" id="scanLeagues" style="flex-wrap:wrap;margin:12px 0">${S.allLeagues.map(l =>
        `<button class="pill ${sc.leagues.has(l) ? "on" : ""}" data-sl="${esc(l)}">${esc(l)}</button>`).join("")}</div>
      <div class="opts" style="justify-content:flex-start;gap:16px;flex-wrap:wrap">

          `<option value="${h}" ${h === sc.hours ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label>Sort by <select id="srt">${[["legs", "Fewest legs"], ["kickoff", "Kick-off time"], ["value", "Bet365 value"]].map(([k, t]) =>
          `<option value="${k}" ${k === sc.sort ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <button class="build" id="scanGo" style="width:auto;margin:0 0 0 auto;padding:10px 20px"></button>
      </div>
      <div id="scanProg"></div>
    </div>

  $("#scanLeagues").onclick = (e) => {
    const b = e.target.closest("[data-sl]"); if (!b) return;
    const l = b.dataset.sl; sc.leagues.has(l) ? sc.leagues.delete(l) : sc.leagues.add(l);

function updateScan() {
  if (S.view !== "scan" || !$("#scanRes")) return;
  const d = S.scan.data || { running: false, total: 0, done: 0, errors: 0, results: [] };
  $("#scanGo").textContent = d.running ? "■ STOP" : (d.results.length ? "⚡ SCAN AGAIN" : "⚡ SCAN");
  $("#scanProg").innerHTML = d.running || d.total ? `<div class="prog"><span style="width:${d.total ? 100 * d.done / d.total : 3}%"></span></div>
    <div class="note">${d.running ? `Scanning… ${d.done} of ${d.total || "?"} fixtures` : `Scanned ${d.done} fixture${d.done === 1 ? "" : "s"}`}${
      d.errors ? ` · ${d.errors} skipped (no odds or data yet)` : ""}</div>` : "";
  const sorters = {
    legs: (a, b) => a.legs.length - b.legs.length || (a.kickoff || "").localeCompare(b.kickoff || ""),
    kickoff: (a, b) => (a.kickoff || "").localeCompare(b.kickoff || ""),
    value: (a, b) => b.value.length - a.value.length || ((b.value[0] || {}).edge || 0) - ((a.value[0] || {}).edge || 0),
  };
  const res = [...d.results].sort(sorters[S.scan.sort]);
  $("#scanRes").innerHTML = res.length ? res.map(r => scanCard(r, d.params)).join("") : `<div class="note">${d.running
    ? "Results appear here as each match is analysed…"
    : d.total === 0 && d.params ? "No fixtures kick off in that window — try a longer one."
    : "Pick leagues and a time window, then hit Scan. It takes a few seconds per match."}</div>`;
}
function scanCard(r, params) {
  const short = params && r.fair && r.fair < params.target * 0.97;
  return `<div class="scard" data-open="${esc(r.id)}">
    <div><div class="teams"><img src="${esc(r.homeCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(r.home)}
        <span class="muted" style="font-weight:500">vs</span><img src="${esc(r.awayCrest)}" alt="" onerror="this.style.visibility='hidden'">${esc(r.away)}</div>
      <div class="muted" style="font-size:12px;margin-top:2px">${esc(r.league)} · ${esc(fmtKick(r.kickoff))} ·
        <span class="badge ${r.confirmed ? "ok" : "warn"}">${r.confirmed ? "Lineups confirmed" : "Lineups predicted"}</span></div>
      <div>${r.legs.map(l => `<span class="lchip ${l.kind === "player" ? "pl" : ""}">${esc(l.label)}</span>`).join("")}</div>
      ${r.value.length ? `<div class="vline">Bet365 value: ${r.value.map(v => `${esc(v.label)} @ ${odds(v.price)} (+${(100 * v.edge).toFixed(1)}%)`).join(" · ")}</div>` : ""}</div>
    <div style="text-align:right"><div class="bigodds">${odds(r.fair)}</div>
      <div class="muted" style="font-size:12px">${r.legs.length} legs · ${pct(r.p, 1)}${short ? "<br>short of target" : ""}</div>
      <button class="ghost" style="width:auto;padding:6px 12px">Open ›</button>
      <button class="ghost" style="width:auto;padding:6px 12px" data-acca="${esc(r.id)}" title="Put this builder on your acca">${
        S.acca.some(pt => pt.id === String(r.id)) ? "✓ In acca" : "➕ Acca"}</button></div></div>`;
}
async function toggleScan() {
  try {
    if (S.scan.data && S.scan.data.running) S.scan.data = await api("/api/scan/stop", {});
    else {
      if (!S.scan.leagues.size) return toast("Pick at least one league.");
      S.scan.data = await api("/api/scan", { leagues: [...S.scan.leagues], hours: S.scan.hours, target: S.target,
                                             style: S.style, focus: S.focus, maxLegs: S.maxLegs, extras: S.extras });
    }
  } catch (err) { toast(err.message); }
  updateScan();
  pollScan();
}
async function pollScan() {
  clearTimeout(S.scan.timer);

// Each part is one match: a single leg or a same-match builder, with HAWK's
// chance for it. Matches are independent, so the acca's chance is the
// product of the parts'. Kept in this browser's storage.
const VALUE_EDGE = 1.02;   // "value" = Bet365 pays at least 2% more than fair
function saveAcca() { savePref("hawk.acca", S.acca); renderAccaBtn(); }
const accaLegCount = () => S.acca.reduce((s, pt) => s + pt.legs.length, 0);
function renderAccaBtn() {
  const n = accaLegCount(), b = $("#accaBtn");
  b.innerHTML = `🧩 <span>Acca</span>${n ? `<em class="count">${n}</em>` : ""}`;
  b.title = n ? `Your acca: ${n} leg${n === 1 ? "" : "s"} — and the Monster Acca` : "Several matches on one ticket, and the Monster Acca";
}
// A single leg's Bet365 price is known, and an acca of singles pays their
// product. A same-match builder is priced by the bookmaker, so it's unknown.
const partPrice = (pt) => (pt.legs.length === 1 ? pt.legs[0].bookPrice || null : null);
function accaTotals(parts = S.acca) {
  if (!parts.length) return { p: null, fair: null, known: null, legs: 0 };
  const p = parts.reduce((s, pt) => s * pt.p, 1), prices = parts.map(partPrice);
  return { p, fair: p > 0 ? 1 / p : null, known: prices.every(Boolean) ? prices.reduce((s, x) => s * x, 1) : null,
           legs: parts.reduce((s, pt) => s + pt.legs.length, 0) };
}
const makePart = (info, legs, p) => ({ id: String(info.id), league: info.league, home: info.home, away: info.away,
                                       kickoff: info.kickoff, legs, p, fair: p > 0 ? 1 / p : null });
function putPart(part) {   // one part per match: adding a match again replaces it
  const i = S.acca.findIndex(x => x.id === part.id);
  if (i >= 0) S.acca[i] = part; else S.acca.push(part);
  S.acca.sort((a, b) => (a.kickoff || "").localeCompare(b.kickoff || ""));
  saveAcca();
  return i >= 0;
}
function accaToast(replaced, home, away) {

}

    bookPrice: l.bookPrice || null, player: l.player || null, side: l.side || null }; });
  accaToast(putPart(makePart(m, legs, r.p)), m.home, m.away);
  renderSlip();
}

  const price = Math.round(a.eff * 100) / 100;
  const legs = S.acca.map(pt => ({
    fixture: `${pt.home} vs ${pt.away}`, selection: pt.legs.map(l => l.label).join(" & "),
    angle: `HAWK: ${pct(pt.p, 1)} · fair ${odds(pt.fair)}`, odds: +(partPrice(pt) || pt.fair).toFixed(2), type: "acca", league: pt.league,
    subSelections: pt.legs.map(l => ({ label: l.label, odds: +(l.bookPrice || l.fair).toFixed(2) })),
    hawk: hawkPart(pt, pt.legs, pt.p),
  }));
  if (saveToVault(legs, a.stake, price, { source: "hawk", hawkP: a.p }))
    toast(`🦅 Acca logged in your Vault: €${a.stake.toFixed(2)} @ ${odds(price)}${a.boost ? ` (boosted from ${odds(a.price)})` : ""}. It settles itself as the matches finish.`);
}

function monsterParams() { const mo = S.monster; return { leagues: [...mo.leagues], hours: mo.hours, perMatch: mo.perMatch, style: mo.style, focus: S.focus, extras: S.extras }; }
function monsterStale() {  // settings changed since the last build
  const p = S.monster.data && S.monster.data.params, want = monsterParams();
  return !!p && (p.perMatch !== want.perMatch || p.style !== want.style || p.hours !== want.hours ||
                 [...p.leagues].sort().join() !== [...want.leagues].sort().join());
}
async function toggleMonster() {

    else {
      if (!S.monster.leagues.size) return toast("Pick at least one league.");
      S.monster.skip = new Set();
      S.monster.data = await api("/api/monster", monsterParams());
    }
  } catch (err) { toast(err.message); }
  updateMonster();

}
async function pollMonster() {

// The best parts, one per match, until the ticket has the legs you asked for.
function monsterPick() {
  const d = S.monster.data, mo = S.monster;
  if (!d) return { picked: [], bench: [] };
  const now = Date.now(), single = d.params.perMatch === 1;
  const pool = d.results.filter(r => !mo.skip.has(String(r.id)) && (!r.kickoff || new Date(r.kickoff).getTime() > now))
    .sort(single ? (a, b) => b.ratio - a.ratio || b.p - a.p : (a, b) => b.p - a.p);
  const picked = [], bench = [];
  let n = 0;
  for (const r of pool) { if (n < mo.legs) { picked.push(r); n += r.legs.length; } else bench.push(r); }
  picked.sort((a, b) => (a.kickoff || "").localeCompare(b.kickoff || ""));
  return { picked, bench };
}

/* ---------- cash-out helper ---------- */
// Your pending HAWK tickets on the match in play: the live chance of each leg
// and of the whole ticket (other matches in an acca count at their result, or
// HAWK's pre-match chance if they haven't finished), what the ticket is worth
// on average right now, and whether Bet365's cash-out offer beats that.
async function myLiveTickets(gameId) {
  let bets = [];
  try { bets = JSON.parse(localStorage.getItem("hawk_bets")) || []; } catch { return []; }
  const out = [];
  for (const b of bets) {
    if (b.status !== "PENDING" || !(b.legs || []).some(l => l.hawk && String(l.hawk.game) === String(gameId))) continue;
    let p = 1, approx = false, unknown = 0;
    const parts = [];
    for (const l of b.legs) {
      if (!l.hawk) { unknown++; continue; }
      if (String(l.hawk.game) === String(gameId)) {
        const live = await api(`/api/ticketlive?id=${gameId}`, { legs: l.hawk.legs });
        if (!live) { unknown++; continue; }
        parts.push({ fixture: l.fixture, live });
        p *= live.p; unknown += live.unknown;
      } else {
        const rs = (l.hawk.legs || []).map(h => h.result);
        if (rs.includes("lost")) p = 0;
        else if (rs.length && rs.every(r => r === "won")) { /* already landed */ }
        else { p *= l.hawk.p || 1; approx = true; }
        parts.push({ fixture: l.fixture, other: rs.includes("lost") ? "lost" : rs.length && rs.every(r => r === "won") ? "won" : "pending", p: l.hawk.p });
      }
    }
    out.push({ id: b.id, stake: b.stake, odds: b.odds, ret: b.potentialReturn, p, approx, unknown, parts });
  }
  return out;
}
function cashOutSection() {
  const mine = (S.inplay && S.inplay.mine) || [];
  if (!mine.length) return "";
  S.inplay.offers ||= {};
  const icon = { won: "✅", lost: "❌", live: "⏳", wait: "⏸", void: "⊘" };
  return `<div class="section"><h3>🎟 Your bet${mine.length > 1 ? "s" : ""} on this match</h3>${mine.map(t => {
    const hold = t.p * t.ret, offer = parseFloat(String(S.inplay.offers[t.id] || "").replace(",", "."));
    const legRows = t.parts.map(pt => pt.live ? pt.live.legs.map(r => `<div class="co-leg"><span>${icon[r.state] || "⏳"}</span><span>${esc(r.label)}<small>${esc(r.note || "")}</small></span>
        <b>${r.state === "won" ? "done" : r.state === "lost" ? "lost" : r.p == null ? "—" : pct(r.p, r.p < 0.1 ? 1 : 0)}</b></div>`).join("")
      : `<div class="co-leg"><span>${pt.other === "won" ? "✅" : pt.other === "lost" ? "❌" : "🕒"}</span><span>${esc(pt.fixture)}<small>${pt.other === "pending" ? "other match — HAWK's pre-match chance" : "other match"}</small></span>
        <b>${pt.other === "won" ? "done" : pt.other === "lost" ? "lost" : pct(pt.p, 0)}</b></div>`).join("");
    const verdict = !(offer > 0) ? `<div class="note" style="margin:6px 0 0">Type Bet365's cash-out offer to see if it's worth taking.</div>`
      : offer >= hold ? `<div class="verdict good">💰 TAKE IT<small>€${offer.toFixed(2)} is more than the ticket is worth on average right now (€${hold.toFixed(2)}).</small></div>`
      : `<div class="verdict bad">✋ KEEP IT<small>On average the ticket is worth €${hold.toFixed(2)} — €${(hold - offer).toFixed(2)} more than the offer. Cash-out offers usually sit 5–10% below fair.</small></div>`;
    return `<div class="co-card">
      <div class="co-top"><div><b>€${t.stake.toFixed(2)} @ ${odds(t.odds)}</b><div class="muted" style="font-size:12px">returns €${t.ret.toFixed(2)} if it lands</div></div>

/* ---------- learning from your results ---------- */
// The Vault settles your HAWK bets, so it knows how often each market's legs
// really landed. Once a market has 30+ settled legs, HAWK nudges that
// market's chances towards what happened (in log-odds, shrunk towards "no
// change" while the sample is small, and capped). Uses each leg's raw
// chance, so earlier adjustments aren't counted twice. Which legs learn, and
// in which group, is HAWK.learnKey (player props; corners/cards/SoT by Over/Under).
const LEARN_MIN = 30, LEARN_SHRINK = 60, LEARN_CAP = 0.6;
const lg = (p) => Math.log(p / (1 - p)), ilg = (x) => 1 / (1 + Math.exp(-x));
function computeLearning() {
  let bets = [];
  try { bets = JSON.parse(localStorage.getItem("hawk_bets")) || []; } catch { /* no Vault data */ }
  const by = {};
  for (const b of bets) for (const l of b.legs || []) for (const h of (l.hawk && l.hawk.legs) || []) {
    const p = h.pRaw != null ? h.pRaw : h.p, key = HAWK.learnKey(h.id, h.market);
    if ((h.result !== "won" && h.result !== "lost") || !(p > 0 && p < 1) || !key) continue;
    const g = (by[key] ||= { n: 0, said: 0, won: 0 });
    g.n++; g.said += p; if (h.result === "won") g.won++;
  }
  const shifts = {}, changes = [];
  let total = 0;
  for (const [market, g] of Object.entries(by)) {
    total += g.n;
    if (g.n < LEARN_MIN) continue;
    const said = g.said / g.n, got = Math.min(Math.max(g.won / g.n, 0.02), 0.98);
    const shift = Math.max(-LEARN_CAP, Math.min(LEARN_CAP, (g.n / (g.n + LEARN_SHRINK)) * (lg(got) - lg(said))));
    if (Math.abs(shift) < 0.02) continue;
    shifts[market] = shift;
    changes.push({ market, n: g.n, pts: 100 * (ilg(lg(said) + shift) - said) });
  }
  return { shifts, changes: changes.sort((a, b) => Math.abs(b.pts) - Math.abs(a.pts)), total,
           best: Math.max(0, ...Object.values(by).map((g) => g.n)) };
}
function applyLearning() {
  S.learn = { on: loadPref("hawk.learn", true), ...computeLearning() };
  HAWK.setLearning(S.learn.on ? S.learn.shifts : {});
}
function learningNote() {
  const L = S.learn;
  if (!L) return "";
  if (!L.changes.length)
    return `<div class="learn">🧠 HAWK learns from your settled bets: once a market has ${LEARN_MIN}+ settled legs it adjusts that market's chances.
      ${L.total ? `You have ${L.total} so far (best market: ${L.best}).` : "Send bets with 🦅 Send to Vault to start."}</div>`;
  return `<div class="learn">🧠 ${L.on ? "Adjusted" : "Could adjust"} from your ${L.total} settled legs:
    ${L.changes.slice(0, 4).map((c) => `<b>${esc(c.market)}</b> ${c.pts >= 0 ? "+" : ""}${c.pts.toFixed(1)} pts`).join(" · ")}
    <button class="linkbtn" onclick="toggleLearning()">${L.on ? "turn off" : "turn on"}</button></div>`;
}
function toggleLearning() {
  savePref("hawk.learn", !S.learn.on);
  applyLearning();
  toast(S.learn.on ? "🧠 Learning on." : "Learning off — HAWK's plain chances.");
  if (S.match && S.view === "match") openMatch(S.match.id, true);   // re-price the open match (keeps your slip)

const ALERT_MS = 3 * 60 * 1000;
const isStarred = (matchId, legId) => S.alerts.some(a => a.match === String(matchId) && a.leg === legId);

  }

function valueAlert(what, price, fair, onClick) {
  const msg = `💰 Value: ${what} — Bet365 ${odds(price)}, fair ${odds(fair)} (+${(100 * (price / fair - 1)).toFixed(1)}%)`;
  beep(); flashTitle("💰 Value!"); toast(msg);

let trackingPrices = false;
async function trackPrices() {
  if (trackingPrices) return;
  const now = Date.now(), upcoming = (k) => !k || new Date(k).getTime() > now;
  const n = S.alerts.length;
  S.alerts = S.alerts.filter(a => upcoming(a.kickoff));
  if (S.alerts.length !== n) { savePref("hawk.priceAlerts", S.alerts); renderWatch(); }
  const accaLegs = S.acca.filter(pt => upcoming(pt.kickoff)).flatMap(pt => pt.legs.filter(l => l.bookPrice).map(l => ({ pt, l })));
  const items = [...S.alerts.map(a => ({ match: a.match, leg: a.leg })), ...accaLegs.map(x => ({ match: x.pt.id, leg: x.l.id }))];
  if (!items.length) return;
  trackingPrices = true;
  try {
    const prices = await api("/api/legprices", { items });
    for (const a of S.alerts) {
      const price = prices[`${a.match}|${a.leg}`]; if (!price) continue;
      a.price = price;
      if (price < a.fair * VALUE_EDGE) a.alertedAt = null;                 // re-arm once it drops back
      else if (!(a.alertedAt >= price)) { a.alertedAt = price; valueAlert(`${a.label} (${a.home} v ${a.away})`, price, a.fair, () => goToMatch(a.league, a.match)); }
    }
    let changed = false;
    for (const { pt, l } of accaLegs) {
      const price = prices[`${pt.id}|${l.id}`]; if (!price || price === l.bookPrice) continue;
      const wasValue = l.bookPrice >= l.fair * VALUE_EDGE;
      l.prevPrice = l.bookPrice; l.bookPrice = price; changed = true;
      if (!wasValue && price >= l.fair * VALUE_EDGE) valueAlert(`${l.label} (${pt.home} v ${pt.away}, in your acca)`, price, l.fair, showAcca);
    }
    savePref("hawk.priceAlerts", S.alerts);
    if (changed) saveAcca();
    renderWatch();
    if (S.view === "acca") renderAccaBody();
  } catch (err) { console.warn("[hawk] price alerts:", err.message); }
  finally { trackingPrices = false; }
}
