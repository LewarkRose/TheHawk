/* ---------- learning from your results ---------- */
// The Vault settles your HAWK bets, so it knows how often each market's legs
// really landed. Once a market has 30+ settled legs, HAWK nudges that
// market's chances towards what happened (in log-odds, shrunk towards "no
// change" while the sample is small, and capped). Uses each leg's raw
// chance, so earlier adjustments aren't counted twice. Which legs learn, and
// in which group, is HAWK.learnKey (player props; corners/cards/SoT by Over/Under).
const LEARN_MIN = 30, LEARN_SHRINK = 60, LEARN_CAP = 0.6;
const lg = (p) => Math.log(p / (1 - p)), ilg = (x) => 1 / (1 + Math.exp(-x));
function computeLearning() {
  let bets = [];
  try { bets = JSON.parse(localStorage.getItem("hawk_bets")) || []; } catch { /* no Vault data */ }
  const by = {};
  for (const b of bets) for (const l of b.legs || []) for (const h of (l.hawk && l.hawk.legs) || []) {
    const p = h.pRaw != null ? h.pRaw : h.p, key = HAWK.learnKey(h.id, h.market);
    if ((h.result !== "won" && h.result !== "lost") || !(p > 0 && p < 1) || !key) continue;
    const g = (by[key] ||= { n: 0, said: 0, won: 0 });
    g.n++; g.said += p; if (h.result === "won") g.won++;
  }
  // Plus HAWK's graded predictions on every match (engine/grade.mjs on GitHub).
  let fromAll = 0;
  for (const [key, g] of Object.entries((S.graded && S.graded.byKey) || {})) {
    const b = (by[key] ||= { n: 0, said: 0, won: 0 });
    b.n += g.n; b.said += g.p; b.won += g.won; fromAll += g.n;
  }
  const shifts = {}, changes = [];
  let total = 0;
  for (const [market, g] of Object.entries(by)) {
    total += g.n;
    if (g.n < LEARN_MIN) continue;
    const said = g.said / g.n, got = Math.min(Math.max(g.won / g.n, 0.02), 0.98);
    const shift = Math.max(-LEARN_CAP, Math.min(LEARN_CAP, (g.n / (g.n + LEARN_SHRINK)) * (lg(got) - lg(said))));
    if (Math.abs(shift) < 0.02) continue;
    shifts[market] = shift;
    changes.push({ market, n: g.n, pts: 100 * (ilg(lg(said) + shift) - said) });
  }
  return { shifts, changes: changes.sort((a, b) => Math.abs(b.pts) - Math.abs(a.pts)), total, fromAll,
           matches: (S.graded && S.graded.matches) || 0, best: Math.max(0, ...Object.values(by).map((g) => g.n)) };
}
function applyLearning() {
  S.learn = { on: loadPref("hawk.learn", true), ...computeLearning() };
  HAWK.setLearning(S.learn.on ? S.learn.shifts : {});
  HAWK.setEarlyPayout(S.ep);
  applyPropBook();
  applyAim();
  S.trust = computeTrust();
  HAWK.setTrust(Object.fromEntries(Object.entries(S.trust).filter(([, t]) => t.kind === "hi").map(([market]) => [market, TRUST_RUNS_HIGH])));
}

/* ---------- data health ---------- */
// How fresh HAWK's data files are, source by source (data/meta.json, built
// on GitHub every 3 hours). When a source is down, the files keep the last
// good data, so this says which part is older and since when.
const ago = (iso) => {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return mins < 90 ? `${mins} min ago` : mins < 36 * 60 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} days ago`;
};
const SOURCE_LABELS = { "365Scores": "Fixtures", "football-data": "Team ratings", "StatsHub": "Player stats" };
function healthLine() {
  const m = S.meta;
  if (!m) return "";
  const stuck = Date.now() - new Date(m.generated).getTime() > 6 * 3600e3;   // updates run every 3 hours
  const parts = Object.entries(m.sources || {}).map(([name, s]) => s.ok
    ? `<span class="ok">✅ ${esc(SOURCE_LABELS[name] || name)}</span>`
    : `<span class="bad" title="${esc(name)} didn't answer — HAWK is using its last good data">⚠️ ${esc(SOURCE_LABELS[name] || name)} from ${esc(s.last_ok ? ago(s.last_ok) : "an earlier run")}</span>`);
  return `<div class="dhealth ${stuck || parts.some(p => p.includes("bad")) ? "warn" : ""}">📡 ${parts.join(" · ") || "Data"}
    <span class="muted">— updated ${esc(S.dataAge)}${stuck ? " (the 3-hourly update seems stuck — check GitHub Actions)" : ""}</span></div>`;
}

/* ---------- trusted markets ---------- */
// From HAWK's graded predictions on every match (data/graded.json): did each
// market's chances land as often as HAWK said? It only judges a market after
// 200+ graded legs from 15+ matches. ✅ trusted = within 3 points; ⚠️ runs
// high = landed 5+ points less often than said (auto-builds then prefer a
// similar leg from another market); 🔹 runs low = landed 5+ points more often.
const TRUST_MIN_LEGS = 200, TRUST_MIN_MATCHES = 15, TRUST_RUNS_HIGH = 0.9;
function computeTrust() {
  const g = S.graded, out = {};
  if (!g || (g.matches || 0) < TRUST_MIN_MATCHES) return out;
  for (const [market, b] of Object.entries(g.byMarket || {})) {
    if (b.n < TRUST_MIN_LEGS) continue;
    const said = b.p / b.n, got = b.won / b.n, gap = got - said;
    out[market] = { n: b.n, said, got, gap, kind: Math.abs(gap) <= 0.03 ? "ok" : gap <= -0.05 ? "hi" : gap >= 0.05 ? "lo" : "close" };
  }
  return out;
}
const learnsMarket = (market) => S.learn && S.learn.on && Object.keys(S.learn.shifts).some(k => k === market || k.startsWith(market + " · "));
function trustBadge(market) {
  const t = S.trust && S.trust[market];
  if (!t || t.kind === "close") return "";
  const nums = `HAWK said ${pct(t.said)} on average and ${pct(t.got)} landed, over ${t.n.toLocaleString()} graded legs.`;
  if (t.kind === "ok") return `<span class="tb ok" title="${esc("Trusted: HAWK's chances in this market come true as often as it says. " + nums)}">✅ Trusted</span>`;
  const pts = Math.abs(100 * t.gap).toFixed(0);
  if (t.kind === "hi") return `<span class="tb hi" title="${esc(`HAWK's chances here have run high. ${nums} ${learnsMarket(market) ? "The chances you see are already corrected down. " : ""}Auto-builds prefer a similar leg from a trusted market.`)}">⚠️ Runs ${pts} pts high</span>`;
  return `<span class="tb lo" title="${esc(`These legs have landed more often than HAWK said. ${nums}${learnsMarket(market) ? " The chances you see are already corrected up." : ""}`)}">🔹 Runs ${pts} pts low</span>`;
}
function trustNote() {
  const T = S.trust || {}, list = (kind) => Object.entries(T).filter(([, t]) => t.kind === kind).sort((a, b) => b[1].n - a[1].n).map(([m]) => m);
  const ok = list("ok"), hi = list("hi"), matches = (S.graded && S.graded.matches) || 0;
  if (!ok.length && !hi.length)
    return `<div class="learn">🎯 Trusted markets: HAWK marks each market ✅ or ⚠️ once it has graded ${TRUST_MIN_MATCHES}+ matches${matches ? ` (${matches} so far)` : ""}.</div>`;
  return `<div class="learn">🎯 ${ok.length ? `<b>Trusted:</b> ${ok.slice(0, 5).map(esc).join(", ")}${ok.length > 5 ? ` +${ok.length - 5}` : ""}` : ""}
    ${hi.length ? `${ok.length ? "<br>" : ""}<b>Runs high</b> (builds avoid): ${hi.slice(0, 4).map(esc).join(", ")}` : ""}</div>`;
}
function learningNote() {
  const L = S.learn;
  if (!L) return "";
  const source = L.matches ? `HAWK's graded predictions on ${L.matches} match${L.matches === 1 ? "" : "es"}` + (L.total - L.fromAll ? ` + ${L.total - L.fromAll} of your legs` : "")
    : `${L.total} of your settled legs`;
  if (!L.changes.length)
    return `<div class="learn">🧠 HAWK learns from ${L.matches ? "every match it predicts and " : ""}your settled bets: once a market has ${LEARN_MIN}+ graded legs it adjusts that market's chances.
      ${L.total ? `So far: ${source}.` : "It starts as soon as the first matches are graded."}</div>`;
  return `<div class="learn">🧠 ${L.on ? "Adjusted" : "Could adjust"} from ${source}:
    ${L.changes.slice(0, 4).map((c) => `<b>${esc(c.market)}</b> ${c.pts >= 0 ? "+" : ""}${c.pts.toFixed(1)} pts`).join(" · ")}
    <button class="linkbtn" onclick="toggleLearning()">${L.on ? "turn off" : "turn on"}</button></div>`;
}
function toggleLearning() {

/* ---------- price alerts ---------- */
// Star a leg that has a Bet365 price and HAWK tells you (sound, title flash,
// notification) when Bet365 pays 2%+ more than HAWK's fair odds. Legs in your
// acca and slip are checked the same way. Only while a HAWK tab is open.
const ALERT_MS = 3 * 60 * 1000;
const isStarred = (matchId, legId) => S.alerts.some(a => a.match === String(matchId) && a.leg === legId);
async function askNotify() {
  if ("Notification" in window && Notification.permission === "default") { try { await Notification.requestPermission(); } catch {} }
}
async function toggleStar(legId) {
  const m = S.match, l = S.legs[legId]; if (!m || !l) return;
  if (isStarred(m.id, legId)) {
    S.alerts = S.alerts.filter(a => !(a.match === String(m.id) && a.leg === legId));
    toast("Price alert off.");
  } else {
    if (!l.bookPrice) return toast("Only legs with a Bet365 price can have a price alert.");
    S.alerts.push({ match: String(m.id), league: m.league, home: m.home, away: m.away, kickoff: m.kickoff,
                    leg: legId, label: l.label, fair: l.fair, price: l.bookPrice, alertedAt: null });
    await askNotify();
    toast(`⭐ Alert set: HAWK tells you when Bet365 pays ${odds(l.fair * VALUE_EDGE)}+ for ${l.label} (now ${odds(l.bookPrice)}). Keep a HAWK tab open.`);
  }
  savePref("hawk.priceAlerts", S.alerts); renderWatch(); refreshTab();
}
function valueAlert(what, price, fair, onClick) {
  const msg = `💰 Value: ${what} — Bet365 ${odds(price)}, fair ${odds(fair)} (+${(100 * (price / fair - 1)).toFixed(1)}%)`;
  beep(); flashTitle("💰 Value!"); toast(msg);
  if ("Notification" in window && Notification.permission === "granted") {
    try { const n = new Notification("HAWK", { body: msg }); n.onclick = () => { window.focus(); if (onClick) onClick(); }; }
    catch { systemNotify("💰 Value!", msg, { tag: "value" }); }   // phones only allow it through the service worker
  }
}
let trackingPrices = false;
async function trackPrices() {
  if (trackingPrices) return;
  const now = Date.now(), upcoming = (k) => !k || new Date(k).getTime() > now;
  const n = S.alerts.length;
  S.alerts = S.alerts.filter(a => upcoming(a.kickoff));
  if (S.alerts.length !== n) { savePref("hawk.priceAlerts", S.alerts); renderWatch(); }
  const accaLegs = S.acca.filter(pt => upcoming(pt.kickoff)).flatMap(pt => pt.legs.filter(l => l.bookPrice).map(l => ({ pt, l })));
  const items = [...S.alerts.map(a => ({ match: a.match, leg: a.leg })), ...accaLegs.map(x => ({ match: x.pt.id, leg: x.l.id }))];
  if (!items.length) return;
  trackingPrices = true;
  try {
    const prices = await api("/api/legprices", { items });
    for (const a of S.alerts) {
      const price = prices[`${a.match}|${a.leg}`]; if (!price) continue;
      a.price = price;
      if (price < a.fair * VALUE_EDGE) a.alertedAt = null;                 // re-arm once it drops back
      else if (!(a.alertedAt >= price)) { a.alertedAt = price; valueAlert(`${a.label} (${a.home} v ${a.away})`, price, a.fair, () => goToMatch(a.league, a.match)); }
    }
    let changed = false;
    for (const { pt, l } of accaLegs) {
      const price = prices[`${pt.id}|${l.id}`]; if (!price || price === l.bookPrice) continue;
      const wasValue = l.bookPrice >= l.fair * VALUE_EDGE;
      l.prevPrice = l.bookPrice; l.bookPrice = price; changed = true;
      if (!wasValue && price >= l.fair * VALUE_EDGE) valueAlert(`${l.label} (${pt.home} v ${pt.away}, in your acca)`, price, l.fair, showAcca);
    }
    savePref("hawk.priceAlerts", S.alerts);
    if (changed) saveAcca();
    renderWatch();
    if (S.view === "acca") renderAccaBody();
  } catch (err) { console.warn("[hawk] price alerts:", err.message); }
  finally { trackingPrices = false; }
}

  const follow = loadPref("hawk.goalFollow", {});
  follow[String(w.id)] = w.kickoff || new Date().toISOString();
  savePref("hawk.goalFollow", follow);
  systemNotify("🔔 Lineups in!", `${msg}\nTap to rebuild your builder with them.`,
               { tag: `lineups-${w.id}`, url: `?view=build&id=${w.id}&league=${encodeURIComponent(w.league || "")}` });
  if (S.view === "match" && S.match && String(S.match.id) === String(w.id)) {
    await openMatch(w.id, true);   // keeps your slip and locked legs
    await build();
    toast("Builder rebuilt with the confirmed lineups.");
  }
}
/* ---------- goal alerts ---------- */
// A goal pops up bottom-right (top on a phone) for the matches you follow: ones
// you have a HAWK bet on, a lineup alert on, or the live view open. It says who
// scored and what the goal did to your bet. Checked every 30 s from the same
// scores feed as the Scores page; a goal taken off (VAR) shows too.
const GOALS_MS = 30 * 1000, GOAL_SHOW_MS = 15000;
const goalState = { last: {}, busy: false, on: loadPref("hawk.goalAlerts", true) };
function followedGames() {
  const ids = new Set();
  try {
    for (const b of JSON.parse(localStorage.getItem("hawk_bets")) || [])
      if (b.status === "PENDING") for (const l of b.legs || []) if (l.hawk && l.hawk.game) ids.add(String(l.hawk.game));
  } catch { /* no Vault data */ }
  for (const w of S.watch || []) ids.add(String(w.id));
  // Matches whose lineup alert has already gone off: followed until 3 hours after kick-off.
  const follow = loadPref("hawk.goalFollow", {}), now = Date.now();
  let changed = false;
  for (const [id, ko] of Object.entries(follow)) {
    if (now - Date.parse(ko) < 3 * 3600e3) ids.add(id); else { delete follow[id]; changed = true; }
  }
  if (changed) savePref("hawk.goalFollow", follow);
  if (S.view === "inplay" && S.inplay) ids.add(String(S.inplay.id));
  return ids;
}
async function checkGoals() {
  if (!goalState.on || goalState.busy) return;
  const follow = followedGames();
  if (!follow.size) return;
  goalState.busy = true;
  try {
    const games = (await HAWK.scores(localDay(new Date()))).filter(g => follow.has(g.id) && (g.status === 3 || g.status === 4));
    for (const g of games) {
      const now = [g.score[0] || 0, g.score[1] || 0], was = goalState.last[g.id];
      goalState.last[g.id] = now;
      if (!was || g.status === 4 && was[0] === now[0] && was[1] === now[1]) continue;   // first look: just remember it
      const side = now[0] > was[0] ? "home" : now[1] > was[1] ? "away" : now[0] < was[0] ? "home-off" : now[1] < was[1] ? "away-off" : null;
      if (side) goalAlert(g, side, now).catch(e => console.warn("[hawk] goal alert:", e.message));
    }
  } catch (e) { console.warn("[hawk] goal check:", e.message); }
  finally { goalState.busy = false; }
}
async function goalAlert(g, side, score) {
  const off = side.endsWith("-off"), who = side.startsWith("home") ? "home" : "away", team = g[who];
  // Who scored (the latest goal for that side) and what it did to your bet.
  let scorer = null, bet = null;
  try { const rep = await HAWK.matchReport(g.id); scorer = rep.events.filter(e => e.type === "goal" && e.side === who).pop() || null; } catch { /* just the score */ }
  try { const mine = await myLiveTickets(g.id); if (mine.length) bet = mine[0]; } catch { /* no bet */ }
  const box = $("#goalfeed");
  const card = document.createElement("div");
  card.className = `goal-card ${off ? "off" : ""}`;
  const crest = (k) => `<img src="${esc(g[k + "Crest"])}" alt="" onerror="this.style.visibility='hidden'">`;
  card.innerHTML = `
    <button class="gx" title="Close">✕</button>
    <div class="g-top"><span class="g-ball">${off ? "🚫" : "⚽"}</span><span class="g-word">${off ? "GOAL OFF" : "GOAL!"}</span><span class="g-min">${esc(g.clock || "")}</span></div>
    <div class="g-score">
      <span class="g-team ${who === "home" && !off ? "hit" : ""}">${crest("home")}${esc(g.home)}</span>
      <b>${score[0]}<i>–</i>${score[1]}</b>
      <span class="g-team away ${who === "away" && !off ? "hit" : ""}">${esc(g.away)}${crest("away")}</span></div>
    <div class="g-who">${off ? `${esc(team)}'s goal was taken off` : scorer && scorer.player ? `${esc(scorer.player)} ${esc(scorer.minute)}${scorer.detail ? ` · ${esc(scorer.detail)}` : ""}${scorer.assist ? ` <span>· assist ${esc(scorer.assist)}</span>` : ""}` : `${esc(team)} score`}</div>
    ${bet ? `<div class="g-bet">🎟 Your bet: <b>${pct(bet.p, bet.p < 0.1 ? 1 : 0)}</b> to land now · worth ≈ €${(bet.p * bet.ret).toFixed(2)}</div>` : ""}
    <div class="g-bar"><i></i></div>`;
  card.onclick = (e) => { if (e.target.closest(".gx")) { card.remove(); return; } card.remove(); goToLive(g.league, g.id); };
  box.prepend(card);
  while (box.children.length > 3) box.lastElementChild.remove();
  // Away from HAWK when it happened? The card waits for you to come back.
  const hideLater = () => { setTimeout(() => card.classList.add("bye"), GOAL_SHOW_MS); setTimeout(() => card.remove(), GOAL_SHOW_MS + 600); };
  if (document.hidden) document.addEventListener("visibilitychange", function once() { if (!document.hidden) { document.removeEventListener("visibilitychange", once); hideLater(); } });
  else hideLater();
  if (!off) { beep(); flashTitle("⚽ GOAL!"); }
  // A PC / phone notification when HAWK isn't the window you're looking at.
  if (document.hidden || !document.hasFocus()) {
    const title = off ? `🚫 Goal off · ${g.home} ${score[0]}–${score[1]} ${g.away}` : `⚽ GOAL! ${g.home} ${score[0]}–${score[1]} ${g.away}`;
    const body = [off ? `${team}'s goal was taken off` : scorer && scorer.player ? `${scorer.player} ${scorer.minute}${scorer.assist ? ` (assist ${scorer.assist})` : ""}` : `${team} score · ${g.clock || ""}`,
                  bet ? `🎟 Your bet: ${pct(bet.p, bet.p < 0.1 ? 1 : 0)} to land now · worth ≈ €${(bet.p * bet.ret).toFixed(2)}` : ""].filter(Boolean).join("\n");
    systemNotify(title, body, { icon: g[who + "Crest"], tag: `goal-${g.id}`, url: `?view=live&id=${g.id}&league=${encodeURIComponent(g.league)}` });
  }
}
// PC / phone notifications. Through the service worker where there is one
// (phones only allow it that way); tapping one opens the page it points to.
async function systemNotify(title, body, { icon, tag, url } = {}) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opts = { body, icon: icon || new URL("../icon-192.png", location.href).href, badge: new URL("../icon-192.png", location.href).href,
                 tag, renotify: !!tag, data: { url: url ? new URL(url, location.href).href : location.href } };
  try {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration("../") : null;
    if (reg) return await reg.showNotification(title, opts);
  } catch { /* fall back below */ }
  try { const n = new Notification(title, opts); n.onclick = () => { window.focus(); if (url) openHawkUrl(opts.data.url); n.close(); }; } catch { /* not allowed here */ }
}
// Opens a HAWK link (from a notification) in this page without reloading.
function openHawkUrl(href) {
  const q = new URL(href).searchParams;
  if (q.get("view") === "live" && q.get("id")) goToLive(q.get("league"), q.get("id"));
  if (q.get("view") === "build" && q.get("id")) goToMatch(q.get("league"), q.get("id")).then(build);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.open) { window.focus(); openHawkUrl(e.data.open); } });
// Goal-alert button on the Scores page: on/off, and asks for pop-up permission.
function goalToggleText() {
  if (!goalState.on) return "🔕 Goal alerts: off";
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  return perm === "granted" ? "⚽ Goal alerts: on · pop-ups ✓" : perm === "denied" ? "⚽ Goal alerts: on · pop-ups blocked" : "⚽ Goal alerts: on · 🔔 allow pop-ups";
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [1175, 0.2], [1568, 0.4]].forEach(([freq, t]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.18);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}
function flashTitle(text) {
  const base = "HAWK · Bet Builder";
  let n = 0;
  const t = setInterval(() => {
    document.title = n % 2 ? base : text;
    if (++n > 20 || (document.hasFocus() && n > 4)) { clearInterval(t); document.title = base; }
  }, 1000);
}

/* ---------- hit rates ---------- */
// "L5 4/5 · L10 7/10": how often the player hit this exact leg in his last
// games (his starts, when he has 3+). Green 70%+, amber 40–69%, red below.
function hitChip(l) {
  if (!l.recent || !(l.games >= 3)) return "";
  const r5 = l.recent.slice(0, 5), h5 = r5.filter(v => v >= l.threshold).length;
  const rate = l.hits / l.games, tone = rate >= 0.7 ? "g" : rate >= 0.4 ? "a" : "r";
  const unit = l.basis === "starts" ? "starts" : "games";
  const text = l.games > 5 ? `L5 ${h5}/${r5.length} · L${l.games} ${l.hits}/${l.games}` : `L${l.games} ${l.hits}/${l.games}`;
  return ` <span class="hr ${tone}" data-hist="${esc(l.id)}" title="Hit in ${l.hits} of his last ${l.games} ${unit}${l.games > 5 ? ` (${h5} of the last ${r5.length})` : ""} — click to see the games">${text}</span>`;
}
// The games behind a hit rate: one bar per game with the leg's line drawn
// across, and how that compares with HAWK's chance for this match.
function openLegHistory(id) {
  const l = S.legs[id], m = S.match;
  if (!l || !m || !l.recent) return;
  const p = (m.players[l.side] || []).find(x => x.name === l.player) || {};
  const src = (l.basis === "starts" ? p.recent_starts : p.recent) || [];
  const games = l.recent.map((v, i) => ({ v, g: src[i] || null })).reverse();   // oldest -> newest
  const top = Math.max(l.threshold + 1, ...games.map(x => x.v));
  const date = (ts) => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
  const r5 = l.recent.slice(0, 5), h5 = r5.filter(v => v >= l.threshold).length, rate = l.hits / l.games;
  const avg = l.recent.reduce((s, v) => s + v, 0) / l.recent.length;
  const what = l.label.replace(l.player + ": ", "").replace(l.player + " ", "");
  const cols = games.map(({ v, g }) => `<div class="col" title="${esc(g ? `${date(g.ts)} · ${g.comp}\n${g.home ? "vs" : "at"} ${g.opp} ${g.score}\n${g.minutes}' played${g.sub_in ? " (off the bench)" : ""}` : "")}">
      <div class="marks">${v >= l.threshold ? "✓" : ""}</div><div class="num">${v}</div>
      <div class="bw"><div class="bar ${v >= l.threshold ? "hit" : ""}" style="height:${100 * v / top}%"></div></div></div>`).join("");
  const labels = games.map(({ g }) => g ? `<div title="${esc(g.opp)}">${g.home ? "" : "@"}${esc(g.opp)}<br>${g.minutes}'</div>` : "<div></div>").join("");
  const gap = rate - l.p;
  const verdict = Math.abs(gap) < 0.12 ? `✅ HAWK's ${pct(l.p)} agrees with his record.`
    : gap > 0 ? `His record (${pct(rate)}) is better than HAWK's ${pct(l.p)}. HAWK also weighs today's opponent, his expected minutes and the match odds, so it's more cautious than the raw record — check the lineup and the opponent before trusting the streak.`
    : `HAWK's ${pct(l.p)} is higher than his record (${pct(rate)}) — usually because this match looks more open, or he's expected to play more minutes than in those games.`;
  modal(`<div class="mhead"><div class="ph">${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.remove()">` : ""}</div>
      <div><div style="font-size:20px;font-weight:800">${esc(l.player)} · ${esc(capitalise(what))}</div>
        <div class="muted">${esc(l.side === "home" ? m.home : m.away)} · his last ${l.games} ${l.basis === "starts" ? "starts" : "games"} · oldest → newest</div></div>
      <button class="x" data-close title="Close">✕</button></div>
    <div class="hits" style="margin-top:6px">
      <div class="tile"><div class="k">Last ${l.games}</div><div class="v">${l.hits}/${l.games}</div></div>
      <div class="tile"><div class="k">Last ${r5.length}</div><div class="v">${h5}/${r5.length}</div></div>
      <div class="tile"><div class="k">Average</div><div class="v">${avg.toFixed(1)}</div></div>
      <div class="tile"><div class="k">HAWK today</div><div class="v" style="color:var(--accent)">${pct(l.p)}</div></div></div>
    <div class="chart hist">${cols}<div class="thr" style="bottom:${(140 * l.threshold / top).toFixed(1)}px"><span>${l.threshold}+</span></div></div>
    <div class="xlabels">${labels}</div>
    <div class="note" style="margin-top:12px">${verdict}</div>
    <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="build" style="width:auto;margin:0;padding:9px 18px" data-add="${esc(l.id)}">${S.slip.includes(l.id) ? "✓ On your slip" : "+ Add to slip"}</button></div>`);
}

/* ---------- head to head ---------- */
// The last 5 meetings (any competition), from today's home side's view:
// results, goals, corners and cards, with the averages on top. Loaded after
// the match page, since it takes a few extra requests.
async function loadH2H(m) {
  const el = $("#h2h");
  if (!el) return;
  let d = S.h2h && S.h2h.id === m.id ? S.h2h.d : null;   // the tabs re-render the page: don't fetch twice
  if (!d) {
    try { d = await api(`/api/h2h?id=${m.id}`); } catch (err) { el.innerHTML = `<h3>⚔️ Head to head</h3><div class="note">Couldn't load the head to head (${esc(err.message)}).</div>`; return; }
    S.h2h = { id: m.id, d };
  }
  if (!S.match || S.match.id !== m.id || !$("#h2h")) return;
  const games = d.games || [];
  if (!games.length) { el.innerHTML = `<h3>⚔️ Head to head</h3><div class="note">These two haven't met recently.</div>`; return; }
  const us = (g) => (g.sameVenue ? [g.score[0], g.score[1]] : [g.score[1], g.score[0]]);   // [today's home, today's away]
  const wins = games.filter(g => us(g)[0] > us(g)[1]).length, draws = games.filter(g => us(g)[0] === us(g)[1]).length, n = games.length;
  const goals = games.map(g => g.score[0] + g.score[1]);
  const withStat = (k) => games.filter(g => g[k]);
  const avgOf = (k) => { const l = withStat(k); return l.length ? (l.reduce((s, g) => s + g[k][0] + g[k][1], 0) / l.length).toFixed(1) : "–"; };
  const date = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "2-digit" });
  el.innerHTML = `<h3>⚔️ Head to head · last ${n}</h3>
    <div class="h2h-sum"><span><b>${esc(m.home)}</b> ${wins}W</span><span>${draws}D</span><span><b>${esc(m.away)}</b> ${n - wins - draws}W</span>
      <span>⚽ ${(goals.reduce((s, x) => s + x, 0) / n).toFixed(1)} goals/g</span><span>Over 2.5: ${goals.filter(x => x > 2.5).length}/${n}</span>
      <span>BTTS: ${games.filter(g => g.score[0] > 0 && g.score[1] > 0).length}/${n}</span>
      <span>🚩 ${avgOf("corners")} corners</span><span>🟨 ${avgOf("cards")} cards</span></div>
    <div class="h2h-list">${games.map(g => {
      const [a, b] = us(g), res = a > b ? "w" : a < b ? "l" : "d";
      return `<div class="h2h-row" data-rep="${g.id}" title="Match report">
        <span class="muted">${esc(date(g.date))}</span>
        <span class="h2h-teams">${esc(g.home)} <b class="h2h-sc ${res}">${g.score[0]}–${g.score[1]}</b> ${esc(g.away)}</span>
        <span class="muted">${g.corners ? `🚩 ${g.corners[0] + g.corners[1]}` : ""}${g.cards ? ` · 🟨 ${g.cards[0] + g.cards[1]}` : ""}</span>
        <span class="muted h2h-comp">${esc(g.comp)}</span></div>`;
    }).join("")}</div>
    <div class="note">Colours are from ${esc(m.home)}'s side: green won, red lost. Old meetings say less than current form — HAWK's chances don't use them.</div>`;
  el.querySelector(".h2h-list").onclick = (e) => { const r = e.target.closest("[data-rep]"); if (r) showReport(r.dataset.rep); };
}

/* ---------- player deep-dive ---------- */
// From his team's point of view: "2-0" at home, or "0-2" away, is a clean sheet.

          <div>${esc(capitalise(l.label.replace(p.name + ": ", "").replace(p.name + " ", "")))}${l.low_data ? ' <span class="badge warn">low data</span>' : ""}${hitChip(l)}
            <div class="pb"><span style="width:${(100 * l.p).toFixed(1)}%"></span></div></div>
          <div style="text-align:right;font-weight:700">${pct(l.p, 1)}</div><div class="muted" style="text-align:right">${odds(l.fair)}</div>
          <button class="add" data-add="${l.id}" title="Add to slip">${S.slip.includes(l.id) ? "✓" : "+"}</button></div>`).join("")
        : `<div class="note">No legs for this player (goalkeeper, on the bench, or not enough data).</div>`}
    </div>`);
}
function modal(html) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.onclick = (e) => {
    if (e.target === bg || e.target.closest("[data-close]")) return closeModal();
    const h = e.target.closest("[data-hist]"); if (h) return openLegHistory(h.dataset.hist);
    const b = e.target.closest("[data-add]");
    if (b) { addLeg(b.dataset.add); b.textContent = S.slip.includes(b.dataset.add) ? "✓" : "+"; }
  };
  document.body.appendChild(bg);
}
function closeModal() { document.querySelectorAll(".modal-bg").forEach(x => x.remove()); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); $("#watchPop").hidden = true; } });

init();
</script>
</body>
</html>
