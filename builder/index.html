/* ---------- player deep-dive ---------- */
// From his team's point of view: "2-0" at home, or "0-2" away, is a clean sheet.
function cleanSheet(g) { const s = /^(\d+)-(\d+)$/.exec(g.score || ""); return !!s && +(g.home ? s[2] : s[1]) === 0; }
function openPlayer(side, name) {
  const m = S.match, p = (m.players[side] || []).find(x => x.name === name); if (!p) return;
  const games = [...(p.recent || [])].reverse();   // oldest -> newest, left to right
  const keeper = p.pos === "G", bars = keeper ? "saves" : "shots";   // a keeper's chart shows saves
  const top = Math.max(4, ...games.map(g => g[bars] || 0));
  const team = side === "home" ? m.home : m.away;
  const date = (ts) => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
  const extras = (g) => g.fouls === undefined ? "" : `\n${g.assists} assist${g.assists === 1 ? "" : "s"} · ${g.fouls} fouls · fouled ${g.fouled}× · ${g.tackles} tackles · ${g.offsides} offside${g.offsides === 1 ? "" : "s"}${keeper ? ` · ${g.saves} saves` : ""}`;
  const cols = games.map(g => `<div class="col" title="${esc(`${date(g.ts)} · ${g.comp}\n${g.home ? "vs" : "at"} ${g.opp} ${g.score}\n${g.minutes}' played${g.sub_in ? " (off the bench)" : ""} · ${g.shots} shots · ${g.sot} on target · ${g.goals} goal${g.goals === 1 ? "" : "s"} · xG ${(g.xg || 0).toFixed(2)}${g.yellow ? " · booked" : ""}${extras(g)}`)}">
      <div class="marks">${"⚽".repeat(Math.min(g.goals, 3))}${"🅰️".repeat(Math.min(g.assists || 0, 2))}${g.yellow ? "🟨" : ""}${g.red ? "🟥" : ""}</div>
      <div class="num">${g[bars] || 0}</div>
      <div class="bw"><div class="bar" style="height:${100 * (g[bars] || 0) / top}%">${keeper ? "" : `<div class="sotb" style="height:${g.shots ? 100 * g.sot / g.shots : 0}%"></div>`}</div></div>
    </div>`).join("");
  const labels = games.map(g => `<div title="${esc(g.opp)}">${g.home ? "" : "@"}${esc(g.opp)}<br>${g.minutes}'${g.sub_in ? " sub" : ""}</div>`).join("");
  const n = games.length, count = (f) => games.filter(f).length;
  const hit = (label, k) => `<div class="tile"><div class="k">${label}</div><div class="v">${k}/${n}</div></div>`;
  const legs = legsFor(side, name).sort((a, b) => b.p - a.p);
  modal(`<div class="mhead"><div class="ph">${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.remove()">` : ""}</div>
      <div><div style="font-size:20px;font-weight:800">${esc(p.name)} <span class="pos">${esc(p.pos)}</span></div>
        <div class="muted">${esc(team)} · ${p.status === "Starting" ? "starting" : "on the bench"} · ${!p.has_data ? "no recent data"
          : keeper ? (p.sv90 != null ? `${p.sv90.toFixed(1)} saves per 90 · ${Math.round(p.minutes)} min in his last 20 games` : `${Math.round(p.minutes)} min in his last 20 games`)
          : `${p.sh90.toFixed(1)} shots · ${p.sot90.toFixed(1)} on target · ${p.g90.toFixed(2)} xG per 90${p.x ? ` · ${p.x.assists.toFixed(2)} assists · ${p.x.fouls.toFixed(1)} fouls · ${p.x.tackles.toFixed(1)} tackles` : ""} · ${Math.round(p.minutes)} min in his last 20 games`}</div></div>
      <button class="x" data-close title="Close">✕</button></div>
    ${n ? `<div class="chart">${cols}</div><div class="xlabels">${labels}</div>
      <div class="legend">${keeper ? `<span><i style="background:#3a4a55"></i>saves</span>`
          : `<span><i style="background:var(--accent)"></i>on target</span><span><i style="background:#3a4a55"></i>off target / blocked</span>`}
        <span>⚽ goal · 🅰️ assist · 🟨 booked · hover a bar for details</span><span style="margin-left:auto">oldest → newest</span></div>
      <div class="hits">${keeper && games[0].saves !== undefined
          ? hit("2+ saves", count(g => g.saves >= 2)) + hit("3+ saves", count(g => g.saves >= 3)) + hit("4+ saves", count(g => g.saves >= 4)) + hit("Clean sheet", count(g => cleanSheet(g)))
          : hit("1+ shots", count(g => g.shots >= 1)) + hit("1+ on target", count(g => g.sot >= 1)) + hit("Scored", count(g => g.goals >= 1))
            + (games[0].assists !== undefined ? hit("Assisted", count(g => g.assists >= 1)) : hit("2+ shots", count(g => g.shots >= 2)))}</div>
      ${!keeper && games[0].fouls !== undefined ? `<div class="hits" style="margin-top:8px">${hit("1+ fouls", count(g => g.fouls >= 1))}${hit("Fouled 1+", count(g => g.fouled >= 1))}${hit("1+ tackles", count(g => g.tackles >= 1))}${hit("2+ tackles", count(g => g.tackles >= 2))}</div>` : ""}`
      : `<div class="note">No recent match data for this player.</div>`}
    <div style="margin-top:16px"><h3 style="margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">HAWK legs for ${esc(p.name)}</h3>
      ${legs.length ? legs.map(l => `<div class="lrow" style="grid-template-columns:1fr 64px 56px 30px">
          <div>${esc(capitalise(l.label.replace(p.name + ": ", "").replace(p.name + " ", "")))}${l.low_data ? ' <span class="badge warn">low data</span>' : ""}
            <div class="pb"><span style="width:${(100 * l.p).toFixed(1)}%"></span></div></div>
          <div style="text-align:right;font-weight:700">${pct(l.p, 1)}</div><div class="muted" style="text-align:right">${odds(l.fair)}</div>
          <button class="add" data-add="${l.id}" title="Add to slip">${S.slip.includes(l.id) ? "✓" : "+"}</button></div>`).join("")
        : `<div class="note">No legs for this player (goalkeeper, on the bench, or not enough data).</div>`}
    </div>`);
}
function modal(html) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.onclick = (e) => {
    if (e.target === bg || e.target.closest("[data-close]")) return closeModal();
    const b = e.target.closest("[data-add]");
    if (b) { addLeg(b.dataset.add); b.textContent = S.slip.includes(b.dataset.add) ? "✓" : "+"; }
  };
  document.body.appendChild(bg);
}
function closeModal() { document.querySelectorAll(".modal-bg").forEach(x => x.remove()); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); $("#watchPop").hidden = true; } });

init();
</script>
</body>
</html>
