<!-- Tab icon, drawn for 16px. The shield fills the whole frame: no margin and no
     black plate behind it, because a tab gives you sixteen pixels and any spent
     on a border is how the mark ends up looking tiny. The hawk is cut out of the
     gold with its wings reaching both edges, so at 16px the shape still reads as
     wings rather than as a smudge. The full mark with the outer ring lives in
     hawk-logo.svg; icon.svg is the app icon, black plate and all, and belongs on
     a home screen rather than in a tab. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#c99700"/></linearGradient></defs><path d="M32 1 L62 10 V36 C62 50 48 60 32 63 C16 60 2 50 2 36 V10 Z" fill="url(#m)"/><path d="M32 15 L36 21 L32 25 L28 21 Z M30 27 L6 17 L13 26 L6 28 L16 34 L30 39 Z M34 27 L58 17 L51 26 L58 28 L48 34 L34 39 Z M28 42 L32 54 L36 42 L32 45 Z" fill="#0a0a0a"/></svg>
