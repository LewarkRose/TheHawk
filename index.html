<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAWK</title>
<meta name="description" content="Every bet, priced honestly.">
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest?v=6">
<meta name="theme-color" content="#080809">
<!-- Belt and braces: the meta refresh fires with JavaScript off, the script
     fires immediately, and the link below is there if a browser does neither.
     GitHub Pages has no server, so a redirect has to be a page. -->
<meta http-equiv="refresh" content="0; url=./home/">
<link rel="canonical" href="./home/">
<style>
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:#080809;color:#8b8b95;
    font:400 13px/1.8 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  a{color:#f2dba4}
  .m{font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.2em;text-transform:uppercase;color:#55555f}
</style>
</head>
<body>
  <div>
    <p class="m">HAWK</p>
    <p>Taking you to <a href="./home/">the Home page</a>.</p>
  </div>
<script>
  // Carry a hash through, in case something was linked with one.
  location.replace("./home/" + (location.hash || ""));
</script>
</body>
</html>
