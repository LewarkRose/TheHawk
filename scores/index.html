<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scores · HAWK</title>
<meta name="description" content="Every match in HAWK's competitions, live and finished.">
<link rel="icon" href="../assets/hawk-mark.svg">
<link rel="manifest" href="../manifest.webmanifest?v=6">
<meta name="theme-color" content="#080809">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/hawk.css">
</head>
<body>

<header class="hero">
  <canvas aria-hidden="true" data-bg="ground"></canvas>
  <div class="wrap">
    <div class="hsplit">
      <div>
        <span class="tag" id="tag"><span class="dot off"></span>Reading the card</span>
        <h1 class="moment mid" id="title">Today's<span class="q">card</span></h1>
        <p class="said" id="said">Asking 365Scores what is on…</p>
        <div class="days" id="days">
          <button type="button" data-off="-1">Yesterday</button>
          <button type="button" data-off="0" aria-pressed="true">Today</button>
          <button type="button" data-off="1">Tomorrow</button>
          <input type="date" id="pick" aria-label="Pick a date">
        </div>
      </div>

      <!-- the shape of the day: how it splits, and where the upsets are. A
           ledger of eighty rows does not tell you that at a glance, and this
           is the only question the hero can answer that the rows cannot. -->
      <div class="hlead" id="shape" hidden>
        <div class="top q" id="shapeTop"><span class="d"></span><span id="shapeWhen">The day</span></div>
        <div class="dayshape" id="shapeBars"></div>
        <div class="foot2" id="shapeFoot"></div>
      </div>
    </div>
  </div>
</header>

<section class="calm">
  <div class="wrap">
    <!-- competition groups, then the bands inside the group you chose, then
         the competitions inside that if you have narrowed to one group -->
    <div class="filt" id="groups"></div>
    <div class="filt" id="bands" style="margin-top:14px;border-bottom:0"></div>
    <div class="filt sub" id="comps"></div>
    <div id="board" style="margin-top:26px"><div class="skel">Reading…</div></div>
  </div>
</section>

<footer class="foot">
  <div class="wrap"><a href="../home/">home</a> · <a href="../acca/">acca</a> ·
    <a href="../vault/">vault</a> ·
    live scores refresh every 60 seconds</div>
</footer>

<script src="../builder/engine.js"></script>
<script src="../assets/hawk-bg.js"></script>
<script src="../assets/hawk-alerts.js"></script>
<script src="../assets/hawk-table.js"></script>
<script src="../assets/hawk-nav.js"></script>
<script>
/* ===========================================================================
   Scores — every match in HAWK's competitions for a day.

   A ledger, not a grid: eighty-odd matches across twenty-odd competitions, one
   ruled line each, every score on the same vertical line. That alignment is
   why it reads faster than cards, and it is the shape chosen for this page.

   HAWK's own read sits on each row as a three-way bar, but only for matches it
   has a saved prediction for — predictions.json is written before kick-off by
   the build, so a fixture it never saw simply has no bar rather than a made-up
   one.
   =========================================================================== */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const pad = (n) => String(n).padStart(2, "0");
  const localDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayFrom = (o) => { const d = new Date(); d.setDate(d.getDate() + o); return localDay(d); };
  const hhmm = (iso) => { const t = Date.parse(iso); return Number.isFinite(t)
    ? new Date(t).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : ""; };
  // "match" pluralises to "matches", not "matchs"
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : /(ch|sh|s|x|z)$/.test(w) ? "es" : "s"}`;
  const pc100 = (a) => {
    const v = a.map((x) => 100 * (x || 0)), r = v.map(Math.round);
    let d = 100 - r.reduce((x, y) => x + y, 0);
    while (d) { const i = v.map((x, k) => [Math.abs(x - r[k]), k]).sort((p, q) => q[0] - p[0])[0][1];
      r[i] += d > 0 ? 1 : -1; d += d > 0 ? -1 : 1; }
    return r;
  };

  /* 365Scores' statusGroup: 2 not started, 3 in play, 4 finished. The bands
     are the ones you actually sort a day by. */
  const band = (g) => {
    if (g.status === 3) return "live";
    if (g.status === 4) return "done";
    const t = Date.parse(g.kickoff || 0) || 0;
    return t && t - Date.now() <= 3600e3 ? "soon" : "next";
  };
  const BANDS = [["all", "All"], ["live", "Live"], ["soon", "Next hour"],
                 ["next", "Later"], ["done", "Finished"]];

  /* Twenty-odd competitions is too many chips to be a filter; the engine
     already groups them the way you think about them, so the groups are the
     chips and the engine stays the one place that decides what "Top 5" is. */
  const GROUPS = (window.HAWK && window.HAWK.LEAGUE_GROUPS) || [];
  const GROUP_OF = (() => {
    const m = {};
    for (const gr of GROUPS) for (const l of gr.leagues || []) m[l] = gr.key;
    return (league) => m[league] || "other";
  })();

  const S = { day: dayFrom(0), games: [], preds: null, group: "all", band: "all", comp: "all", timer: 0 };

  /* HAWK's pre-match read, when the build saved one for this fixture */
  async function predictions() {
    if (S.preds) return S.preds;
    try {
      const r = await fetch("../data/predictions.json", { cache: "no-store" });
      S.preds = r.ok ? await r.json() : {};
    } catch { S.preds = {}; }
    return S.preds;
  }
  // predictions.json is { updated, matches: { "<id>": { probs, level, kickoff } } }
  const predOf = (id) => {
    const m = S.preds && (S.preds.matches || S.preds.m);
    return (m && m[String(id)]) || null;
  };
  const readOf = (id) => { const p = predOf(id); return p && p.probs ? p.probs : null; };

  /* ⚡ The upset radar. `level` has been in predictions.json all along —
     0 low, 1 medium, 2 high, 3 very high — and this page fetched it and
     ignored it. Across a real day: 151 low, 63 medium, 49 high, 21 very
     high, so a quarter of the card is 2+. Level 3 is the loud one and 2 is
     a nudge, because a flag on a quarter of the rows is not a flag. */
  const UPSET_SAY = ["", "", "High — the favourite is beatable here",
                     "Very high — HAWK rates the underdog's chances well above the price"];
  const upsetFlag = (id) => {
    const p = predOf(id);
    const lv = p && Number.isFinite(p.level) ? p.level : null;
    if (!(lv >= 2)) return `<span class="upf"></span>`;
    return `<span class="upf lv${lv}" title="Upset radar · ${esc(UPSET_SAY[lv])}">⚡</span>`;
  };

  function row(g) {
    const b = band(g), [sh, sa] = g.score || [];
    const have = Number.isFinite(sh) && Number.isFinite(sa);
    const hc = have && sh < sa ? " lost" : "", ac = have && sa < sh ? " lost" : "";
    const mid = have ? `${sh}<em>–</em>${sa}` : b === "done" ? "–<em>–</em>–" : "v";
    const state = b === "live" ? esc(g.clock || "Live")
      : b === "done" ? "FT"
      : esc(hhmm(g.kickoff) || "TBC");
    const href = `${b === "live" ? "../live/" : "../match/"}`
      + `?league=${encodeURIComponent(g.league || "")}&id=${encodeURIComponent(g.id)}`;

    /* HAWK's read: the bar for the shape, then one line naming who it
       favours. Three figures on eighty rows is a wall of digits; a name and
       a number is the same thing said the way you would say it. All three
       are still on the bar's tooltip. */
    const pr = predOf(g.id);
    const p = pr && pr.probs ? pr.probs : null;
    let read = `<span class="read3"><span class="sbar none"></span></span>`;
    if (p) {
      const v = pc100([p.home, p.draw, p.away]);
      const top = v.indexOf(Math.max(...v));
      /* "Newcastle United 38%" is a thin thing to call a favourite, and it
         read oddly next to "Crystal Palace 62% not to lose" on the same row.
         Under 40%, or within 5 points of the other side, nobody is favourite
         and the line says so instead of pretending. */
      const spread = Math.abs(v[0] - v[2]);
      const tossUp = v[top] < 40 || (top !== 1 && spread <= 5);
      const favName = tossUp ? "Toss-up" : [g.home, "Draw", g.away][top];
      const favCls = tossUp ? " q" : top === 0 ? " h" : top === 2 ? " a" : "";

      /* The radar, in the same voice: which side is the underdog and how
         often they come out of it without losing — their own win plus the
         draw. Both figures come from this same saved read, so the line can
         never disagree with the bar above it. */
      const lv = Number.isFinite(pr.level) ? pr.level : null;
      const dogIsHome = (p.home || 0) < (p.away || 0);
      const dogName = dogIsHome ? g.home : g.away;
      const notLose = Math.round(100 * ((dogIsHome ? p.home : p.away) + (p.draw || 0)));
      const ups = lv >= 2
        ? `<span class="ups" title="Upset radar · ${esc(UPSET_SAY[lv] || "")}">
             <span class="${lv >= 3 ? "lv3" : ""}">⚡</span><span class="ar">${dogIsHome ? "◀" : "▶"}</span>
             <span class="nm">${esc(dogName)}</span><b>${notLose}% not to lose</b></span>`
        : "";

      /* favCls goes on the LINE as well as on the figure: home is the left of
         the row and away is the right, so the read sits under the side it is
         picking. The eagle walks to whoever it fancies, and a glance down the
         card tells you which way a league is leaning without reading a word.
         A toss-up has no side to stand on, so it stays in the middle. */
      /* ===================================== FINISHED: HAWK MARKS ITSELF
         Once a match is over, "River Plate 62%" is a prediction with nothing
         at stake — the result is RIGHT THERE two inches to the left. So a
         finished row stops forecasting and starts reporting: all three of
         HAWK's figures, a tick or a cross against what actually happened,
         and whether the upset radar earned its flag.

         It is the only place HAWK grades itself in the open, on every row,
         whether it looks good or not. A ✗ next to 42% is the whole point:
         a model that only shows you its hits is a model you cannot read. */
      if (b === "done" && have) {
        const got = sh > sa ? 0 : sh === sa ? 1 : 2;        // what the match did
        const hit = top === got;
        const hd = ["H", "D", "A"];
        const trio = v.map((n, i) => `<span${i === got ? ' class="was"' : ""}>${
          hd[i]}<b>${n}</b></span>`).join("<i>·</i>");
        /* The radar's own verdict, scored on its own terms: it never says the
           underdog WINS, it says they are live — so not losing is the call,
           and that is what it gets marked on. */
        const dogSurvived = dogIsHome ? sh >= sa : sa >= sh;
        const radar = lv >= 2
          ? `<span class="verdict ${dogSurvived ? "hit" : "miss"}"><span class="lt">⚡</span>${
              dogSurvived ? `called it · <b>${notLose}%</b>` : "missed"}</span>`
          : "";
        read = `<span class="read3 done" title="HAWK before kick-off: ${esc(g.home)} ${v[0]}% · draw ${v[1]}% · ${esc(g.away)} ${v[2]}%">
          <span class="sbar"><i class="h" style="flex:${p.home || 0}"></i><i class="d" style="flex:${
            p.draw || 0}"></i><i class="a" style="flex:${p.away || 0}"></i></span>
          <span class="trio"><span class="mark">🦅</span>${trio}<i class="${
            hit ? "ok" : "no"}">${hit ? "✓" : "✗"}</i></span>
          ${radar}</span>`;
      } else {
        read = `<span class="read3${favCls}" title="HAWK before kick-off: ${esc(g.home)} ${v[0]}% · draw ${v[1]}% · ${esc(g.away)} ${v[2]}%">
          <span class="sbar"><i class="h" style="flex:${p.home || 0}"></i><i class="d" style="flex:${
            p.draw || 0}"></i><i class="a" style="flex:${p.away || 0}"></i></span>
          <span class="say${favCls}"><span class="mark">🦅</span>
            <span class="nm">${esc(favName)}</span>${tossUp ? "" : `<b>${v[top]}%</b>`}</span>
          ${ups}</span>`;
      }
    }

    const crest = (u) => (u ? `<img src="${esc(u)}" alt="" onerror="this.remove()">` : "");
    const followed = window.HAWKAlerts && window.HAWKAlerts.followState(g.id);
    // before kick-off the bell arms the LINEUPS, not the goals — see the click
    // handler. `watched` is that alert already set; `pre` is "it could be".
    const pre = b !== "live" && b !== "done";
    const watched = !!(window.HAWKAlerts && window.HAWKAlerts.isWatched(g.id));

    return `<a class="lg-row is-${b}" href="${href}">
      <span class="t">${esc(hhmm(g.kickoff))}</span>
      <span class="h${hc}"><span>${esc(g.home)}</span>${crest(g.homeCrest)}</span>
      <span class="s">${mid}</span>
      <span class="a${ac}">${crest(g.awayCrest)}<span>${esc(g.away)}</span></span>
      <span class="st">${state}</span>
      <!-- Filled in by xiSweep() below, and only for the handful of matches
           where the answer can change in the next hour. Empty until then. -->
      <span class="xi" data-xi="${esc(g.id)}"></span>
      <button class="fol-b${followed && (followed.on || followed.bet) || watched ? " on" : ""}" type="button"
        data-bell="${esc(g.id)}" title="${followed && followed.bet
          ? "You have a bet on this match — its alerts stay on"
          : watched ? "Waiting on the XIs, then goals. Click to turn off."
          : followed && followed.on ? "Alerts on. Click to turn off."
          : pre ? "Tell me when both XIs are confirmed, then goals and red cards"
          : "Goals and red cards on this match"}">🔔</button>
      <!-- HAWK's read goes UNDERNEATH, on its own line, and it is last in the
           markup so the grid can put it there: the fixture and the score get
           the full width of the row to themselves, and the prediction stops
           competing with them for the same horizontal band. -->
      ${read}</a>`;
  }

  const chip = (attr, key, label, { icon = "", n = null, on = false, dead = false } = {}) =>
    `<button type="button" data-${attr}="${esc(key)}" aria-pressed="${String(on)}"${dead ? " disabled" : ""}>${
      icon}${esc(label)}${n == null ? "" : `<i>${n}</i>`}</button>`;

  /* ------------------------------------------- the hero's right half
     The shape of the day. The ledger below answers "what is the score";
     this answers "what kind of day is it" — how it splits between in play,
     about to start, later and done, and how many of them HAWK rates as
     live upsets. Neither question is answerable from the other. */
  function paintShape(all) {
    if (!all.length) { $("#shape").hidden = true; return; }
    const n = { live: 0, soon: 0, next: 0, done: 0 };
    for (const g of all) n[band(g)]++;
    const biggest = Math.max(1, ...Object.values(n));
    const rows = [["live", "In play"], ["soon", "Next hour"], ["next", "Later"], ["done", "Finished"]];
    $("#shapeWhen").textContent = S.day === dayFrom(0) ? "The day so far" : "The day";
    $("#shapeBars").innerHTML = rows.map(([k, t]) => `<div class="row ${k}">
      <span class="k">${t}</span>
      <span class="t"><i style="width:${(100 * n[k] / biggest).toFixed(1)}%"></i></span>
      <span class="n">${n[k]}</span></div>`).join("");

    // upsets HAWK has flagged on this day's fixtures, from the same saved
    // reads the ⚡ on each row uses — not a second opinion
    let hot = 0, veryHot = 0;
    for (const g of all) {
      const p = predOf(g.id);
      const lv = p && Number.isFinite(p.level) ? p.level : null;
      if (lv === 2) hot++; else if (lv >= 3) veryHot++;
    }
    const comps = new Set(all.map((g) => g.league || "Other")).size;
    $("#shapeFoot").innerHTML =
      `<div><div class="k">Matches</div><div class="v">${all.length}</div></div>`
      + `<div><div class="k">Competitions</div><div class="v">${comps}</div></div>`
      + (hot + veryHot
        ? `<div><div class="k">Upset radar</div><div class="v g">⚡ ${hot + veryHot}</div></div>`
        : `<div><div class="k">Upset radar</div><div class="v">none flagged</div></div>`);
    $("#shape").hidden = false;
  }

  function paint() {
    const all = S.games;
    paintShape(all);

    /* 1. the groups, counted over the whole day — so the row tells you where
       the day actually is before you press anything. A group with nothing on
       still shows, greyed: its absence is information too. */
    const gc = {};
    for (const g of all) { const k = GROUP_OF(g.league); gc[k] = (gc[k] || 0) + 1; }
    if (S.group !== "all" && !gc[S.group]) { S.group = "all"; S.comp = "all"; }
    const rows = GROUPS.map((gr) => [gr.key, gr.name, gr.icon])
      .concat(gc.other ? [["other", "Other", ""]] : []);
    $("#groups").innerHTML =
      chip("group", "all", "All", { n: all.length, on: S.group === "all" })
      + rows.map(([k, name, icon]) => chip("group", k, name,
          { icon: icon ? `<span class="ic">${icon}</span>` : "",
            n: gc[k] || 0, on: S.group === k, dead: !gc[k] })).join("");

    /* 2. the bands, counted INSIDE the group you chose */
    const byGroup = all.filter((g) => S.group === "all" || GROUP_OF(g.league) === S.group);
    const counts = { all: byGroup.length };
    for (const g of byGroup) { const b = band(g); counts[b] = (counts[b] || 0) + 1; }
    if (S.band !== "all" && !counts[S.band]) S.band = "all";
    $("#bands").innerHTML = BANDS.filter(([k]) => k === "all" || counts[k])
      .map(([k, t]) => chip("band", k, t,
        { icon: k === "live" ? `<span class="lv"></span>` : "", n: counts[k] || 0, on: S.band === k })).join("");

    /* 3. the competitions, only once you have narrowed to one group — at the
       top level there are twenty of them and the groups are the better answer */
    const byBand = byGroup.filter((g) => S.band === "all" || band(g) === S.band);
    const comps = [...new Set(byBand.map((g) => g.league || "Other"))].sort();
    if (S.comp !== "all" && !comps.includes(S.comp)) S.comp = "all";
    $("#comps").innerHTML = S.group !== "all" && comps.length > 1
      ? chip("comp", "all", `All ${comps.length}`, { on: S.comp === "all" })
        + comps.map((c) => chip("comp", c, c,
            { n: byBand.filter((g) => (g.league || "Other") === c).length, on: S.comp === c })).join("")
      : "";

    const list = byBand.filter((g) => S.comp === "all" || (g.league || "Other") === S.comp);
    if (!list.length) {
      $("#board").innerHTML = `<p class="note" style="margin:0">Nothing here.</p>`;
      return;
    }
    const ko = (g) => Date.parse(g.kickoff || 0) || 0;
    const order = { live: 0, soon: 1, next: 2, done: 3 };

    // grouped by competition, each ordered by kick-off; competitions ordered by
    // whichever has something happening soonest
    const by = new Map();
    for (const g of list) {
      const k = g.league || "Other";
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(g);
    }
    const rank = (l) => Math.min(...l.map((g) => order[band(g)] * 1e13 + (ko(g) || 1e12)));
    const groups = [...by.entries()].map(([name, l]) => ({ name, l: l.sort((a, b) => ko(a) - ko(b)) }))
      .sort((a, b) => rank(a.l) - rank(b.l));

    $("#board").innerHTML = groups.map((gr) => `<section class="lg-sec">
      <div class="lg-h"><h3>${esc(gr.name)}</h3><span class="n">${gr.l.length}</span>
        <button class="tbtn" type="button" data-table="${esc(gr.name)}">Table</button></div>
      ${gr.l.map(row).join("")}</section>`).join("");
    xiSweep(list);
  }

  /* ===================================================== the XI mark
     "Both XIs are in" beside the bell, because it is the moment a build is
     worth making — and the moment a player leg can quietly die.

     STRICTLY BOUNDED, and that is the whole design. HAWK.lineups() is a
     network call per match, and on 365Scores a near-kick-off one can make a
     SECOND call to ESPN; a card of 84 fixtures would therefore fire up to
     168 requests on every repaint, which is how you get rate-limited out of
     your own feed. So it asks only where the answer can change — kicking off
     inside the next two hours, not started — takes the soonest 10 of those,
     and remembers each answer. Everything else keeps an empty span.

     Confirmed is also not quite true: 365Scores will call a predicted XI
     confirmed a day out and downgrade it later, which is why the engine
     cross-checks ESPN and reports which source said so. The mark carries
     that in its tooltip rather than claiming more than it knows. */
  const XI = new Map();                       // id -> {confirmed, source, at}
  const XI_TTL = 4 * 60e3;
  let xiBusy = false;
  async function xiSweep(games) {
    if (xiBusy || !window.HAWK || !window.HAWK.lineups) return;
    const now = Date.now();
    const due = games
      .filter((g) => {
        const ko = Date.parse(g.kickoff || "");
        if (!Number.isFinite(ko) || band(g) !== "soon" && band(g) !== "next") return false;
        if (ko < now || ko - now > 2 * 3600e3) return false;      // too late, or too far off
        const seen = XI.get(String(g.id));
        return !(seen && (seen.confirmed || now - seen.at < XI_TTL));
      })
      .sort((a, b) => Date.parse(a.kickoff) - Date.parse(b.kickoff))
      .slice(0, 10);
    if (!due.length) { xiPaint(); return; }
    xiBusy = true;
    try {
      for (const g of due) {
        let st = null;
        try { st = await window.HAWK.lineups(g.id); } catch { /* ask again next paint */ }
        XI.set(String(g.id), { confirmed: !!(st && st.confirmed), source: (st && st.source) || "", at: Date.now() });
        xiPaint();
      }
    } finally { xiBusy = false; }
  }
  /* Three states, not two. Blank for a match where the question is not live
     yet; a dim XI once HAWK is watching for them, which says "asked, not out
     yet" rather than leaving you wondering whether the feature works; and a
     lit one when both are in. A control that is invisible until the moment it
     fires looks broken for the hour before it. */
  function xiPaint() {
    for (const el of document.querySelectorAll("[data-xi]")) {
      const s = XI.get(el.dataset.xi);
      if (!s) { el.textContent = ""; el.className = "xi"; el.removeAttribute("title"); continue; }
      el.textContent = "XI";
      el.className = s.confirmed ? "xi on" : "xi wait";
      el.title = s.confirmed
        ? `Both XIs confirmed${s.source ? ` — ${s.source}` : ""}. This is the moment a build is worth making.`
        : "Lineups not out yet — HAWK is watching. They usually land about an hour before kick-off.";
    }
  }

  function headline() {
    const g = S.games;
    const live = g.filter((x) => band(x) === "live").length;
    const soon = g.filter((x) => band(x) === "soon").length;
    const done = g.filter((x) => band(x) === "done").length;
    const comps = new Set(g.map((x) => x.league || "Other")).size;

    const d = new Date(S.day + "T12:00:00");
    const off = Math.round((d - new Date(localDay(new Date()) + "T12:00:00")) / 86400e3);
    const word = off === 0 ? "Today's" : off === -1 ? "Yesterday's" : off === 1 ? "Tomorrow's"
      : `${d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}`;
    $("#title").innerHTML = `${esc(word)}<span class="q">card</span>`;

    $("#tag").innerHTML = live
      ? `<span class="dot"></span>${live} in play`
      : `<span class="dot q"></span>${plural(g.length, "match")}`;
    $("#said").innerHTML = !g.length
      ? "No matches in HAWK's competitions on this day."
      : `<b>${plural(g.length, "match")}</b> across <b>${plural(comps, "competition")}</b>`
        + (live ? ` · <b class="live">${live} in play</b>` : "")
        + (soon ? ` · ${soon} within the hour` : "")
        + (done ? ` · ${done} finished` : "") + ".";
  }

  async function load() {
    if (!(window.HAWK && window.HAWK.scores)) {
      $("#said").textContent = "The model didn't load, so the card can't be read.";
      return;
    }
    await predictions();
    let g;
    try { g = await window.HAWK.scores(S.day); }
    catch { $("#said").textContent = "365Scores didn't answer just now. Try again in a moment."; return; }
    S.games = (g || []).filter((x) => x && x.home && x.away);
    headline();
    paint();
    clearTimeout(S.timer);
    if (S.games.some((x) => band(x) === "live")) S.timer = setTimeout(load, 60000);
  }

  /* -------------------------------------------------------------- events */
  $("#days").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-off]");
    if (!b) return;
    S.day = dayFrom(+b.dataset.off);
    $("#pick").value = S.day;
    for (const x of document.querySelectorAll("#days button")) x.setAttribute("aria-pressed", String(x === b));
    S.band = "all"; S.comp = "all";
    $("#board").innerHTML = `<div class="skel">Reading…</div>`;
    load();
  });
  $("#pick").addEventListener("change", (e) => {
    if (!e.target.value) return;
    S.day = e.target.value;
    for (const x of document.querySelectorAll("#days button")) x.setAttribute("aria-pressed", "false");
    S.band = "all"; S.comp = "all";
    load();
  });
  document.addEventListener("click", async (e) => {
    // the bell sits inside the row's link, so it has to claim the click
    // before the row does, or turning alerts on also opens the match
    const bell = e.target.closest("[data-bell]");
    if (bell) {
      e.preventDefault(); e.stopPropagation();
      const A = window.HAWKAlerts;
      if (!A) return;
      const id = bell.dataset.bell;
      /* LINEUPS FIRST, before kick-off — the same rule the match page's own
         bell follows. This one called toggleFollow() unconditionally, so a
         match six hours away could only ever be armed for goals, and the
         Scores list is exactly where you arm tonight's card. The XIs are the
         thing you are waiting for at that hour: they are the last moment a
         build is worth making, and the moment a player leg can quietly die.
         Once it has kicked off there is no lineup left to wait for, so it
         falls through to goals as before. */
      const g = (S.games || []).find((x) => String(x.id) === String(id));
      const st = A.followState(id);
      if (g && band(g) !== "live" && band(g) !== "done" && !st.bet) {
        await A.toggleWatch({ id, league: g.league, home: g.home, away: g.away });
        bell.classList.toggle("on", A.isWatched(id));
      } else {
        const now = await A.toggleFollow(id);
        bell.classList.toggle("on", !!(now && (now.on || now.bet)));
      }
      return;
    }

    // each row resets the rows beneath it — narrowing to Top 5 and keeping a
    // competition from World would leave an empty board and no reason for it
    const gr = e.target.closest("#groups button[data-group]");
    if (gr) { S.group = gr.dataset.group; S.band = "all"; S.comp = "all"; paint(); return; }
    const b = e.target.closest("#bands button[data-band]");
    if (b) { S.band = b.dataset.band; S.comp = "all"; paint(); return; }
    const c = e.target.closest("#comps button[data-comp]");
    if (c) { S.comp = c.dataset.comp; paint(); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) clearTimeout(S.timer); else load();
  });

  $("#pick").value = S.day;
  load();
})();
</script>
</body>
</html>
